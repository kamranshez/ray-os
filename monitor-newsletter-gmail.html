<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>/monitor newsletter options</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #f6f8fc;
    --surface: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d5d9e0;
    --text: #202124;
    --text-muted: #5f6368;
    --text-subtle: #80868b;
    --accent: #1a73e8;
    --accent-bg: #e8f0fe;
    --accent-bg-strong: #d3e3fd;
    --hover: #f1f3f4;
    --shadow: 0 1px 2px 0 rgba(60,64,67,.08), 0 1px 3px 1px rgba(60,64,67,.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    overflow: hidden;
  }

  /* Gmail topbar */
  .gmail-topbar {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    height: 56px;
    flex-shrink: 0;
  }
  .gmail-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    color: var(--text-muted);
    font-weight: 400;
    min-width: 220px;
  }
  .gmail-logo svg { width: 32px; height: 32px; }
  .search-bar {
    flex: 1;
    max-width: 720px;
    margin: 0 32px;
    background: #eaf1fb;
    border-radius: 8px;
    padding: 10px 16px;
    color: var(--text-subtle);
    font-size: 14px;
  }
  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mode-toggle {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    padding: 3px;
  }
  .mode-toggle button {
    background: transparent;
    border: none;
    padding: 6px 16px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
  }
  .mode-toggle button.active {
    background: var(--accent-bg-strong);
    color: var(--accent);
  }
  .profile-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffb454 0%, #ea4335 100%);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 500;
    font-size: 14px;
  }

  /* 3-column layout */
  .layout {
    display: grid;
    grid-template-columns: 220px 400px 1fr;
    height: calc(100vh - 56px);
    overflow: hidden;
  }

  /* Column 1: Sidebar */
  .sidebar {
    padding: 16px 0 16px 12px;
    background: var(--bg);
    overflow-y: auto;
  }
  .compose-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px 14px 20px;
    background: #c2e7ff;
    color: #001d35;
    border: none;
    border-radius: 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    font-family: inherit;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 12px 0 26px;
    height: 32px;
    border-radius: 0 16px 16px 0;
    color: var(--text);
    font-size: 14px;
    cursor: default;
  }
  .sidebar-item.active {
    background: var(--accent-bg-strong);
    font-weight: 700;
    color: #001d35;
  }
  .sidebar-item .count {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Column 2: Inbox list */
  .inbox-col {
    background: var(--surface);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .inbox-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    color: var(--text);
    font-size: 13px;
    flex-shrink: 0;
  }
  .inbox-list {
    display: flex;
    flex-direction: column;
  }
  .inbox-row {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    background: var(--surface);
    transition: background 0.12s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .inbox-row:hover { background: var(--hover); }
  .inbox-row.active {
    background: var(--accent-bg);
    border-left: 3px solid var(--accent);
    padding-left: 13px;
  }
  .inbox-row .row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .inbox-row .sender {
    font-weight: 700;
    color: var(--text);
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .inbox-row .time {
    color: var(--text-muted);
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .inbox-row .subject {
    font-weight: 600;
    color: var(--text);
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .inbox-row .preview {
    color: var(--text-muted);
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hook-badge {
    display: inline-block;
    font-size: 10px;
    background: var(--accent-bg);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  /* Column 3: Reading pane */
  .reading-col {
    background: var(--surface);
    overflow-y: auto;
  }
  .email-view {
    display: none;
    padding: 28px 56px 96px;
    max-width: 900px;
  }
  .email-view.active { display: block; }

  /* Per-email subject / preview picker */
  .picker-block {
    background: #fcfcfe;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 24px;
  }
  .picker-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .picker-options {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }
  .picker-options:last-child { margin-bottom: 0; }
  .picker-option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 12px;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1.45;
    color: var(--text);
    transition: all 0.1s ease;
  }
  .picker-option:hover {
    background: var(--hover);
  }
  .picker-option.selected {
    background: var(--accent-bg);
    border-color: var(--accent);
    font-weight: 500;
  }
  .picker-option .num {
    color: var(--text-subtle);
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
    width: 16px;
    margin-top: 1px;
  }
  .picker-option.preview-opt { color: var(--text-muted); }
  .picker-option.preview-opt.selected { color: var(--text); }

  .email-subject {
    font-size: 22px;
    font-weight: 400;
    color: var(--text);
    margin: 0 0 16px;
    line-height: 1.3;
  }
  .email-subject .hook-badge { vertical-align: middle; margin-right: 8px; }
  .email-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 16px;
  }
  .sender-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffb454 0%, #ea4335 100%);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 500;
    font-size: 18px;
    flex-shrink: 0;
  }
  .sender-info { flex: 1; min-width: 0; }
  .sender-name {
    font-weight: 700;
    color: var(--text);
    font-size: 14px;
  }
  .sender-recipient {
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 2px;
  }
  .email-date {
    color: var(--text-muted);
    font-size: 12px;
    white-space: nowrap;
  }
  .email-body {
    font-size: 15px;
    line-height: 1.65;
    color: var(--text);
  }
  .email-body p { margin: 0 0 16px; }
  .email-body .thumb-wrap { margin: 24px 0; }
  .email-body .thumb-wrap img {
    width: 100%;
    max-width: 560px;
    border-radius: 8px;
    display: block;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .email-actions {
    margin-top: 32px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .email-actions button {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 8px 24px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .email-actions button:hover { background: var(--hover); }
  .email-actions button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* Compare mode (side-by-side variations) */
  .compare-view {
    display: none;
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    background: var(--bg);
    padding: 20px;
  }
  .layout.compare-mode { grid-template-columns: 220px 1fr; }
  .layout.compare-mode .inbox-col { display: none; }
  .layout.compare-mode .reading-col { display: none; }
  .layout.compare-mode .compare-view { display: flex; gap: 16px; }

  .compare-card {
    flex: 0 0 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }
  .compare-card-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }
  .compare-card-header .hook-badge { margin-bottom: 8px; }
  .compare-card-header .subj {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 4px;
  }
  .compare-card-header .prev {
    font-size: 12px;
    color: var(--text-muted);
  }
  .compare-card-body {
    padding: 20px 22px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }
  .compare-card-body p { margin: 0 0 12px; }
  .compare-card-body .thumb-wrap img {
    width: 100%;
    border-radius: 6px;
    display: block;
    margin: 12px 0;
    border: 1px solid var(--border);
  }
  .compare-card-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    background: var(--bg);
  }
  .compare-card-footer button {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .compare-card-footer button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  kbd {
    background: #f1f3f4;
    border: 1px solid var(--border-strong);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    color: var(--text-muted);
  }
</style>
</head>

</div>

  const VARIATIONS = [{"hook": "Polling Is Dead", "subjects": ["/loop is dead. Long live /monitor.", "Claude Code just stopped polling", "The quietest big shipping of the week", "Your /loop habit is about to get expensive", "Claude Code can finally watch instead of check"], "previews": ["Event-driven agents, finally.", "One of the biggest shifts since subagents, hiding in a new tool.", "/monitor makes Claude Code event-driven instead of time-driven.", "There's a cheaper way to watch long-running things now.", "Zero tokens until something you care about actually happens."], "body": ["Hey friends,", "Hope you're doing well.", "Quick one this week about a new Claude Code tool that I think is going to quietly replace a lot of how I've been using agents lately.", "It's called /monitor. And the easiest way to explain it is that it makes Claude Code event-driven instead of time-driven.", "[THUMBNAIL]", "Here's what I mean. Before, if I wanted Claude to keep an eye on something like a dev server, a test run, or a deploy, I had two bad options. Option one: run the command in the foreground and get locked out of the terminal until it finished. Option two: run it in the background and only find out at the very end that 3 of my 47 tests failed, ten minutes after the fact.", "Or I'd reach for /loop, which fires a prompt every N minutes and each iteration costs a full API call. Which works, but it's burning tokens the whole time just to check whether anything happened.", "/monitor is different. You give it a description, a command, a timeout, and whether it should persist. Claude writes the filter for you. The filter only prints when something matches. And each print is one event that wakes the main session.", "So if you're running a 10-minute test suite and ask Claude to monitor only for failing tests, the moment a test fails, it gets pulled into the main session and Claude starts diagnosing it, before the other tests have even finished. Zero tokens spent waiting.", "The video goes through the full mechanics, the four parameters under the hood, and the two shapes of monitors (stream filters vs poll-and-if filters). Plus a handful of use cases like file drop watchers, API price alerts, sales launches, and production deploys that I think a lot of you will get value from.", "What's the first thing you're going to point /monitor at? Dev server, test suite, Vercel deploy, or something weirder? Reply and let me know. I'm collecting patterns.", "Talk soon,", "Ray"]}, {"hook": "Agents Finally Sleep", "subjects": ["Your AI agent was sleep-deprived", "Claude Code can finally rest between events", "Stop making your agent pace the corridor", "The end of 'anything new yet?' agents", "Idle agents are cheap agents"], "previews": ["Claude Code can finally rest when there's nothing to do.", "A small change that makes background work feel completely different.", "Your agent stops being a watchman and becomes a motion sensor.", "Every 30-second check used to cost tokens. Not anymore.", "What happens when an agent is allowed to do nothing."], "body": ["Hey friends,", "Hope you've had a good week.", "Here's a slightly weird framing I've been sitting with. Until this week, every Claude Code agent I ran was basically sleep-deprived.", "What I mean is, if I wanted Claude to keep watch over something (a dev server, a deploy, a long test run), it had to stay awake the entire time, checking in every 30 or 60 seconds. Anything new yet? Anything new yet? Each check burning tokens. Each iteration a full API call. And most of them returning nothing.", "[THUMBNAIL]", "There's a new tool called /monitor that flips this. Instead of polling, Claude Code spins up a background process with a filter. That filter quietly runs for free. Zero tokens. And only when something you care about actually happens does it wake the main session up.", "So Claude can actually go idle. Rest. And the moment a test fails, or your Vercel deploy goes red, or the error rate crosses a threshold, it's immediately there, holding the stack trace, ready to diagnose.", "The mental shift that took me a minute to appreciate is that this isn't just polling, but cheaper. It's a completely different shape. Your agent stops being a watchman pacing the corridor and becomes a motion sensor that only fires when something moves.", "In the video I walk through the four parameters of a monitor, how it compares to /loop and backgrounded shell commands, and the use cases I'm personally most excited about (Vercel deploys and long test suites, mostly).", "What long-running thing in your workflow have you been wanting to hand off but didn't trust /loop with? Hit reply and let me know. I try to respond to everyone.", "Talk soon,", "Ray"]}, {"hook": "Motion Sensor", "subjects": ["Like a security camera, but for your terminal", "The motion sensor inside Claude Code", "Your agent as a silent alarm system", "Claude Code now only alerts on motion", "A security guard, or a motion sensor"], "previews": ["Only alerts on motion. Zero tokens when nothing's moving.", "Same outcome as polling, wildly different cost.", "The difference between pacing the perimeter and firing on movement.", "A quieter, cheaper way to keep watch.", "Which one describes your current Claude Code workflow?"], "body": ["Hey friends,", "Hope you're having a good one.", "There's a new tool inside Claude Code called /monitor and the best mental model I've found for it is this: it's a security camera that only alerts on motion.", "Let me explain what I mean by that, because it's a bigger shift than it sounds.", "[THUMBNAIL]", "Before, if you wanted Claude to keep an eye on something, it was essentially polling. Every 30 or 60 seconds, a full API call: anything new? anything broken? anything ready? Each check burning tokens. Most of them returning nothing. It worked, but it felt wasteful, and it was.", "/monitor is event-driven. You describe what you want watched, and Claude Code writes a background process with a filter. The filter is the motion sensor, running silently the entire time for zero tokens. And the moment something you actually care about happens (an error, a failing test, a deploy going red, a price dropping below a threshold), it fires an event that wakes the main session with the context already there.", "The difference between a security guard pacing the perimeter every minute and a motion sensor that only fires when something moves. Same outcome. Wildly different cost.", "In the video I go through the four parameters, the two shapes of monitors you'll end up writing (stream filters for log tailing vs poll-and-if filters for remote APIs), and the use cases that got me most excited: Vercel deploys, long test suites, and watching error rates for a couple of hours after a critical production change.", "What would you want Claude to silently watch for you in the background? The weirder the use case, the more interested I am. Hit reply.", "Have a great week :)", "Ray"]}, {"hook": "Wake On Event", "subjects": ["Claude Code just learned to wake on event", "Wake-on-LAN, but for your workflows", "The quietest but biggest shipping this week", "Your Claude session can now sleep", "Boot up Claude Code on demand, not on timer"], "previews": ["The quietest but biggest shipping this week.", "If you remember Wake-on-LAN, this will feel familiar.", "Sleep until something actually happens.", "A third option between foreground and background.", "A small feature with a big mental model shift."], "body": ["Hey friends,", "Hope you're doing well.", "If you remember the old Wake on LAN feature, the one where your computer could sleep until a signal came in over the network and then boot up instantly, that's pretty much what Claude Code just learned to do. But for your workflows instead of your machine.", "The new feature is called /monitor. And it completely flips how background work gets handled.", "[THUMBNAIL]", "Before, you had two choices. Foreground, which locks you out of the terminal until the command finishes. Or background, which silently runs and only reports back once, right at the end, after everything has already happened. And if you wanted something in between, you'd reach for /loop, which fires a prompt every N minutes and costs a full API call each time. Polling, basically.", "/monitor is a third option, and it's genuinely new. You describe what you want watched, Claude writes a filter, and the filter runs silently in the background for free. Zero tokens. And only when an event you care about actually fires (an error in the dev server, a failing test, a price crossing a threshold) does the main session wake up with the context already there.", "Which means you can start a 10-minute test suite, ask Claude to watch only for failures, and the moment something breaks, it's already diagnosing it. Not waiting until minute ten. Not polling every thirty seconds. Just woken up, on demand, by the actual event.", "In the video I break down the four parameters of a monitor, the two main shapes (stream filter vs poll-and-if filter), and the use cases I'm most excited about: Vercel deploys, long test suites, and post-deploy production monitoring for client work.", "What's the first thing you'd hand off to a /monitor if you could set one up in 30 seconds? Reply and let me know, I'm collecting patterns.", "Have a great week :)", "Ray"]}, {"hook": "The Primitive", "subjects": ["Four parameters that change how you use Claude Code", "Not a feature, a primitive", "The smallest Claude Code shipping that matters most", "A small, composable thing with big downstream effects", "Description, command, timeout, persistent. That's it."], "previews": ["Description, command, timeout, persistent. That's it.", "Once you internalise the four parameters, the mental model shifts.", "Primitives are where the real leverage lives.", "Here's the building block everything else will compose with.", "The kind of shipping that quietly changes your habits."], "body": ["Hey friends,", "Hope you've had a good week.", "Every so often, a new Claude Code feature ships that isn't really a feature, it's a primitive. A small, composable thing that changes what you can build with everything around it. This week's /monitor tool is one of those.", "It takes four parameters. That's it.", "A description of what to watch. A command to run. A timeout. And whether it should persist. Claude writes the filter for you, runs it in the background, and only wakes the main session when something matching fires.", "[THUMBNAIL]", "The reason I keep calling it a primitive rather than a feature is that once you internalise what those four parameters give you, your whole mental model for long-running agent work shifts. It's event-driven, not time-driven. It's wake-on-signal, not poll-and-check. And because the filter runs silently in the background, there's basically no cost until something you actually care about happens.", "Which is wildly different from /loop (time-driven, full API call every N minutes) and different from a plain backgrounded shell command (silent until it exits, then one big dump at the end).", "In the video I go through how the four parameters compose, the two main shapes of monitors (stream filters for log tailing, poll-and-if filters for remote APIs), and the use cases I'm personally most excited about: Vercel deploys, long test suites, file drop watchers, and post-deploy error rate monitoring for client work.", "The short version: this is the first Claude Code feature that's actually changed what I'm comfortable walking away from.", "How are you thinking about which Claude Code features have become primitives in your workflow, versus one-off conveniences? Reply and let me know.", "Talk soon,", "Ray"]}];
  const THUMBNAIL_PATH = "images/monitor-tool-frame-play.jpg";
  const VIDEO_URL = "https://www.youtube.com/watch?v=MpSf7EN5dhc";
  const TOPIC = "/monitor";
  // ============================================================

  const SENDER_NAME = "Ray Amjad";
  const RECIPIENT = "to me";

  // Track currently selected subject + preview index per variation
  const selSubj = VARIATIONS.map(() => 0);
  const selPrev = VARIATIONS.map(() => 0);

  const inboxList = document.getElementById('inbox-list');
  const readingCol = document.getElementById('reading-col');
  const compareView = document.getElementById('compare-view');
  const layout = document.getElementById('layout');

  function buildBodyHtml(body) {
    return body.map(p => {
      if (p === '[THUMBNAIL]') {
        return `<div class="thumb-wrap"><a href="${VIDEO_URL}" target="_blank"><img src="${THUMBNAIL_PATH}" alt="Watch the video" /></a></div>`;
      }
      return `<p>${escapeHtml(p)}</p>`;
    }).join('');
  }

  VARIATIONS.forEach((v, i) => {
    // Inbox row
    const row = document.createElement('div');
    row.className = 'inbox-row' + (i === 0 ? ' active' : '');
    row.dataset.index = i;
    row.innerHTML = `
      <div class="row-top">
        <div class="sender">${SENDER_NAME}</div>
        <div class="time">${timeLabel(i)}</div>
      </div>
      <div class="subject"><span class="hook-badge">${escapeHtml(v.hook)}</span> <span class="subject-text" id="inbox-subj-${i}">${escapeHtml(v.subjects[0])}</span></div>
      <div class="preview" id="inbox-prev-${i}">${escapeHtml(v.previews[0])}</div>
    `;
    row.addEventListener('click', () => selectVariation(i));
    inboxList.appendChild(row);

    // Reading pane view with subject/preview picker
    const view = document.createElement('div');
    view.className = 'email-view' + (i === 0 ? ' active' : '');
    view.dataset.index = i;

    const subjectOpts = v.subjects.map((s, j) =>
      `<div class="picker-option subject-opt ${j === 0 ? 'selected' : ''}" data-var="${i}" data-kind="subj" data-idx="${j}">
        <div class="num">${j + 1}.</div><div>${escapeHtml(s)}</div>
      </div>`
    ).join('');

    const previewOpts = v.previews.map((p, j) =>
      `<div class="picker-option preview-opt ${j === 0 ? 'selected' : ''}" data-var="${i}" data-kind="prev" data-idx="${j}">
        <div class="num">${j + 1}.</div><div>${escapeHtml(p)}</div>
      </div>`
    ).join('');

    view.innerHTML = `
      <div class="picker-block">
        <div class="picker-label">Subject lines · click to preview</div>
        <div class="picker-options">${subjectOpts}</div>
        <div class="picker-label">Preview snippets · click to preview</div>
        <div class="picker-options">${previewOpts}</div>
      </div>

      <h1 class="email-subject">
        <span class="hook-badge">${escapeHtml(v.hook)}</span><br>
        <span id="email-subj-${i}">${escapeHtml(v.subjects[0])}</span>
      </h1>
      <div class="email-meta">
        <div class="sender-avatar">R</div>
        <div class="sender-info">
          <div class="sender-name">${SENDER_NAME}</div>
          <div class="sender-recipient">${RECIPIENT}</div>
        </div>
        <div class="email-date">Fri, ${timeLabel(i)}</div>
      </div>
      <div class="email-body">${buildBodyHtml(v.body)}</div>
      <div class="email-actions">
        <button class="primary" onclick="copyBody(${i}, this)">Copy body</button>
        <button onclick="copyPair(${i}, this)">Copy subject + preview</button>
        <button onclick="copyAll(${i}, this)">Copy all</button>
      </div>
    `;
    readingCol.appendChild(view);

    // Compare card
    const card = document.createElement('div');
    card.className = 'compare-card';
    card.dataset.index = i;
    card.innerHTML = `
      <div class="compare-card-header">
        <div class="hook-badge">${escapeHtml(v.hook)}</div>
        <div class="subj" id="cmp-subj-${i}">${escapeHtml(v.subjects[0])}</div>
        <div class="prev" id="cmp-prev-${i}">${escapeHtml(v.previews[0])}</div>
      </div>
      <div class="compare-card-body">${buildBodyHtml(v.body)}</div>
      <div class="compare-card-footer">
        <button class="primary" onclick="copyCompare(${i}, this)">Copy body</button>
        <button onclick="setMode('inbox'); selectVariation(${i});">Open</button>
      </div>
    `;
    compareView.appendChild(card);
  });

  // Wire up picker clicks (event delegation)
  readingCol.addEventListener('click', (e) => {
    const opt = e.target.closest('.picker-option');
    if (!opt) return;
    const vi = parseInt(opt.dataset.var, 10);
    const kind = opt.dataset.kind;
    const idx = parseInt(opt.dataset.idx, 10);
    if (kind === 'subj') {
      selSubj[vi] = idx;
      updateSubject(vi);
    } else {
      selPrev[vi] = idx;
      updatePreview(vi);
    }
  });

  function updateSubject(vi) {
    const v = VARIATIONS[vi];
    const s = v.subjects[selSubj[vi]];
    document.getElementById(`email-subj-${vi}`).textContent = s;
    document.getElementById(`inbox-subj-${vi}`).textContent = s;
    document.getElementById(`cmp-subj-${vi}`).textContent = s;
    // Update picker selected state
    document.querySelectorAll(`.picker-option.subject-opt[data-var="${vi}"]`).forEach((el, i) => {
      el.classList.toggle('selected', i === selSubj[vi]);
    });
  }
  function updatePreview(vi) {
    const v = VARIATIONS[vi];
    const p = v.previews[selPrev[vi]];
    document.getElementById(`inbox-prev-${vi}`).textContent = p;
    document.getElementById(`cmp-prev-${vi}`).textContent = p;
    document.querySelectorAll(`.picker-option.preview-opt[data-var="${vi}"]`).forEach((el, i) => {
      el.classList.toggle('selected', i === selPrev[vi]);
    });
  }

  function selectVariation(i) {
    document.querySelectorAll('.inbox-row').forEach((r, idx) => r.classList.toggle('active', idx === i));
    document.querySelectorAll('.email-view').forEach((v, idx) => v.classList.toggle('active', idx === i));
    readingCol.scrollTop = 0;
  }

  function setMode(mode) {
    document.getElementById('mode-inbox').classList.toggle('active', mode === 'inbox');
    document.getElementById('mode-compare').classList.toggle('active', mode === 'compare');
    layout.classList.toggle('compare-mode', mode === 'compare');
  }

  function flash(btn, label) {
    const old = btn.textContent;
    btn.textContent = label;
    setTimeout(() => btn.textContent = old, 1400);
  }

  function copyBody(i, btn) {
    const view = document.querySelectorAll('.email-view')[i];
    navigator.clipboard.writeText(view.querySelector('.email-body').innerText)
      .then(() => flash(btn, 'Copied ✓'));
  }
  function copyPair(i, btn) {
    const v = VARIATIONS[i];
    const text = `Subject: ${v.subjects[selSubj[i]]}\nPreview: ${v.previews[selPrev[i]]}`;
    navigator.clipboard.writeText(text).then(() => flash(btn, 'Copied ✓'));
  }
  function copyAll(i, btn) {
    const v = VARIATIONS[i];
    const view = document.querySelectorAll('.email-view')[i];
    const body = view.querySelector('.email-body').innerText;
    const text = `Subject: ${v.subjects[selSubj[i]]}\nPreview: ${v.previews[selPrev[i]]}\n\n${body}`;
    navigator.clipboard.writeText(text).then(() => flash(btn, 'Copied ✓'));
  }
  function copyCompare(i, btn) {
    const card = document.querySelectorAll('.compare-card')[i];
    navigator.clipboard.writeText(card.querySelector('.compare-card-body').innerText)
      .then(() => flash(btn, 'Copied ✓'));
  }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'c' || e.key === 'C') { setMode('compare'); return; }
    if (e.key === 'i' || e.key === 'I' || e.key === 'Escape') { setMode('inbox'); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= VARIATIONS.length) {
      setMode('inbox');
      selectVariation(n - 1);
    }
  });

  function escapeHtml(s) {
    return String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');
  }

  function timeLabel(i) {
    const labels = ['10:42 AM', '10:41 AM', '10:40 AM', '10:39 AM', '10:38 AM'];
    return labels[i] || '';
  }
</script>
</body>
</html>
