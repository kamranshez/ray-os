<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>use cases · Claude Code dynamic workflows</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  @font-face {
    font-family: 'Excalifont';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2') format('woff2');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Cascadia Code';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Cascadia/CascadiaCode-Regular.woff2') format('woff2');
    font-weight: normal; font-style: normal; font-display: swap;
  }
</style>
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  :root {
    --cream: #1c1c1c; --paper: #262626; --ink: #e8e8e8; --ink-soft: #9b9b9b;
    --ink-faint: #555555; --rule: #3a3a3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--cream); color: var(--ink);
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Excalifont', cursive; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 4px 4px; z-index: 1;
  }

  /* ===== STAGE (full height, no topbar, no sidebar) ===== */
  .stage {
    position: fixed; top: 0; bottom: 0; left: 0; right: 0;
    display: flex; flex-direction: column; z-index: 5;
  }
  .sketch-wrap {
    flex: 1 1 auto; min-height: 0; display: flex; align-items: center;
    justify-content: center; padding: 8px 14px 2px; position: relative;
  }
  .sketch-wrap svg {
    width: 100%; height: 100%; display: block; transition: opacity 250ms ease;
  }
  .sketch-wrap svg.fading { opacity: 0; }

  .caption-area {
    flex: 0 0 auto; text-align: center; padding: 2px 28px 50px;
    transition: opacity 250ms ease;
  }
  .caption-area.fading { opacity: 0; }
  .caption-area h2 {
    font-family: 'Excalifont', cursive; font-weight: 700; margin: 0 0 6px;
    font-size: clamp(1.6rem, 2.8vw, 2.35rem); line-height: 1.05; color: var(--ink);
  }
  .caption-area p {
    font-family: 'Excalifont', cursive; margin: 0 auto;
    font-size: clamp(1.1rem, 1.6vw, 1.45rem); line-height: 1.4;
    color: var(--ink-soft); max-width: 980px;
  }

  /* ===== TAP ZONES ===== */
  .tap-zone { position: fixed; top: 0; bottom: 0; width: 50%; z-index: 8; cursor: pointer; }
  .tap-zone.left { left: 0; }
  .tap-zone.right { right: 0; }

  /* ===== NAV BUTTONS ===== */
  .nav-btn {
    position: fixed; bottom: 18px; z-index: 25; font-family: 'Excalifont', cursive;
    font-size: 22px; background: #2e2e2e; border: 2px solid var(--ink);
    border-radius: 14px; padding: 6px 18px 8px; color: var(--ink); cursor: pointer;
    box-shadow: 2px 3px 0 var(--ink);
    transition: transform 120ms ease, box-shadow 120ms ease, opacity 200ms ease;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .nav-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 4px 0 var(--ink); }
  .nav-btn:active { transform: translate(1px,2px); box-shadow: 0 0 0 var(--ink); }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .nav-btn.prev { left: 24px; }
  .nav-btn.next { right: 24px; }
  .nav-btn .arrow { font-family: 'Excalifont', cursive; font-size: 28px; line-height: 1; }

  /* draw-on animation */
  .draw-on path, .draw-on line, .draw-on circle, .draw-on rect {
    stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawOn 700ms ease forwards;
  }
  @keyframes drawOn { to { stroke-dashoffset: 0; } }
  .draw-on text { opacity: 0; animation: fadeIn 500ms ease forwards; animation-delay: 400ms; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>

<div class="stage">
  <div class="sketch-wrap" id="sketch-wrap">
    <svg id="sketch" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="caption-area" id="caption">
    <h2 id="headline">1  .  implement, review, fix loop</h2>
    <p id="caption-text">the loop is a do-while, not a polite request. reviewing is on the checklist</p>
  </div>
</div>

<div class="tap-zone left" id="tap-left"></div>
<div class="tap-zone right" id="tap-right"></div>


<script>
(() => {
  const COLORS = {
    ink: '#e8e8e8', soft: '#9b9b9b', faint: '#555555', card: '#323232',
    yellow: '#4d4526', blue: '#1f3a4d', green: '#234a2c', pink: '#4d2a39',
    amber: '#523a23', paper: '#262626', emerald: '#5bd66f', rose: '#ff6b6b',
    lightRed: '#4d2626', softEmerald: '#234a2c', violet: '#352c4d', teal: '#1d4642',
  };
  const MONO = "'Cascadia Code', ui-monospace, monospace";
  const FONT_SCALE = 1.32;
  const MONO_SCALE = 1.12;

  const svg = document.getElementById('sketch');
  let rc = rough.svg(svg);
  const clearSvg = (s) => { while (s.firstChild) s.removeChild(s.firstChild); };

  const addRect = (x, y, w, h, opts={}) => {
    const node = rc.rectangle(x, y, w, h, {
      stroke: COLORS.ink, strokeWidth: 1.6, roughness: 2.0, bowing: 1.6,
      fill: opts.fill, fillStyle: opts.fillStyle || 'solid', fillWeight: 1, hachureGap: 6, ...opts
    });
    svg.appendChild(node); return node;
  };
  const addLine = (x1,y1,x2,y2, opts={}) => {
    const node = rc.line(x1,y1,x2,y2, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.5, ...opts });
    svg.appendChild(node); return node;
  };
  const addCircle = (cx,cy,d, opts={}) => {
    const node = rc.circle(cx,cy,d, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.6, ...opts });
    svg.appendChild(node); return node;
  };
  const addPath = (path, opts={}) => {
    const node = rc.path(path, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.6, ...opts });
    svg.appendChild(node); return node;
  };
  const addText = (x,y, text, opts={}) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('font-family', opts.font || "'Excalifont', cursive");
    const __isMono = (opts.font || '').indexOf('Cascadia') !== -1;
    t.setAttribute('font-size', (opts.size || 24) * (__isMono ? MONO_SCALE : FONT_SCALE));
    t.setAttribute('fill', opts.fill || COLORS.ink);
    t.setAttribute('text-anchor', opts.anchor || 'start');
    if (opts.weight) t.setAttribute('font-weight', opts.weight);
    if (opts.style) t.setAttribute('font-style', opts.style);
    t.textContent = text; svg.appendChild(t); return t;
  };
  const addArrow = (x1,y1,x2,y2, opts={}) => {
    const curve = opts.curve != null ? opts.curve : 30;
    const cx = (x1+x2)/2 + curve; const cy = (y1+y2)/2 - Math.abs(curve)*0.6;
    addPath(`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`, opts);
    const angle = Math.atan2(y2-cy, x2-cx); const ah = opts.arrowSize || 14;
    addLine(x2,y2, x2 - ah*Math.cos(angle - Math.PI/7), y2 - ah*Math.sin(angle - Math.PI/7), opts);
    addLine(x2,y2, x2 - ah*Math.cos(angle + Math.PI/7), y2 - ah*Math.sin(angle + Math.PI/7), opts);
  };
  const addCheck = (cx, cy, size=18, color=COLORS.emerald) => {
    addPath(`M ${cx-size*0.6} ${cy} L ${cx-size*0.1} ${cy+size*0.5} L ${cx+size*0.7} ${cy-size*0.6}`, {
      stroke: color, strokeWidth: 3.5, roughness: 1.2
    });
  };
  const addCross = (cx, cy, size=18, color=COLORS.rose) => {
    addLine(cx-size*0.6, cy-size*0.6, cx+size*0.6, cy+size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
    addLine(cx-size*0.6, cy+size*0.6, cx+size*0.6, cy-size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
  };

  // ============== SLIDES ==============
  const slides = [];

  // 1 — USE CASE 1: IMPLEMENT -> REVIEW -> FIX LOOP
  slides.push({
    headline: '1  .  implement, review, fix loop',
    caption: 'the loop is a do-while, not a polite request. reviewing is on the checklist',
    draw: () => {
      addRect(110, 130, 760, 640, { fill: COLORS.paper, fillStyle: 'solid', strokeWidth: 2 });
      const lines = [
        { t: "await agent('implement the feature')" },
        { t: "" },
        { t: "let round = 0" },
        { t: "do {" },
        { t: "  review = await agent('review', { schema })", hi: true },
        { t: "  if (review.passed) break", hi: true },
        { t: "  await agent('fix: ' + review.issues)", hi: true },
        { t: "} while (++round < 3)" },
      ];
      let y = 210;
      lines.forEach(l => {
        if (l.hi) addRect(140, y-28, 700, 40, { fill: COLORS.amber, fillStyle: 'solid', strokeWidth: 0, roughness: 2.4 });
        addText(160, y, l.t, { size: 23, font: MONO });
        y += 56;
      });
      // callouts sit level with the line each points at; arrow reaches the box edge
      addArrow(1010, 372, 868, 372, { stroke: COLORS.rose, strokeWidth: 1.8, curve: 0, arrowSize: 11 });
      addText(1030, 380, 'a real loop', { size: 23, fill: COLORS.rose, weight: 700, anchor: 'start' });
      addArrow(1010, 484, 868, 484, { stroke: COLORS.emerald, strokeWidth: 1.8, curve: 0, arrowSize: 11 });
      addText(1030, 492, 'break on real data', { size: 23, fill: COLORS.emerald, weight: 700, anchor: 'start' });
      addArrow(1010, 596, 868, 596, { stroke: COLORS.soft, strokeWidth: 1.8, curve: 0, arrowSize: 11 });
      addText(1030, 604, 'a hard cap', { size: 23, fill: COLORS.soft, weight: 700, anchor: 'start' });
    }
  });

  // 2 — USE CASE 2: AGENTIC RED-GREEN-REFACTOR
  slides.push({
    headline: '2  .  agentic red-green-refactor',
    caption: 'red before green is a step the code will not let it skip, not a promise in a prompt',
    draw: () => {
      const steps = [
        { t: 'write failing test', c: COLORS.violet },
        { t: 'run  .  prove RED', c: COLORS.lightRed },
        { t: 'implement', c: COLORS.blue },
        { t: 'run  .  prove GREEN', c: COLORS.softEmerald },
        { t: 'refactor', c: COLORS.amber },
      ];
      steps.forEach((s,i) => {
        const x = 90 + i*300;
        addRect(x, 360, 250, 150, { fill: s.c, fillStyle: 'solid', strokeWidth: 2 });
        addText(x+125, 430, String(i+1), { size: 22, anchor: 'middle', fill: COLORS.soft, font: MONO });
        addText(x+125, 470, s.t, { size: 21, anchor: 'middle', weight: 700, font: MONO });
        if (i < steps.length-1) addArrow(x+252, 435, x+298, 435, { stroke: COLORS.ink, strokeWidth: 2, curve: 0, arrowSize: 11 });
      });
      addText(215, 330, 'RED first', { size: 22, anchor: 'middle', fill: COLORS.rose, weight: 700 });
      addText(1115, 330, 'only after GREEN', { size: 22, anchor: 'middle', fill: COLORS.emerald, weight: 700 });
    }
  });

  // 3 — USE CASE 3: VERIFIED, ADVERSARIAL CODE REVIEW
  slides.push({
    headline: '3  .  verified, adversarial code review',
    caption: 'reviewers flag everything. a fresh skeptic in a clean context tries to refute each. only the real bugs survive',
    draw: () => {
      // stage 1: reviewers
      addText(300, 150, 'reviewers  .  go broad', { size: 24, anchor: 'middle', weight: 700, font: MONO, fill: COLORS.soft });
      ['bugs','security','perf','tests','arch'].forEach((r,i) => {
        const y = 200 + i*95;
        addRect(120, y, 360, 74, { fill: COLORS.blue, fillStyle: 'solid', strokeWidth: 1.8 });
        addText(300, y+47, r + ' reviewer', { size: 22, anchor: 'middle', weight: 700, font: MONO });
      });
      // findings flowing to verifiers
      addArrow(490, 420, 640, 420, { stroke: COLORS.ink, strokeWidth: 2, curve: 0, arrowSize: 12 });
      addText(565, 390, '22 findings', { size: 18, anchor: 'middle', fill: COLORS.soft, font: MONO });

      // stage 2: verifiers (the gate)
      addText(900, 150, 'verifiers  .  refute each', { size: 24, anchor: 'middle', weight: 700, font: MONO, fill: COLORS.soft });
      addPath('M 720 200 L 720 780', { stroke: COLORS.faint, strokeWidth: 2, roughness: 2.2 });
      // killed
      [0,1,2].forEach((k,i) => {
        const y = 220 + i*70;
        addRect(740, y, 320, 52, { fill: COLORS.card, fillStyle: 'solid', strokeWidth: 1.4 });
        addText(770, y+34, 'refuted', { size: 19, font: MONO, fill: COLORS.soft });
        addCross(1030, y+26, 12, COLORS.rose);
      });
      addText(900, 470, '17 killed  .  no reachable path', { size: 18, anchor: 'middle', fill: COLORS.soft, style: 'italic' });
      // survivors
      [0,1].forEach((k,i) => {
        const y = 540 + i*84;
        addRect(740, y, 320, 64, { fill: COLORS.softEmerald, fillStyle: 'solid', strokeWidth: 2 });
        addText(770, y+40, 'confirmed bug', { size: 20, font: MONO, weight: 700 });
        addCheck(1030, y+30, 12, COLORS.emerald);
      });

      // final
      addRect(1180, 320, 300, 220, { fill: COLORS.green, fillStyle: 'solid', strokeWidth: 2.4 });
      addText(1330, 410, '5 real', { size: 34, anchor: 'middle', weight: 700, fill: COLORS.emerald });
      addText(1330, 455, 'bugs', { size: 26, anchor: 'middle', weight: 700 });
      addArrow(1070, 560, 1230, 470, { stroke: COLORS.emerald, strokeWidth: 1.8, curve: 20, arrowSize: 11 });
    }
  });

  // 4 — USE CASE 4: THE DEAD-CODE SWEEP
  slides.push({
    headline: '4  .  the dead-code sweep',
    caption: 'find it, remove it in parallel, revert anything that turns a test red. then sweep again, because removing code reveals more',
    draw: () => {
      // ===== one round: find, then remove in parallel =====
      addText(120, 132, 'one round', { size: 19, fill: COLORS.soft, style: 'italic' });

      addRect(120, 152, 250, 108, { fill: COLORS.blue, fillStyle: 'solid', strokeWidth: 2 });
      addText(245, 200, 'finder', { size: 24, anchor: 'middle', weight: 700, font: MONO });
      addText(245, 233, 'scans for unused code', { size: 16, anchor: 'middle', fill: COLORS.soft });

      addArrow(372, 206, 498, 206, { stroke: COLORS.ink, strokeWidth: 2, curve: 0, arrowSize: 11 });

      addRect(500, 152, 290, 108, { fill: COLORS.lightRed, fillStyle: 'solid', strokeWidth: 2 });
      addText(645, 198, '5 dead symbols', { size: 22, anchor: 'middle', weight: 700 });
      addText(645, 232, 'exports . fns . imports', { size: 16, anchor: 'middle', fill: COLORS.soft, font: MONO });

      // fan out one remover per dead symbol, in parallel
      const lefts = [120, 405, 690, 975, 1260];
      const symbols = ['oldHelper', 'fmtLegacy', 'cfgUnused', 'deadRoute', 'tmpFlag'];
      const reverted = 3;
      lefts.forEach((X, i) => {
        const cx = X + 110;
        addArrow(645, 262, cx, 358, { stroke: COLORS.ink, strokeWidth: 1.6, curve: (cx-645)*0.028, arrowSize: 9 });
        addRect(X, 362, 220, 130, { fill: COLORS.card, fillStyle: 'solid', strokeWidth: 1.8 });
        addText(cx, 412, 'remove', { size: 20, anchor: 'middle', weight: 700, font: MONO });
        addText(cx, 450, symbols[i], { size: 18, anchor: 'middle', fill: COLORS.soft, font: MONO });
        if (i === reverted) {
          addCross(cx-58, 540, 14, COLORS.rose);
          addText(cx-30, 548, 'reverted', { size: 19, anchor: 'start', fill: COLORS.rose, weight: 700, font: MONO });
          addText(cx, 590, 'test broke', { size: 16, anchor: 'middle', fill: COLORS.rose, style: 'italic' });
        } else {
          addCheck(cx-56, 540, 14, COLORS.emerald);
          addText(cx-28, 548, 'removed', { size: 19, anchor: 'start', fill: COLORS.emerald, weight: 700, font: MONO });
        }
      });

      // ===== the loop: sweep until two clean rounds in a row =====
      addLine(80, 650, 1520, 650, { stroke: COLORS.faint, strokeWidth: 1.2 });
      addText(120, 692, 'the loop', { size: 19, fill: COLORS.soft, style: 'italic' });

      const counts = ['5', '1', '0', '0'];
      const cxs = [330, 470, 610, 750];
      cxs.forEach((cx, i) => {
        const clean = counts[i] === '0';
        addCircle(cx, 715, 60, { fill: clean ? COLORS.green : COLORS.lightRed, fillStyle: 'solid', strokeWidth: 1.8 });
        addText(cx, 726, counts[i], { size: 28, anchor: 'middle', weight: 700, fill: clean ? COLORS.emerald : COLORS.ink });
        if (i < cxs.length-1) addArrow(cx+33, 715, cxs[i+1]-33, 715, { stroke: COLORS.ink, strokeWidth: 1.6, curve: 0, arrowSize: 8 });
      });
      addArrow(783, 715, 858, 715, { stroke: COLORS.emerald, strokeWidth: 1.8, curve: 0, arrowSize: 9 });
      addRect(865, 685, 250, 62, { fill: COLORS.green, fillStyle: 'solid', strokeWidth: 2 });
      addText(990, 723, '2 clean . stop', { size: 20, anchor: 'middle', weight: 700, font: MONO, fill: COLORS.emerald });

      addText(1330, 700, 'removing code reveals', { size: 18, anchor: 'middle', fill: COLORS.soft, style: 'italic' });
      addText(1330, 727, 'more underneath . cap 8', { size: 18, anchor: 'middle', fill: COLORS.soft, style: 'italic' });
    }
  });

  // 5 — USE CASE 5: THE BUG-TRIAGE PIPELINE
  slides.push({
    headline: '5  .  the bug-triage pipeline',
    caption: 'reproduce, trace, root-cause, verify, fix. and because it is code, it can branch and bail',
    draw: () => {
      const stages = ['reproduce','trace path','recent changes','root cause','verify','minimal fix'];
      stages.forEach((s,i) => {
        const x = 70 + i*255;
        const c = i === stages.length-1 ? COLORS.softEmerald : COLORS.violet;
        addRect(x, 330, 205, 120, { fill: c, fillStyle: 'solid', strokeWidth: 2 });
        addText(x+102, 398, s, { size: 20, anchor: 'middle', weight: 700, font: MONO });
        if (i < stages.length-1) addArrow(x+208, 390, x+252, 390, { stroke: COLORS.ink, strokeWidth: 2, curve: 0, arrowSize: 10 });
      });
      // early-exit branch off "reproduce"
      addArrow(172, 450, 172, 580, { stroke: COLORS.rose, strokeWidth: 2, curve: 0, arrowSize: 11 });
      addRect(60, 585, 240, 90, { fill: COLORS.lightRed, fillStyle: 'solid', strokeWidth: 2 });
      addText(180, 632, "can't reproduce?", { size: 19, anchor: 'middle', weight: 700, font: MONO });
      addText(180, 715, 'stop early. do not', { size: 19, anchor: 'middle', fill: COLORS.rose });
      addText(180, 741, 'fix the wrong thing', { size: 19, anchor: 'middle', fill: COLORS.rose });
    }
  });

  // 6 — EXAMPLE: API CONTRACT DRIFT DETECTOR (fan-out with a deliberate barrier)
  slides.push({
    headline: '6  .  the API contract drift detector',
    caption: 'one checker per endpoint, all on haiku, each calling the live API against its spec. wait for every result, then open one PR for the drift',
    draw: () => {
      // read the spec, list the endpoints
      addRect(120, 150, 270, 108, { fill: COLORS.yellow, fillStyle: 'solid', strokeWidth: 2 });
      addText(255, 198, 'openapi.yaml', { size: 21, anchor: 'middle', weight: 700, font: MONO });
      addText(255, 231, 'the contract', { size: 16, anchor: 'middle', fill: COLORS.soft, style: 'italic' });
      addArrow(390, 204, 508, 204, { stroke: COLORS.ink, strokeWidth: 2, curve: 0, arrowSize: 11 });
      addRect(510, 150, 250, 108, { fill: COLORS.blue, fillStyle: 'solid', strokeWidth: 2 });
      addText(635, 198, 'list endpoints', { size: 20, anchor: 'middle', weight: 700, font: MONO });
      addText(635, 231, '5 to check', { size: 16, anchor: 'middle', fill: COLORS.soft, font: MONO });

      // fan out one checker per endpoint, on haiku
      addText(635, 300, 'one checker each . haiku . calls the live API', { size: 17, anchor: 'middle', fill: COLORS.soft, style: 'italic' });
      const lefts = [120, 405, 690, 975, 1260];
      const eps = ['GET /users', 'POST /orders', 'GET /cart', 'PUT /user', 'GET /items'];
      const drift = [false, true, false, true, false];
      lefts.forEach((X, i) => {
        const cx = X + 110;
        addArrow(635, 260, cx, 352, { stroke: COLORS.ink, strokeWidth: 1.5, curve: (cx-635)*0.028, arrowSize: 9 });
        addRect(X, 356, 220, 120, { fill: COLORS.card, fillStyle: 'solid', strokeWidth: 1.8 });
        addText(cx, 400, eps[i], { size: 18, anchor: 'middle', weight: 700, font: MONO });
        if (drift[i]) { addCross(cx-50, 445, 13, COLORS.rose); addText(cx-22, 452, 'drift', { size: 18, anchor: 'start', fill: COLORS.rose, weight: 700, font: MONO }); }
        else { addCheck(cx-54, 445, 13, COLORS.emerald); addText(cx-26, 452, 'in sync', { size: 18, anchor: 'start', fill: COLORS.emerald, weight: 700, font: MONO }); }
        addArrow(cx, 478, cx, 540, { stroke: drift[i] ? COLORS.rose : COLORS.faint, strokeWidth: 1.4, curve: 0, arrowSize: 8 });
      });

      // the barrier, then one consolidated draft PR
      addRect(150, 544, 1300, 42, { fill: COLORS.violet, fillStyle: 'solid', strokeWidth: 1.8 });
      addText(800, 572, 'barrier . wait for every endpoint before touching the spec', { size: 18, anchor: 'middle', weight: 700, fill: COLORS.ink });
      addArrow(800, 586, 800, 632, { stroke: COLORS.ink, strokeWidth: 2, curve: 0, arrowSize: 10 });
      addRect(560, 636, 480, 92, { fill: COLORS.green, fillStyle: 'solid', strokeWidth: 2 });
      addText(800, 676, 'one draft PR', { size: 23, anchor: 'middle', weight: 700 });
      addText(800, 708, 'fixes the 2 drifted endpoints', { size: 17, anchor: 'middle', fill: COLORS.soft, font: MONO });
    }
  });

  // 7 — USE CASE 7: THE DEEP-RESEARCH PIPELINE (a pipeline inside a pipeline)
  slides.push({
    headline: '7  .  the deep-research pipeline',
    caption: 'decompose a question into sub-questions, run search, fetch, extract on each, then write the cited answer. a pipeline nested inside a pipeline',
    draw: () => {
      // ----- OUTER pipeline: per question -----
      addText(127, 372, 'outer pipeline', { size: 18, anchor: 'middle', fill: COLORS.soft, style: 'italic' });
      addRect(40, 395, 175, 115, { fill: COLORS.blue, fillStyle: 'solid', strokeWidth: 2 });
      addText(127, 445, 'question', { size: 22, anchor: 'middle', weight: 700, font: MONO });
      addText(127, 478, 'top-level', { size: 16, anchor: 'middle', fill: COLORS.soft, style: 'italic' });

      addArrow(215, 452, 243, 452, { stroke: COLORS.ink, strokeWidth: 2, curve: 0, arrowSize: 10 });

      addRect(245, 395, 185, 115, { fill: COLORS.violet, fillStyle: 'solid', strokeWidth: 2 });
      addText(337, 445, 'decompose', { size: 21, anchor: 'middle', weight: 700, font: MONO });
      addText(337, 478, 'into N sub-q', { size: 16, anchor: 'middle', fill: COLORS.soft, font: MONO });
      addText(337, 552, 'N unknown until it runs', { size: 16, anchor: 'middle', fill: COLORS.soft, style: 'italic' });

      // ----- INNER pipeline container: one per sub-question -----
      addRect(460, 150, 695, 620, { strokeWidth: 1.8, fill: COLORS.paper, fillStyle: 'solid', strokeLineDash: [10, 8] });
      addText(807, 186, 'inner pipeline  .  one per sub-question', { size: 18, anchor: 'middle', fill: COLORS.soft, style: 'italic' });

      const rows = [270, 450, 630];
      rows.forEach((yc, r) => {
        // decompose fans out to each sub-question
        addArrow(430, 452, 478, yc, { stroke: COLORS.violet, strokeWidth: 1.5, curve: (yc-452)*0.04, arrowSize: 8 });
        const stages = [
          { x: 480, t: 'sub-q ' + (r+1), c: COLORS.violet },
          { x: 640, t: 'search',         c: COLORS.blue },
          { x: 800, t: 'fetch',          c: COLORS.blue },
          { x: 960, t: 'extract',        c: COLORS.softEmerald },
        ];
        stages.forEach((st, i) => {
          addRect(st.x, yc-45, 130, 90, { fill: st.c, fillStyle: 'solid', strokeWidth: 1.8 });
          addText(st.x+65, yc+7, st.t, { size: 17, anchor: 'middle', weight: 700, font: MONO });
          if (i < stages.length-1) addArrow(st.x+130, yc, st.x+160, yc, { stroke: COLORS.ink, strokeWidth: 1.6, curve: 0, arrowSize: 8 });
        });
        // the sub-answer leaves the inner pipeline toward the writer
        addArrow(1090, yc, 1183, 452, { stroke: COLORS.emerald, strokeWidth: 1.6, curve: (452-yc)*0.04, arrowSize: 9 });
      });

      // ----- OUTER stage 2: write the cited answer once the sub-answers land -----
      addRect(1185, 395, 175, 115, { fill: COLORS.green, fillStyle: 'solid', strokeWidth: 2 });
      addText(1272, 442, 'write', { size: 21, anchor: 'middle', weight: 700, font: MONO });
      addText(1272, 475, 'cited answer', { size: 16, anchor: 'middle', fill: COLORS.soft, font: MONO });

      addArrow(1360, 452, 1388, 452, { stroke: COLORS.ink, strokeWidth: 2, curve: 0, arrowSize: 10 });
      addRect(1390, 405, 165, 100, { fill: COLORS.softEmerald, fillStyle: 'solid', strokeWidth: 2.2 });
      addCheck(1408, 450, 12, COLORS.emerald);
      addText(1438, 458, 'answer', { size: 20, anchor: 'start', weight: 700 });
    }
  });

  // ============== STATE / RENDER ==============
  let current = 0;
  const render = (idx, animate=true) => {
    const slide = slides[idx];
    const captionEl = document.getElementById('caption');
    captionEl.classList.add('fading');
    svg.classList.add('fading');
    setTimeout(() => {
      clearSvg(svg);
      rc = rough.svg(svg);
      slide.draw();
      if (animate) { svg.classList.add('draw-on'); svg.getBoundingClientRect(); }
      document.getElementById('headline').textContent = slide.headline;
      document.getElementById('caption-text').textContent = slide.caption;
      svg.classList.remove('fading');
      captionEl.classList.remove('fading');
      if (animate) setTimeout(() => svg.classList.remove('draw-on'), 1200);
    }, 220);
  };
  const goTo = (idx) => { if (idx < 0 || idx >= slides.length || idx === current) return; current = idx; render(current); };
  const next = () => goTo(current + 1);
  const prev = () => goTo(current - 1);

  render(current);
  document.getElementById('tap-left').addEventListener('click', prev);
  document.getElementById('tap-right').addEventListener('click', next);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  });
})();
</script>
</body>
</html>
