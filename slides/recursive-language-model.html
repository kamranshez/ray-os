<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>claude code is a recursive language model · slides</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  @font-face {
    font-family: 'Excalifont';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2') format('woff2');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Cascadia Code';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Cascadia/CascadiaCode-Regular.woff2') format('woff2');
    font-weight: normal; font-style: normal; font-display: swap;
  }
</style>
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  :root {
    --cream: #1c1c1c; --paper: #262626; --ink: #e8e8e8; --ink-soft: #9b9b9b;
    --ink-faint: #555555; --yellow: #4d4526; --blue: #1f3a4d; --green: #234a2c;
    --pink: #4d2a39; --amber: #523a23; --light-red: #4d2626; --soft-emerald: #234a2c;
    --violet: #352c4d; --teal: #1d4642; --rule: #3a3a3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--cream); color: var(--ink);
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Excalifont', cursive; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 4px 4px; z-index: 1;
  }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 50px; display: flex;
    align-items: center; justify-content: space-between; padding: 8px 28px;
    border-bottom: 1px dashed var(--rule); background: var(--cream); z-index: 20;
  }
  .topbar .title { font-family: 'Excalifont', cursive; font-size: 22px; color: var(--ink-soft); line-height: 1; }
  .topbar .counter { font-family: 'Excalifont', cursive; font-size: 22px; color: var(--ink-soft); }
  .topbar .counter .num { color: var(--ink); font-weight: 700; }

  .stage { position: fixed; top: 50px; bottom: 0; left: 0; right: 0; display: flex; flex-direction: column; z-index: 5; }
  .sketch-wrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px 20px 4px; position: relative; }
  .sketch-wrap svg { width: 100%; height: 100%; display: block; transition: opacity 250ms ease; }
  .sketch-wrap svg.fading { opacity: 0; }

  #comment-overlay { position: absolute; inset: 12px 20px 4px; pointer-events: none; z-index: 8; }
  body.comment-mode #comment-overlay { pointer-events: auto; cursor: crosshair; }
  .comment-banner {
    position: fixed; top: 12px; right: 14px; background: #ef4444; color: white;
    font-family: 'Cascadia Code', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.5px;
    padding: 4px 8px; border-radius: 4px; box-shadow: 1px 1px 0 #1f2937; display: none; z-index: 30; text-transform: uppercase;
  }
  body.comment-mode .comment-banner { display: block; }
  .comment-pin {
    position: absolute; width: 28px; height: 28px; border-radius: 50%; background: #ef4444; color: white;
    font-family: 'Cascadia Code', ui-monospace, monospace; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%);
    border: 2px solid #1f2937; box-shadow: 1px 2px 0 #1f2937; pointer-events: auto; cursor: pointer; z-index: 9;
  }
  .comment-pin:hover { transform: translate(-50%, -50%) scale(1.15); }
  .comment-pin .tooltip {
    position: absolute; left: 34px; top: -4px; background: #fef3c7; color: #1f2937;
    font-family: 'Excalifont', cursive; font-size: 16px; padding: 4px 10px; border: 1.5px solid #1f2937;
    border-radius: 4px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 2px 2px 0 #1f2937; display: none;
  }
  .comment-pin:hover .tooltip { display: block; }

  .caption-area { flex: 0 0 auto; text-align: center; padding: 8px 32px 70px; transition: opacity 250ms ease; }
  .caption-area.fading { opacity: 0; }
  .caption-area h2 {
    font-family: 'Excalifont', cursive; font-weight: 700; margin: 0 0 6px;
    font-size: clamp(2.8rem, 5.2vw, 4.4rem); line-height: 1.05; color: var(--ink);
  }
  .caption-area p {
    font-family: 'Excalifont', cursive; margin: 0 auto; font-size: clamp(1.5rem, 2.1vw, 1.95rem);
    line-height: 1.4; color: var(--ink-soft); max-width: 1100px;
  }

  .tap-zone { position: fixed; top: 50px; bottom: 0; width: 50%; z-index: 8; cursor: pointer; }
  .tap-zone.left { left: 0; } .tap-zone.right { right: 0; }

  .draw-on path, .draw-on line, .draw-on circle, .draw-on rect {
    stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawOn 700ms ease forwards;
  }
  @keyframes drawOn { to { stroke-dashoffset: 0; } }
  .draw-on text { opacity: 0; animation: fadeIn 500ms ease forwards; animation-delay: 400ms; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">claude code = a recursive language model</div>
  <div class="counter"><span class="num" id="slide-num">1</span> / <span id="slide-total">11</span></div>
</div>

<div class="stage">
  <div class="sketch-wrap" id="sketch-wrap">
    <svg id="sketch" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="comment-overlay"></div>
    <div id="comment-banner" class="comment-banner">&#9679; comment mode</div>
  </div>
  <div class="caption-area" id="caption">
    <h2 id="headline">the context window is a leash</h2>
    <p id="caption-text">a model reads its whole window every turn. past a point, it rots.</p>
  </div>
</div>

<div class="tap-zone left" id="tap-left"></div>
<div class="tap-zone right" id="tap-right"></div>

<script>
(() => {
  const COLORS = {
    ink: '#e8e8e8', soft: '#9b9b9b', faint: '#555555', card: '#323232',
    yellow: '#4d4526', blue: '#1f3a4d', green: '#234a2c', pink: '#4d2a39',
    amber: '#523a23', paper: '#262626', emerald: '#5bd66f', rose: '#ff6b6b',
    lightRed: '#4d2626', softEmerald: '#234a2c', violet: '#352c4d', teal: '#1d4642',
    blueStroke: '#74b9e7', yellowStroke: '#f0a429',
  };
  const MONO = "'Cascadia Code', ui-monospace, monospace";

  const svg = document.getElementById('sketch');
  let rc = rough.svg(svg);
  const clearSvg = (s) => { while (s.firstChild) s.removeChild(s.firstChild); };

  const addRect = (x, y, w, h, opts={}) => {
    const node = rc.rectangle(x, y, w, h, {
      stroke: COLORS.ink, strokeWidth: 1.6, roughness: 2.0, bowing: 1.6,
      fill: opts.fill, fillStyle: opts.fillStyle || 'solid', fillWeight: 1, hachureGap: 6, ...opts
    });
    svg.appendChild(node); return node;
  };
  const addLine = (x1,y1,x2,y2, opts={}) => {
    const node = rc.line(x1,y1,x2,y2, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.5, ...opts });
    svg.appendChild(node); return node;
  };
  const addCircle = (cx,cy,d, opts={}) => {
    const node = rc.circle(cx,cy,d, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.6, ...opts });
    svg.appendChild(node); return node;
  };
  const addPath = (path, opts={}) => {
    const node = rc.path(path, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.6, ...opts });
    svg.appendChild(node); return node;
  };
  const addText = (x,y, text, opts={}) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('font-family', opts.font || "'Excalifont', cursive");
    t.setAttribute('font-size', opts.size || 32);
    t.setAttribute('fill', opts.fill || COLORS.ink);
    t.setAttribute('text-anchor', opts.anchor || 'start');
    if (opts.weight) t.setAttribute('font-weight', opts.weight);
    if (opts.style) t.setAttribute('font-style', opts.style);
    t.textContent = text; svg.appendChild(t); return t;
  };
  const addArrow = (x1,y1,x2,y2, opts={}) => {
    const curve = opts.curve != null ? opts.curve : 30;
    const cx = (x1+x2)/2 + curve;
    const cy = (y1+y2)/2 - Math.abs(curve)*0.6;
    addPath(`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`, opts);
    const angle = Math.atan2(y2-cy, x2-cx);
    const ah = opts.arrowSize || 14;
    addLine(x2,y2, x2 - ah*Math.cos(angle - Math.PI/7), y2 - ah*Math.sin(angle - Math.PI/7), opts);
    addLine(x2,y2, x2 - ah*Math.cos(angle + Math.PI/7), y2 - ah*Math.sin(angle + Math.PI/7), opts);
  };
  const addCheck = (cx, cy, size=18, color=COLORS.emerald) => {
    addPath(`M ${cx-size*0.6} ${cy} L ${cx-size*0.1} ${cy+size*0.5} L ${cx+size*0.7} ${cy-size*0.6}`, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
  };
  const addCross = (cx, cy, size=18, color=COLORS.rose) => {
    addLine(cx-size*0.6, cy-size*0.6, cx+size*0.6, cy+size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
    addLine(cx-size*0.6, cy+size*0.6, cx+size*0.6, cy-size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
  };

  const slides = [];

  // -------- 1 · THE LEASH --------
  slides.push({
    headline: 'the context window is a leash',
    caption: 'a model reads its whole window every turn. past a point, it rots.',
    draw: () => {
      addRect(120, 320, 420, 240, { fill: COLORS.lightRed, strokeWidth: 2.4 });
      addText(330, 410, 'ONE WINDOW', { size: 34, anchor: 'middle', weight: 700, fill: COLORS.rose, font: MONO });
      addText(330, 470, 'a 2M-line repo', { size: 30, anchor: 'middle' });
      addArrow(540, 440, 680, 440, { curve: 0, strokeWidth: 2.4, arrowSize: 16 });
      addRect(680, 350, 420, 180, { fill: COLORS.blue, strokeWidth: 2.2 });
      addText(890, 450, 'the model', { size: 40, anchor: 'middle', weight: 700 });
      addArrow(1100, 440, 1240, 440, { curve: 0, strokeWidth: 2.4, arrowSize: 16 });
      addRect(1240, 350, 360, 180, { fill: COLORS.yellow, strokeWidth: 2 });
      addText(1420, 450, 'the answer', { size: 36, anchor: 'middle', weight: 700 });
      addText(800, 700, 'a bigger pile makes the answer worse, not better', { size: 36, anchor: 'middle', weight: 600, fill: COLORS.emerald });
    }
  });

  // -------- 2 · BY REFERENCE --------
  slides.push({
    headline: 'context by reference, not by value',
    caption: 'leave the giant input outside. hand the model code to reach in.',
    draw: () => {
      addText(150, 170, 'by value', { size: 38, weight: 700, fill: COLORS.rose, font: MONO });
      addRect(150, 210, 380, 150, { fill: COLORS.lightRed, strokeWidth: 2 });
      addText(340, 300, '10M tokens', { size: 32, anchor: 'middle', weight: 700, font: MONO });
      addArrow(540, 285, 700, 285, { curve: 0, strokeWidth: 2.4, arrowSize: 15 });
      addRect(700, 210, 360, 150, { fill: COLORS.lightRed, strokeWidth: 2 });
      addText(880, 290, 'overflow', { size: 32, anchor: 'middle', weight: 700, fill: COLORS.rose });
      addCross(1230, 285, 26, COLORS.rose);
      addText(1300, 298, 'it has to FIT', { size: 34, weight: 700, fill: COLORS.rose });

      addLine(130, 430, 1470, 430, { stroke: COLORS.faint, strokeWidth: 1.5 });

      addText(150, 510, 'by reference', { size: 38, weight: 700, fill: COLORS.emerald, font: MONO });
      addRect(150, 550, 340, 150, { fill: COLORS.softEmerald, strokeWidth: 2 });
      addText(320, 640, 'stays OUTSIDE', { size: 30, anchor: 'middle', weight: 700, font: MONO });
      addArrow(500, 625, 640, 625, { curve: 0, strokeWidth: 2.4, arrowSize: 15 });
      addRect(640, 550, 380, 150, { fill: COLORS.blue, strokeWidth: 2 });
      addText(830, 640, 'the model', { size: 32, anchor: 'middle', weight: 700 });
      addArrow(1020, 625, 1160, 625, { curve: 0, strokeWidth: 2.4, arrowSize: 15 });
      addRect(1160, 550, 380, 150, { fill: COLORS.violet, strokeWidth: 2 });
      addText(1350, 625, 'writes code', { size: 32, anchor: 'middle', weight: 700 });
      addText(1350, 665, 'grep · slice', { size: 26, anchor: 'middle', fill: COLORS.soft, font: MONO });
    }
  });

  // -------- 3 · WHO READS IT --------
  slides.push({
    headline: 'the root never reads it. workers do.',
    caption: 'a fleet of fresh models each read one slice. only summaries come home.',
    draw: () => {
      addRect(600, 110, 400, 130, { fill: COLORS.lightRed, strokeWidth: 2.4 });
      addText(800, 190, 'root model', { size: 36, anchor: 'middle', weight: 700 });
      const xs = [120, 470, 820, 1170];
      const labels = ['worker 1', 'worker 2', 'worker 3', 'worker N'];
      xs.forEach((x, i) => {
        addRect(x, 470, 300, 150, { fill: COLORS.blue, strokeWidth: 2 });
        addText(x + 150, 540, labels[i], { size: 30, anchor: 'middle', weight: 700, font: MONO });
        addText(x + 150, 582, 'one slice', { size: 25, anchor: 'middle', fill: COLORS.soft, style: 'italic' });
        addArrow(800, 245, x + 150, 462, { stroke: COLORS.rose, strokeWidth: 1.8, curve: (x + 150 - 800) * 0.03, arrowSize: 10 });
        addArrow(x + 250, 462, 880, 250, { stroke: COLORS.emerald, strokeWidth: 1.4, curve: (880 - x - 250) * 0.02, arrowSize: 9 });
      });
      addText(800, 730, 'no single window ever holds it all', { size: 34, anchor: 'middle', weight: 600 });
    }
  });

  // -------- 4 · THE BREAKTHROUGH --------
  slides.push({
    headline: 'a subagent is a function in your code',
    caption: 'wrap the model call in loops, ifs, filters. and the model writes that code.',
    draw: () => {
      // LEFT: flat tool calls
      addText(160, 170, 'flat tool calls', { size: 34, weight: 700, fill: COLORS.rose, font: MONO });
      ['call A', 'call B', 'call C', 'call D'].forEach((c, i) => {
        const x = 150 + (i % 2) * 230;
        const y = 220 + Math.floor(i / 2) * 110;
        addRect(x, y, 200, 80, { fill: COLORS.violet, strokeWidth: 1.8 });
        addText(x + 100, y + 52, c, { size: 28, anchor: 'middle', weight: 700, font: MONO });
      });
      addArrow(390, 450, 390, 530, { curve: 0, strokeWidth: 2.4, arrowSize: 14, stroke: COLORS.rose });
      addRect(140, 550, 590, 110, { fill: COLORS.lightRed, strokeWidth: 2 });
      addText(435, 615, 'every result returns, noise and all', { size: 28, anchor: 'middle', weight: 700, fill: COLORS.rose, style: 'italic' });

      addLine(790, 130, 790, 760, { stroke: COLORS.faint, strokeWidth: 1.4 });

      // RIGHT: a function inside code
      addText(840, 170, 'a function inside code', { size: 34, weight: 700, fill: COLORS.emerald, font: MONO });
      addRect(840, 210, 660, 240, { fill: COLORS.paper, strokeWidth: 2 });
      addRect(864, 262, 490, 38, { fill: COLORS.amber, strokeWidth: 0, roughness: 2.4 });
      const code = ['for (f of files) {', '  const r = agent(f)', '  if (!r.real) continue', '}'];
      code.forEach((l, i) => addText(874, 255 + i * 48, l, { size: 27, font: MONO }));
      addArrow(1170, 455, 1170, 535, { curve: 0, strokeWidth: 2.4, arrowSize: 14, stroke: COLORS.emerald });
      addRect(910, 555, 520, 110, { fill: COLORS.softEmerald, strokeWidth: 2 });
      addText(1170, 620, 'root gets ONLY what passed', { size: 28, anchor: 'middle', weight: 700, fill: COLORS.emerald });
    }
  });

  // -------- 5 · WHY NOW --------
  slides.push({
    headline: 'you could fan out before. why now?',
    caption: 'the primitive existed. the model could not drive it. Opus 4.8 was trained to.',
    draw: () => {
      addRect(110, 280, 420, 240, { fill: COLORS.paper, strokeWidth: 2 });
      addText(320, 370, 'the idea', { size: 38, anchor: 'middle', weight: 700 });
      addText(320, 430, 'code + sub-calls', { size: 27, anchor: 'middle', fill: COLORS.soft, font: MONO });
      addArrow(530, 400, 660, 400, { curve: 0, strokeWidth: 2.4, arrowSize: 16 });

      addRect(660, 280, 420, 240, { fill: COLORS.lightRed, strokeWidth: 2 });
      addText(870, 370, 'could not drive it', { size: 34, anchor: 'middle', weight: 700, fill: COLORS.rose });
      addText(870, 430, 'a training problem', { size: 26, anchor: 'middle', fill: COLORS.soft, font: MONO });
      addArrow(1080, 400, 1210, 400, { curve: 0, strokeWidth: 2.4, arrowSize: 16 });

      addRect(1210, 280, 380, 240, { fill: COLORS.softEmerald, strokeWidth: 2.4 });
      addText(1400, 370, 'Opus 4.8', { size: 40, anchor: 'middle', weight: 700 });
      addText(1400, 430, 'trained to drive it', { size: 27, anchor: 'middle', fill: COLORS.emerald });

      addText(800, 680, 'the capability sat there for a year', { size: 34, anchor: 'middle', weight: 600 });
    }
  });

  // -------- 6 · THREE WAYS --------
  slides.push({
    headline: 'three ways to handle a job too big for the window',
    caption: 'stuff it in · fan out subagents · fan out with code',
    draw: () => {
      addRect(200, 130, 1200, 170, { fill: COLORS.lightRed, strokeWidth: 2 });
      addCross(270, 215, 22, COLORS.rose);
      addText(340, 230, '1 · load it all in', { size: 34, weight: 700, font: MONO });

      addRect(200, 330, 1200, 170, { fill: COLORS.amber, strokeWidth: 2 });
      addCross(270, 415, 22, COLORS.rose);
      addText(340, 430, '2 · fan out subagents', { size: 34, weight: 700, font: MONO });

      addRect(200, 530, 1200, 190, { fill: COLORS.softEmerald, strokeWidth: 2.4 });
      addCheck(272, 630, 26, COLORS.emerald);
      addText(340, 615, '3 · fan out with CODE', { size: 34, weight: 700, font: MONO, fill: COLORS.emerald });
      addText(340, 670, 'only the signal comes home', { size: 28, fill: COLORS.emerald, style: 'italic' });
    }
  });

  // -------- 7 · A WORKFLOW IS AN RLM --------
  slides.push({
    headline: 'a workflow is a recursive language model',
    caption: 'one JS file orchestrates. agent() is a model call. the code itself is free.',
    draw: () => {
      addRect(560, 90, 480, 300, { fill: COLORS.yellow, strokeWidth: 2.4 });
      addPath('M 1000 90 L 1040 90 L 1040 130 Z', { stroke: COLORS.ink, fill: COLORS.paper, fillStyle: 'solid', strokeWidth: 1.4 });
      addText(592, 150, 'workflow.js', { size: 32, weight: 700, font: MONO });
      addLine(592, 168, 1008, 168, { stroke: COLORS.soft });
      addRect(580, 232, 444, 34, { fill: COLORS.amber, strokeWidth: 0, roughness: 2.4 });
      addRect(580, 280, 444, 34, { fill: COLORS.amber, strokeWidth: 0, roughness: 2.4 });
      ['const files = list()', 'parallel(files.map(f =>', '  agent(`review ${f}`)))', "return agent('synthesize')"].forEach((l, i) => addText(596, 220 + i * 48, l, { size: 24, font: MONO }));

      [430, 800, 1170].forEach(x => {
        addArrow(800, 400, x, 500, { stroke: COLORS.emerald, strokeWidth: 2, curve: (x - 800) * 0.04, arrowSize: 13 });
        addRect(x - 160, 520, 320, 170, { fill: COLORS.blue, strokeWidth: 2 });
        addText(x, 585, 'agent', { size: 34, anchor: 'middle', weight: 700, font: MONO });
        addLine(x - 120, 605, x + 120, 605, { stroke: COLORS.soft });
        addText(x, 655, 'clean window', { size: 26, anchor: 'middle', fill: COLORS.soft, style: 'italic' });
      });
    }
  });

  // -------- 8 · WHAT IT UNLOCKS --------
  slides.push({
    headline: 'what it unlocks: review a repo that never fit',
    caption: 'not retrieve one snippet. touch everything.',
    draw: () => {
      addRect(110, 150, 640, 540, { fill: COLORS.lightRed, strokeWidth: 2 });
      addText(430, 230, 'BEFORE', { size: 40, anchor: 'middle', weight: 700, fill: COLORS.rose, font: MONO });
      addCross(280, 400, 30, COLORS.rose);
      addText(360, 415, 'one window', { size: 32, weight: 700 });
      addText(430, 540, 'infeasible', { size: 38, anchor: 'middle', weight: 700, fill: COLORS.rose, style: 'italic' });

      addRect(850, 150, 640, 540, { fill: COLORS.softEmerald, strokeWidth: 2.2 });
      addText(1170, 230, 'AFTER', { size: 40, anchor: 'middle', weight: 700, fill: COLORS.emerald, font: MONO });
      addCheck(1010, 400, 30, COLORS.emerald);
      addText(1090, 415, 'a workflow', { size: 32, weight: 700 });
      addText(1170, 540, 'never had to fit', { size: 38, anchor: 'middle', weight: 700, fill: COLORS.emerald, style: 'italic' });
    }
  });

  // -------- 9 · PIPELINES INSIDE PIPELINES --------
  slides.push({
    headline: 'pipelines inside pipelines',
    caption: 'interesting results escalate into their own adversarial pipeline. ran it: 2 of 3 escalated.',
    draw: () => {
      addRect(640, 80, 320, 90, { fill: COLORS.lightRed, strokeWidth: 2.4 });
      addText(800, 140, 'claude', { size: 32, anchor: 'middle', weight: 700, font: MONO });

      const cols = [
        { x: 290, esc: true },
        { x: 800, esc: true },
        { x: 1310, esc: false },
      ];
      cols.forEach(c => {
        addArrow(800, 175, c.x, 245, { stroke: COLORS.faint, strokeWidth: 1.6, curve: (c.x - 800) * 0.02, arrowSize: 10 });
        addRect(c.x - 110, 250, 220, 80, { fill: COLORS.blue, strokeWidth: 2 });
        addText(c.x, 300, 'analyze', { size: 28, anchor: 'middle', weight: 700, font: MONO });
        if (c.esc) {
          addArrow(c.x, 332, c.x, 388, { curve: 0, strokeWidth: 1.8, arrowSize: 10, stroke: COLORS.emerald });
          addRect(c.x - 120, 400, 110, 66, { fill: COLORS.violet, strokeWidth: 1.8 });
          addText(c.x - 65, 442, 'verify', { size: 26, anchor: 'middle', font: MONO });
          addRect(c.x + 10, 400, 110, 66, { fill: COLORS.violet, strokeWidth: 1.8 });
          addText(c.x + 65, 442, 'verify', { size: 26, anchor: 'middle', font: MONO });
          addArrow(c.x - 55, 468, c.x - 10, 524, { curve: 0, strokeWidth: 1.6, arrowSize: 9, stroke: COLORS.ink });
          addArrow(c.x + 55, 468, c.x + 10, 524, { curve: 0, strokeWidth: 1.6, arrowSize: 9, stroke: COLORS.ink });
          addRect(c.x - 100, 536, 200, 66, { fill: COLORS.amber, strokeWidth: 2 });
          addText(c.x, 578, 'rule', { size: 26, anchor: 'middle', weight: 700, font: MONO });
          addArrow(c.x, 604, 800, 720, { stroke: COLORS.emerald, strokeWidth: 1.8, curve: (800 - c.x) * 0.03, arrowSize: 11 });
        } else {
          addCross(c.x, 440, 26, COLORS.rose);
          addText(c.x, 500, 'skipped', { size: 26, anchor: 'middle', fill: COLORS.rose, style: 'italic' });
        }
      });
      addRect(640, 720, 320, 90, { fill: COLORS.lightRed, strokeWidth: 2.4 });
      addText(800, 778, 'claude', { size: 32, anchor: 'middle', weight: 700, font: MONO });
    }
  });

  // -------- 10 · HONEST LIMITS --------
  slides.push({
    headline: 'honest limits',
    caption: 'say these before your viewers do.',
    draw: () => {
      const cards = [
        { x: 110, t: 'just a for loop?', lines: ['no, the MODEL writes it'] },
        { x: 580, t: 'recurses forever?', lines: ['no, nests one level'] },
        { x: 1050, t: 'live like a REPL?', lines: ['no, written up front'] },
      ];
      cards.forEach(c => {
        addRect(c.x, 220, 440, 400, { fill: COLORS.paper, strokeWidth: 2 });
        addText(c.x + 220, 320, c.t, { size: 34, anchor: 'middle', weight: 700, fill: COLORS.rose });
        addLine(c.x + 50, 350, c.x + 390, 350, { stroke: COLORS.soft });
        addCross(c.x + 110, 440, 24, COLORS.rose);
        addText(c.x + 220, 510, c.lines[0], { size: 27, anchor: 'middle' });
      });
    }
  });

  // -------- 11 · THE SHIFT --------
  slides.push({
    headline: 'the shift',
    caption: 'a model that writes a program that calls models',
    draw: () => {
      const boxes = [
        { x: 60, label: ['you talk', 'to a model'], fill: COLORS.paper },
        { x: 460, label: ['the model', 'writes a program'], fill: COLORS.yellow },
        { x: 860, label: ['the program', 'calls models'], fill: COLORS.blue },
        { x: 1260, label: ['code keeps', 'what matters'], fill: COLORS.softEmerald },
      ];
      boxes.forEach((b, i) => {
        addRect(b.x, 340, 290, 200, { fill: b.fill, strokeWidth: 2.2 });
        addText(b.x + 145, 425, b.label[0], { size: 30, anchor: 'middle', weight: 700 });
        addText(b.x + 145, 470, b.label[1], { size: 30, anchor: 'middle', weight: 700 });
        if (i < boxes.length - 1) {
          addArrow(b.x + 290, 440, b.x + 400, 440, { curve: 0, strokeWidth: 2.6, arrowSize: 17, stroke: COLORS.emerald });
        }
      });
      addText(800, 690, 'a recursive language model', { size: 42, anchor: 'middle', weight: 700, fill: COLORS.emerald });
    }
  });

  // ============== STATE / RENDER ==============
  let current = 0;
  const render = (idx, animate=true) => {
    const slide = slides[idx];
    const captionEl = document.getElementById('caption');
    captionEl.classList.add('fading'); svg.classList.add('fading');
    setTimeout(() => {
      clearSvg(svg); rc = rough.svg(svg); slide.draw();
      if (animate) { svg.classList.add('draw-on'); svg.getBoundingClientRect(); }
      document.getElementById('headline').textContent = slide.headline;
      document.getElementById('caption-text').textContent = slide.caption;
      document.getElementById('slide-num').textContent = (idx+1);
      svg.classList.remove('fading'); captionEl.classList.remove('fading');
      if (animate) setTimeout(() => svg.classList.remove('draw-on'), 1200);
      document.getElementById('slide-total').textContent = slides.length;
    }, 220);
  };
  const goTo = (idx) => { if (idx < 0 || idx >= slides.length || idx === current) return; current = idx; render(current); };
  const next = () => goTo(current + 1);
  const prev = () => goTo(current - 1);

  // ============== NOTES.JSON SYNC ==============
  const NOTES_URL = 'notes.json';
  const SYNC_URL = 'http://localhost:7878/current';
  let lastNotesHash = null;
  let suppressLocalPost = false;
  const applyNotes = (data) => {
    if (!data || !Array.isArray(data.slides)) return;
    data.slides.forEach((s, i) => { if (slides[i]) { if (s.headline) slides[i].headline = s.headline; if (s.caption) slides[i].caption = s.caption; } });
    if (slides[current]) { document.getElementById('headline').textContent = slides[current].headline; document.getElementById('caption-text').textContent = slides[current].caption; }
  };
  const fetchNotes = async () => { try { const r = await fetch(NOTES_URL + '?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return null; return await r.json(); } catch (e) { return null; } };
  const pollNotes = async () => {
    const data = await fetchNotes(); if (!data) return;
    const hash = JSON.stringify(data); if (hash === lastNotesHash) return;
    lastNotesHash = hash; applyNotes(data);
    if (typeof data.current === 'number' && data.current !== current) { suppressLocalPost = true; goTo(data.current); suppressLocalPost = false; }
  };
  const postCurrent = (idx) => {
    if (suppressLocalPost) return;
    fetch(SYNC_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ current: idx }) }).catch(() => {});
  };

  // ============== INIT ==============
  (async () => {
    const initial = await fetchNotes();
    if (initial) { lastNotesHash = JSON.stringify(initial); applyNotes(initial); if (typeof initial.current === 'number') current = Math.max(0, Math.min(slides.length - 1, initial.current)); }
    render(current); setInterval(pollNotes, 1000);
  })();

  document.getElementById('tap-left').addEventListener('click', () => { prev(); postCurrent(current); });
  document.getElementById('tap-right').addEventListener('click', () => { next(); postCurrent(current); });

  // ============== COMMENT MODE ==============
  const COMMENTS_KEY = 'rlm-slides-comments';
  const overlay = document.getElementById('comment-overlay');
  let comments = JSON.parse(localStorage.getItem(COMMENTS_KEY) || '{}');
  const saveComments = () => localStorage.setItem(COMMENTS_KEY, JSON.stringify(comments));
  const renderComments = () => {
    overlay.querySelectorAll('.comment-pin').forEach(n => n.remove());
    const list = comments[current] || [];
    list.forEach((c, i) => {
      const pin = document.createElement('div');
      pin.className = 'comment-pin';
      pin.style.left = (c.x * 100) + '%'; pin.style.top = (c.y * 100) + '%';
      pin.textContent = (i + 1);
      const tip = document.createElement('div'); tip.className = 'tooltip'; tip.textContent = c.text; pin.appendChild(tip);
      pin.addEventListener('click', (e) => {
        e.stopPropagation();
        if (document.body.classList.contains('comment-mode')) {
          const newText = prompt('edit comment (leave empty to delete):', c.text);
          if (newText === null) return;
          if (newText.trim() === '') list.splice(i, 1); else list[i].text = newText;
          comments[current] = list; saveComments(); renderComments();
        }
      });
      overlay.appendChild(pin);
    });
  };
  const toggleCommentMode = () => { document.body.classList.toggle('comment-mode'); renderComments(); };
  overlay.addEventListener('click', (e) => {
    if (!document.body.classList.contains('comment-mode')) return;
    if (e.target !== overlay) return;
    const rect = overlay.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    const text = prompt('comment:'); if (!text) return;
    if (!comments[current]) comments[current] = [];
    comments[current].push({ x, y, text }); saveComments(); renderComments();
  });
  const exportComments = () => {
    const slidesWithComments = Object.entries(comments).filter(([_, arr]) => arr && arr.length).map(([idx, arr]) => ({
      slide: parseInt(idx, 10) + 1, headline: slides[idx]?.headline || '',
      comments: arr.map((c, i) => ({ n: i + 1, x: +c.x.toFixed(3), y: +c.y.toFixed(3), text: c.text }))
    }));
    const blob = JSON.stringify({ exportedAt: new Date().toISOString(), slides: slidesWithComments }, null, 2);
    navigator.clipboard.writeText(blob).then(() => { alert('comments copied to clipboard (' + slidesWithComments.reduce((n, s) => n + s.comments.length, 0) + ' total)'); }).catch(() => {
      const a = document.createElement('a'); a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(blob); a.download = 'slide-comments.json'; a.click();
    });
  };
  const clearSlideComments = () => {
    if (!comments[current] || !comments[current].length) return;
    if (confirm('clear ' + comments[current].length + ' comment(s) on this slide?')) { delete comments[current]; saveComments(); renderComments(); }
  };
  new MutationObserver(renderComments).observe(document.getElementById('slide-num'), { childList: true });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); postCurrent(current); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); postCurrent(current); }
    else if (e.key === 'c' || e.key === 'C') { e.preventDefault(); toggleCommentMode(); }
    else if (e.key === 'Escape') { document.body.classList.remove('comment-mode'); }
    else if ((e.key === 'e' || e.key === 'E') && document.body.classList.contains('comment-mode')) { e.preventDefault(); exportComments(); }
    else if ((e.key === 'x' || e.key === 'X') && document.body.classList.contains('comment-mode')) { e.preventDefault(); clearSlideComments(); }
  });
  renderComments();
})();
</script>

</body>
</html>
