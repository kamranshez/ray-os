<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>the orchestration tax · Claude Code Workflow tool</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  /* Excalidraw's actual fonts, loaded from their public repo via jsdelivr */
  @font-face {
    font-family: 'Excalifont';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Cascadia Code';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Cascadia/CascadiaCode-Regular.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
</style>
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  :root {
    /* Excalidraw dark palette */
    --cream: #1c1c1c;          /* canvas */
    --paper: #262626;          /* subtle dark panels */
    --ink: #e8e8e8;            /* light strokes + text */
    --ink-soft: #9b9b9b;       /* secondary text */
    --ink-faint: #555555;      /* subtle lines */
    --yellow: #4d4526;         /* dark amber */
    --blue: #1f3a4d;           /* dark blue */
    --green: #234a2c;          /* dark green */
    --pink: #4d2a39;           /* dark pink */
    --amber: #523a23;          /* dark orange */
    --light-red: #4d2626;      /* dark red */
    --soft-emerald: #234a2c;   /* dark green */
    --violet: #352c4d;         /* dark violet */
    --teal: #1d4642;           /* dark teal */
    --rule: #3a3a3a;           /* dashed rule */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: 'Excalifont', cursive;
    -webkit-font-smoothing: antialiased;
  }

  /* subtle paper grain */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 4px 4px;
    z-index: 1;
  }

  /* ========== THUMBNAIL SIDEBAR ========== */
  .thumb-sidebar {
    position: fixed;
    top: 50px;
    bottom: 0;
    left: 0;
    width: 220px;
    background: var(--paper);
    border-right: 1px dashed var(--rule);
    overflow-y: auto;
    padding: 10px 8px 60px;
    z-index: 15;
    font-family: 'Excalifont', cursive;
  }
  .thumb-sidebar .thumb {
    background: var(--cream);
    border: 1.5px solid var(--ink-soft);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    cursor: pointer;
    box-shadow: 1px 2px 0 var(--ink-soft);
    transition: transform 100ms ease;
  }
  .thumb-sidebar .thumb:hover {
    transform: translate(-1px,-1px);
    border-color: var(--ink);
    box-shadow: 2px 3px 0 var(--ink);
  }
  .thumb-sidebar .thumb.active {
    background: var(--yellow);
    border-color: var(--ink);
    border-width: 2px;
    box-shadow: 3px 4px 0 var(--ink), inset 4px 0 0 var(--ink);
    transform: translate(-1px,-1px);
    padding-left: 14px;
  }
  .thumb-sidebar .thumb.active .num {
    color: var(--ink);
    font-weight: 800;
  }
  .thumb-sidebar .thumb.active .label {
    font-weight: 700;
  }
  .thumb-sidebar .thumb.active::after {
    content: '◀';
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: var(--ink);
  }
  .thumb-sidebar .thumb { position: relative; }
  .thumb-sidebar .thumb .num {
    font-size: 14px;
    color: var(--ink-soft);
    font-family: 'Cascadia Code', ui-monospace, monospace;
    font-weight: 600;
  }
  .thumb-sidebar .thumb .label {
    font-size: 18px;
    color: var(--ink);
    line-height: 1.15;
    margin-top: 2px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  @media (min-width: 900px) {
    body:not(.sidebar-collapsed) .topbar,
    body:not(.sidebar-collapsed) .stage { left: 220px; }
  }
  @media (max-width: 899px) {
    .thumb-sidebar { display: none; }
  }
  body.sidebar-collapsed .thumb-sidebar { display: none; }
  body.sidebar-collapsed .topbar,
  body.sidebar-collapsed .stage { left: 0; }

  /* ========== HEADER ========== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 28px;
    border-bottom: 1px dashed var(--rule);
    background: var(--cream);
    z-index: 20;
  }
  .topbar .title {
    font-family: 'Excalifont', cursive;
    font-size: 26px;
    color: var(--ink);
    line-height: 1;
  }
  .topbar .counter {
    font-family: 'Excalifont', cursive;
    font-size: 22px;
    color: var(--ink-soft);
  }
  .topbar .counter .num { color: var(--ink); font-weight: 700; }

  /* ========== SLIDE STAGE ========== */
  .stage {
    position: fixed;
    top: 50px;
    bottom: 0;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    z-index: 5;
  }
  .sketch-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 20px 4px;
    position: relative;
  }
  .sketch-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
    transition: opacity 250ms ease;
  }
  .sketch-wrap svg.fading { opacity: 0; }

  /* ========== COMMENT MODE ========== */
  #comment-overlay {
    position: absolute;
    inset: 12px 20px 4px;
    pointer-events: none;
    z-index: 8;
  }
  body.comment-mode #comment-overlay {
    pointer-events: auto;
    cursor: crosshair;
  }
  .comment-banner {
    position: fixed;
    top: 12px;
    right: 14px;
    background: #ef4444;
    color: white;
    font-family: 'Cascadia Code', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 4px 8px;
    border-radius: 4px;
    box-shadow: 1px 1px 0 #1f2937;
    display: none;
    z-index: 30;
    text-transform: uppercase;
  }
  body.comment-mode .comment-banner { display: block; }
  .comment-pin {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ef4444;
    color: white;
    font-family: 'Cascadia Code', ui-monospace, monospace;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate(-50%, -50%);
    border: 2px solid #1f2937;
    box-shadow: 1px 2px 0 #1f2937;
    pointer-events: auto;
    cursor: pointer;
    z-index: 9;
  }
  .comment-pin:hover {
    transform: translate(-50%, -50%) scale(1.15);
  }
  .comment-pin .tooltip {
    position: absolute;
    left: 34px;
    top: -4px;
    background: #fef3c7;
    color: #1f2937;
    font-family: 'Excalifont', cursive;
    font-size: 16px;
    padding: 4px 10px;
    border: 1.5px solid #1f2937;
    border-radius: 4px;
    white-space: nowrap;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 2px 2px 0 #1f2937;
    display: none;
  }
  .comment-pin:hover .tooltip { display: block; }

  .caption-area {
    flex: 0 0 auto;
    text-align: center;
    padding: 8px 32px 70px;
    transition: opacity 250ms ease;
  }
  .caption-area.fading { opacity: 0; }
  .caption-area h2 {
    font-family: 'Excalifont', cursive;
    font-weight: 700;
    margin: 0 0 6px;
    font-size: clamp(2.2rem, 4.2vw, 3.4rem);
    line-height: 1.05;
    color: var(--ink);
  }
  .caption-area p {
    font-family: 'Excalifont', cursive;
    margin: 0 auto;
    font-size: clamp(1.1rem, 1.6vw, 1.45rem);
    line-height: 1.4;
    color: var(--ink-soft);
    max-width: 920px;
  }

  /* ========== TAP ZONES ========== */
  .tap-zone {
    position: fixed;
    top: 50px; bottom: 0;
    width: 50%;
    z-index: 8;
    cursor: pointer;
  }
  .tap-zone.left { left: 0; }
  .tap-zone.right { right: 0; }

  /* ========== NAV BUTTONS ========== */
  .nav-btn {
    position: fixed;
    bottom: 18px;
    z-index: 25;
    font-family: 'Excalifont', cursive;
    font-size: 22px;
    background: #2e2e2e;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 6px 18px 8px;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 2px 3px 0 var(--ink);
    transition: transform 120ms ease, box-shadow 120ms ease, opacity 200ms ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .nav-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 4px 0 var(--ink); }
  .nav-btn:active { transform: translate(1px,2px); box-shadow: 0 0 0 var(--ink); }
  .nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
  }
  .nav-btn.prev { left: 24px; }
  .nav-btn.next { right: 24px; }
  .nav-btn .arrow {
    font-family: 'Excalifont', cursive;
    font-size: 28px;
    line-height: 1;
  }

  .replay-btn {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 25;
    font-family: 'Excalifont', cursive;
    font-size: 18px;
    background: var(--paper);
    border: 1.5px dashed var(--ink-soft);
    border-radius: 10px;
    padding: 4px 14px 6px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .replay-btn:hover {
    color: var(--ink);
    border-color: var(--ink);
    border-style: solid;
  }

  /* draw-on animation */
  .draw-on path,
  .draw-on line,
  .draw-on circle,
  .draw-on rect {
    stroke-dasharray: 1500;
    stroke-dashoffset: 1500;
    animation: drawOn 700ms ease forwards;
  }
  @keyframes drawOn {
    to { stroke-dashoffset: 0; }
  }
  .draw-on text {
    opacity: 0;
    animation: fadeIn 500ms ease forwards;
    animation-delay: 400ms;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>

<aside class="thumb-sidebar" id="thumb-sidebar"></aside>

<div class="topbar">
  <div class="counter"><span class="num" id="slide-num">1</span> / <span id="slide-total">9</span></div>
</div>

<div class="stage">
  <div class="sketch-wrap" id="sketch-wrap">
    <svg id="sketch" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="comment-overlay"></div>
    <div id="comment-banner" class="comment-banner">● comment mode</div>
  </div>
  <div class="caption-area" id="caption">
    <h2 id="headline">you already have a workflow</h2>
    <p id="caption-text">Claude Code's Workflow tool</p>
  </div>
</div>

<div class="tap-zone left" id="tap-left"></div>
<div class="tap-zone right" id="tap-right"></div>

<button class="nav-btn prev" id="btn-prev"><span class="arrow">←</span> prev</button>
<button class="nav-btn next" id="btn-next">next <span class="arrow">→</span></button>

<script>
(() => {
  // Excalidraw palette
  const COLORS = {
    ink: '#e8e8e8',          // light strokes + text
    soft: '#9b9b9b',         // secondary text
    faint: '#555555',        // subtle lines
    card: '#323232',         // inner card on dark
    yellow: '#4d4526',       // dark amber
    blue: '#1f3a4d',         // dark blue
    green: '#234a2c',        // dark green
    pink: '#4d2a39',         // dark pink
    amber: '#523a23',        // dark orange
    paper: '#262626',        // dark panel
    emerald: '#5bd66f',      // bright green accent
    rose: '#ff6b6b',         // bright red accent
    lightRed: '#4d2626',     // dark red
    softEmerald: '#234a2c',  // dark green (alias)
    violet: '#352c4d',       // dark violet
    teal: '#1d4642',         // dark teal
    blueStroke: '#74b9e7',   // light blue accent
    yellowStroke: '#f0a429', // amber accent
  };
  const MONO = "'Cascadia Code', ui-monospace, monospace";

  const svg = document.getElementById('sketch');
  let rc = rough.svg(svg);

  const clearSvg = (s) => { while (s.firstChild) s.removeChild(s.firstChild); };

  const addRect = (x, y, w, h, opts={}) => {
    const node = rc.rectangle(x, y, w, h, {
      stroke: COLORS.ink, strokeWidth: 1.6, roughness: 2.0, bowing: 1.6,
      fill: opts.fill, fillStyle: opts.fillStyle || 'solid', fillWeight: 1,
      hachureGap: 6, ...opts
    });
    svg.appendChild(node);
    return node;
  };
  const addLine = (x1,y1,x2,y2, opts={}) => {
    const node = rc.line(x1,y1,x2,y2, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.5, ...opts });
    svg.appendChild(node);
    return node;
  };
  const addCircle = (cx,cy,d, opts={}) => {
    const node = rc.circle(cx,cy,d, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.6, ...opts });
    svg.appendChild(node);
    return node;
  };
  const addEllipse = (cx,cy,w,h, opts={}) => {
    const node = rc.ellipse(cx,cy,w,h, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.8, ...opts });
    svg.appendChild(node);
    return node;
  };
  const addPath = (path, opts={}) => {
    const node = rc.path(path, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.6, ...opts });
    svg.appendChild(node);
    return node;
  };

  const addText = (x,y, text, opts={}) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('font-family', opts.font || "'Excalifont', cursive");
    t.setAttribute('font-size', opts.size || 24);
    t.setAttribute('fill', opts.fill || COLORS.ink);
    t.setAttribute('text-anchor', opts.anchor || 'start');
    if (opts.weight) t.setAttribute('font-weight', opts.weight);
    if (opts.style) t.setAttribute('font-style', opts.style);
    t.textContent = text;
    svg.appendChild(t);
    return t;
  };

  const addArrow = (x1,y1,x2,y2, opts={}) => {
    const curve = opts.curve != null ? opts.curve : 30;
    const cx = (x1+x2)/2 + curve;
    const cy = (y1+y2)/2 - Math.abs(curve)*0.6;
    const path = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
    addPath(path, opts);
    const angle = Math.atan2(y2-cy, x2-cx);
    const ah = opts.arrowSize || 14;
    const ax1 = x2 - ah*Math.cos(angle - Math.PI/7);
    const ay1 = y2 - ah*Math.sin(angle - Math.PI/7);
    const ax2 = x2 - ah*Math.cos(angle + Math.PI/7);
    const ay2 = y2 - ah*Math.sin(angle + Math.PI/7);
    addLine(x2,y2,ax1,ay1, opts);
    addLine(x2,y2,ax2,ay2, opts);
  };

  // checkmark / x icon
  const addCheck = (cx, cy, size=18, color=COLORS.emerald) => {
    addPath(`M ${cx-size*0.6} ${cy} L ${cx-size*0.1} ${cy+size*0.5} L ${cx+size*0.7} ${cy-size*0.6}`, {
      stroke: color, strokeWidth: 3.5, roughness: 1.2
    });
  };
  const addCross = (cx, cy, size=18, color=COLORS.rose) => {
    addLine(cx-size*0.6, cy-size*0.6, cx+size*0.6, cy+size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
    addLine(cx-size*0.6, cy+size*0.6, cx+size*0.6, cy-size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
  };

  // ============== SLIDES ==============
  const slides = [];

  // -------- SLIDE 2: YOU ALREADY HAVE A WORKFLOW --------
  const slideAlreadyHave = {
    headline: 'you already have a workflow',
    caption: 'a job you run over and over, and Claude is the one running it',
    draw: () => {
      // the orchestrator above
      addRect(620, 130, 360, 150, { fill: COLORS.lightRed, fillStyle: 'solid', strokeWidth: 2.4 });
      addText(800, 195, 'Claude', { size: 40, anchor: 'middle', weight: 700 });
      addText(800, 242, 'the ORCHESTRATOR', { size: 23, anchor: 'middle', weight: 700, fill: COLORS.rose, font: MONO });

      // the 4-step job
      const steps = [
        { label: 'implement', color: COLORS.blue },
        { label: 'review', color: COLORS.violet },
        { label: 'fix', color: COLORS.amber },
        { label: 'review again', color: COLORS.violet },
      ];
      steps.forEach((s, i) => {
        const x = 170 + i * 320;
        addRect(x, 470, 240, 130, { fill: s.color, fillStyle: 'solid', strokeWidth: 2 });
        addText(x + 120, 524, s.label, { size: 25, anchor: 'middle', weight: 700 });
        addText(x + 120, 561, 'subagent', { size: 18, anchor: 'middle', fill: COLORS.soft, style: 'italic' });
        if (i < 3) addArrow(x + 240, 535, x + 320, 535, { stroke: COLORS.ink, strokeWidth: 2, curve: 0, arrowSize: 12 });
        // arrow down from the orchestrator to this step
        addArrow(800, 285, x + 120, 462, { stroke: COLORS.rose, strokeWidth: 1.5, curve: (x+120-800)*0.03, arrowSize: 8 });
      });

      addText(800, 695, 'decides what runs next · holds every result', { size: 28, anchor: 'middle', fill: COLORS.ink, weight: 600 });
    }
  };
  slides.push(slideAlreadyHave);

  // -------- SLIDE 3: THE ORCHESTRATION TAX --------
  const slideTax = {
    headline: 'the orchestration tax',
    caption: 'the price of letting the model run the project, not just do the tasks',
    draw: () => {
      // central orchestrator
      addRect(580, 320, 440, 210, { fill: COLORS.blue, fillStyle: 'solid', strokeWidth: 2.4 });
      addText(800, 408, 'Claude', { size: 42, anchor: 'middle', weight: 700 });
      addText(800, 460, 'THE ORCHESTRATOR', { size: 23, anchor: 'middle', weight: 700, fill: COLORS.rose, font: MONO });

      addRect(690, 565, 220, 38, { strokeWidth: 1.6 });
      addRect(694, 569, 130, 30, { fill: COLORS.rose, fillStyle: 'solid', stroke: COLORS.ink, strokeWidth: 1 });
      addText(800, 638, 'tokens spent on coordination, not work', { size: 19, anchor: 'middle', fill: COLORS.rose, weight: 700, style: 'italic' });

      // cost 01
      addRect(110, 120, 430, 150, { fill: COLORS.lightRed, fillStyle: 'solid', strokeWidth: 2 });
      addText(140, 168, '01 · the token tax', { size: 23, weight: 700, font: MONO });
      addText(140, 206, 'every coordination decision is', { size: 18 });
      addText(140, 234, 'a model call that does no work', { size: 18 });

      // cost 02
      addRect(1060, 120, 430, 150, { fill: COLORS.amber, fillStyle: 'solid', strokeWidth: 2 });
      addText(1090, 168, '02 · no visibility', { size: 23, weight: 700, font: MONO });
      addText(1090, 206, 'a wall of text scrolls past, so', { size: 18 });
      addText(1090, 234, 'you cannot tell what step it is on', { size: 18 });

      // cost 03
      addRect(430, 720, 740, 140, { fill: COLORS.yellow, fillStyle: 'solid', strokeWidth: 2 });
      addText(460, 768, '03 · it gets sloppy', { size: 23, weight: 700, font: MONO });
      addText(460, 806, 'a long run packs 400k tokens into the context window', { size: 18 });
      addText(460, 834, 'coordinating that deep, the orchestrator drifts off your task', { size: 18 });

      // faint arrows linking callouts to the box
      addArrow(500, 245, 600, 350, { stroke: COLORS.faint, strokeWidth: 1.3, curve: 20, arrowSize: 8 });
      addArrow(1100, 245, 1000, 350, { stroke: COLORS.faint, strokeWidth: 1.3, curve: -20, arrowSize: 8 });
      addArrow(1045, 715, 1000, 510, { stroke: COLORS.faint, strokeWidth: 1.3, curve: 14, arrowSize: 8 });
    }
  };
  slides.push(slideTax);

  // -------- SLIDE 4: A TAX AT EVERY HANDOFF --------
  const slideHandoff = {
    headline: 'a tax at every handoff',
    caption: 'subagents help with context, but Claude still passes every result by hand',
    draw: () => {
      // the orchestrator, top center
      addRect(610, 110, 380, 130, { fill: COLORS.lightRed, fillStyle: 'solid', strokeWidth: 2.4 });
      addText(800, 165, 'Claude, the orchestrator', { size: 23, anchor: 'middle', weight: 700, font: MONO });
      addText(800, 206, 'reads and re-passes every result', { size: 19, anchor: 'middle', fill: COLORS.soft, style: 'italic' });

      // 3 subagents along the bottom
      const subs = [
        { x: 280, color: COLORS.blue, label: 'subagent A' },
        { x: 800, color: COLORS.green, label: 'subagent B' },
        { x: 1320, color: COLORS.amber, label: 'subagent C' },
      ];
      subs.forEach(s => {
        addRect(s.x - 150, 560, 300, 130, { fill: s.color, fillStyle: 'solid', strokeWidth: 2 });
        addText(s.x, 635, s.label, { size: 23, anchor: 'middle', weight: 700, font: MONO });
      });

      // arrows: A up, down to B, B up, down to C
      addArrow(290, 555, 660, 245, { stroke: COLORS.ink, strokeWidth: 2, curve: -50, arrowSize: 12 });
      addArrow(720, 245, 770, 555, { stroke: COLORS.ink, strokeWidth: 2, curve: -50, arrowSize: 12 });
      addArrow(840, 555, 890, 245, { stroke: COLORS.ink, strokeWidth: 2, curve: -50, arrowSize: 12 });
      addArrow(950, 245, 1310, 555, { stroke: COLORS.ink, strokeWidth: 2, curve: -50, arrowSize: 12 });

      // tax meter clicks at each join
      [[500,355],[745,400],[855,400],[1100,355]].forEach(([x,y]) => {
        addCircle(x, y, 48, { fill: COLORS.rose, fillStyle: 'solid', strokeWidth: 1.6 });
        addText(x, y+9, '$', { size: 30, anchor: 'middle', weight: 700, fill: '#fff' });
      });

      addText(800, 765, 'four subagents is not one tax. it is a tax at every join.', {

    const blob = JSON.stringify({ exportedAt: new Date().toISOString(), slides: slidesWithComments }, null, 2);
    navigator.clipboard.writeText(blob).then(() => {
      alert('comments copied to clipboard (' + slidesWithComments.reduce((n, s) => n + s.comments.length, 0) + ' total)');
    }).catch(() => {
      const a = document.createElement('a');
      a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(blob);
      a.download = 'slide-comments.json';
      a.click();
    });
  };

  const clearSlideComments = () => {
    if (!comments[current] || !comments[current].length) return;
    if (confirm('clear ' + comments[current].length + ' comment(s) on this slide?')) {
      delete comments[current];
      saveComments();
      renderComments();
    }
  };

  new MutationObserver(renderComments).observe(document.getElementById('slide-num'), { childList: true });

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); renderThumbs(); postCurrent(current); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); renderThumbs(); postCurrent(current); }
    else if (e.key === 's' || e.key === 'S') { e.preventDefault(); toggleSidebar(); }
    else if (e.key === 'c' || e.key === 'C') { e.preventDefault(); toggleCommentMode(); }
    else if (e.key === 'Escape') { document.body.classList.remove('comment-mode'); }
    else if ((e.key === 'e' || e.key === 'E') && document.body.classList.contains('comment-mode')) { e.preventDefault(); exportComments(); }
    else if ((e.key === 'x' || e.key === 'X') && document.body.classList.contains('comment-mode')) { e.preventDefault(); clearSlideComments(); }
  });

  renderComments();
})();
</script>

</body>
</html>
