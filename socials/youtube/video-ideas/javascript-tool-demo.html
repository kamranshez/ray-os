<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Views — Extracted from YouTube Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e4e4e7;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .card {
    width: 100%;
    max-width: 960px;
    background: #111118;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    overflow: hidden;
  }

  /* Header */
  .header {
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .header h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #e4e4e7;
  }

  .header .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: #52525b;
  }

  .header .total {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    font-weight: 600;
    color: #a5b4fc;
  }

  /* Chart area */
  .chart-container {
    padding: 1.5rem 2rem 0.5rem;
    position: relative;
  }

  .chart {
    position: relative;
    height: 280px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    padding-bottom: 2rem;
  }

  /* Y-axis labels */
  .y-axis {
    position: absolute;
    top: 0;
    left: 0;
    height: calc(100% - 2rem);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
    padding-right: 0.5rem;
  }

  .y-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: #3f3f46;
    text-align: right;
    width: 40px;
  }

  /* Grid lines */
  .grid-lines {
    position: absolute;
    top: 0;
    left: 50px;
    right: 0;
    height: calc(100% - 2rem);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
  }

  .grid-line {
    width: 100%;
    height: 1px;
    background: rgba(255, 255, 255, 0.03);
  }

  /* Bars */
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    flex: 1;
    height: calc(100% - 2rem);
    margin-left: 50px;
  }

  .bar-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
    position: relative;
    cursor: pointer;
  }

  .bar {
    width: 100%;
    border-radius: 3px 3px 0 0;
    background: linear-gradient(180deg, #6366f1, #4f46e5);
    transition: all 0.2s;
    min-height: 2px;
    position: relative;
  }

  .bar.spike {
    background: linear-gradient(180deg, #a78bfa, #7c3aed);
  }

  .bar-wrapper:hover .bar {
    filter: brightness(1.3);
  }

  /* Tooltip */
  .bar-wrapper:hover .tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }

  .tooltip {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: #1e1e2e;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 0.4rem 0.65rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: all 0.15s ease;
    z-index: 10;
    bottom: auto;
    top: auto;
  }

  .tooltip-date {
    font-size: 0.65rem;
    color: #71717a;
    margin-bottom: 0.15rem;
  }

  .tooltip-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    font-weight: 600;
    color: #e4e4e7;
  }

  /* X-axis */
  .x-axis {
    display: flex;
    margin-left: 50px;
    padding-top: 0.6rem;
  }

  .x-label {
    flex: 1;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: #3f3f46;
  }

  /* Stats row */
  .stats {
    display: flex;
    gap: 1px;
    background: rgba(255, 255, 255, 0.06);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }

  .stat {
    flex: 1;
    padding: 1.2rem 1.5rem;
    background: #111118;
  }

  .stat-label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #52525b;
    margin-bottom: 0.3rem;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.15rem;
    font-weight: 600;
    color: #e4e4e7;
  }

  .stat-value.accent { color: #a5b4fc; }
  .stat-value.green { color: #4ade80; }
  .stat-value.purple { color: #c084fc; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Daily Views</h1>
    <span class="meta">10 Mar — 6 Apr 2026</span>
    <span class="total">266,948</span>
  </div>

  <div class="chart-container">
    <div class="chart">
      <div class="y-axis" id="y-axis"></div>
      <div class="grid-lines" id="grid-lines"></div>
      <div class="bars" id="bars"></div>
    </div>
    <div class="x-axis" id="x-axis"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Peak Day</div>
      <div class="stat-value accent">62,699</div>
    </div>
    <div class="stat">
      <div class="stat-label">Peak Date</div>
      <div class="stat-value">Mar 24</div>
    </div>
    <div class="stat">
      <div class="stat-label">Daily Average</div>
      <div class="stat-value green">9,534</div>
    </div>
    <div class="stat">
      <div class="stat-label">Lowest Day</div>
      <div class="stat-value purple">1,304</div>
    </div>
  </div>
</div>

<script>
  const data = [
    { date: '2026-03-10', views: 2650 },
    { date: '2026-03-11', views: 29370 },
    { date: '2026-03-12', views: 10286 },
    { date: '2026-03-13', views: 3895 },
    { date: '2026-03-14', views: 2515 },
    { date: '2026-03-15', views: 2218 },
    { date: '2026-03-16', views: 2037 },
    { date: '2026-03-17', views: 1838 },
    { date: '2026-03-18', views: 1764 },
    { date: '2026-03-19', views: 7879 },
    { date: '2026-03-20', views: 14129 },
    { date: '2026-03-21', views: 17072 },
    { date: '2026-03-22', views: 5568 },
    { date: '2026-03-23', views: 3314 },
    { date: '2026-03-24', views: 62699 },
    { date: '2026-03-25', views: 31166 },
    { date: '2026-03-26', views: 7799 },
    { date: '2026-03-27', views: 2979 },
    { date: '2026-03-28', views: 2199 },
    { date: '2026-03-29', views: 1919 },
    { date: '2026-03-30', views: 2121 },
    { date: '2026-03-31', views: 15262 },
    { date: '2026-04-01', views: 4154 },
    { date: '2026-04-02', views: 2204 },
    { date: '2026-04-03', views: 1599 },
    { date: '2026-04-04', views: 1304 },
    { date: '2026-04-05', views: 6482 },
    { date: '2026-04-06', views: 20526 },
  ];

  const maxViews = Math.max(...data.map(d => d.views));
  const spikeThreshold = 20000;

  // Y-axis
  const yAxis = document.getElementById('y-axis');
  const gridLines = document.getElementById('grid-lines');
  const ySteps = [60000, 40000, 20000, 0];
  ySteps.forEach(v => {
    const label = document.createElement('div');
    label.className = 'y-label';
    label.textContent = v === 0 ? '0' : (v / 1000) + 'k';
    yAxis.appendChild(label);

    const line = document.createElement('div');
    line.className = 'grid-line';
    gridLines.appendChild(line);
  });

  // Bars
  const barsContainer = document.getElementById('bars');
  data.forEach(d => {
    const wrapper = document.createElement('div');
    wrapper.className = 'bar-wrapper';

    const pct = (d.views / maxViews) * 100;
    const bar = document.createElement('div');
    bar.className = 'bar' + (d.views >= spikeThreshold ? ' spike' : '');
    bar.style.height = Math.max(0.5, pct) + '%';

    const tooltip = document.createElement('div');
    tooltip.className = 'tooltip';
    const dateObj = new Date(d.date);
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    tooltip.innerHTML = `
      <div class="tooltip-date">${dayNames[dateObj.getUTCDay()]}, ${monthNames[dateObj.getUTCMonth()]} ${dateObj.getUTCDate()}</div>
      <div class="tooltip-value">${d.views.toLocaleString()}</div>
    `;

    wrapper.appendChild(tooltip);
    wrapper.appendChild(bar);
    barsContainer.appendChild(wrapper);
  });

  // Position tooltips above bars
  document.querySelectorAll('.bar-wrapper').forEach(w => {
    const tooltip = w.querySelector('.tooltip');
    const bar = w.querySelector('.bar');
    tooltip.style.bottom = (parseFloat(bar.style.height)) + '%';
  });

  // X-axis — show every 4th label
  const xAxis = document.getElementById('x-axis');
  data.forEach((d, i) => {
    const label = document.createElement('div');
    label.className = 'x-label';
    if (i % 4 === 0 || i === data.length - 1) {
      const dateObj = new Date(d.date);
      const monthNames = ['Jan','Feb','Mar','Apr'];
      label.textContent = (dateObj.getUTCMonth() === 3 ? 'Apr' : 'Mar') + ' ' + dateObj.getUTCDate();
    }
    xAxis.appendChild(label);
  });
</script>

</body>
</html>
