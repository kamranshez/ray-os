<style>
  :root {
    --bg: #121212;            /* canvas */
    --paper: #1a1a1a;         /* subtle dark panel */
    --panel: #1e1e1e;
    --ink: #ececec;           /* "black" inverted */
    --ink-soft: #9a9a9a;
    --ink-faint: #4a4a4a;
    --yellow: #ffec99;
    --blue: #a5d8ff;
    --green: #b2f2bb;
    --pink: #fcc2d7;
    --amber: #ffd8a8;
    --violet: #d0bfff;
    --teal: #96f2d7;
    --light-red: #ffc9c9;
    --rule: #2a2a2a;
    --accent: #ffec99;        /* yellow as primary highlight on dark */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Excalifont', cursive;
    -webkit-font-smoothing: antialiased;
  }

  /* paper grain */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 4px 4px;
    z-index: 1;
  }

  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(18,18,18,0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px dashed var(--rule);
    padding: 14px 28px;
    display: flex; align-items: center; gap: 18px;
  }
  header h1 {
    margin: 0;
    font-family: 'Excalifont', cursive;
    font-size: 24px;
    letter-spacing: 0;
    color: var(--ink);
  }
  header h1 .muted { color: var(--ink-soft); font-size: 18px; }
  header .spacer { flex: 1; }
  header .count {
    font-family: 'Cascadia Code', ui-monospace, monospace;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 8px 14px;
    background: var(--paper);
    border: 1.5px solid var(--ink-faint);

    box-shadow: 2px 2px 0 var(--ink-faint);

  header .count b { color: var(--yellow); font-weight: 700; }

  header button {

    font-size: 18px;
    padding: 6px 16px 8px;
    background: var(--yellow);
    color: #1e1e1e;
    border: 2px solid var(--ink);
    border-radius: 12px;

    box-shadow: 2px 3px 0 var(--ink);

  header button:active { transform: translate(1px,2px); box-shadow: 0 0 0 var(--ink); }

    background: var(--paper);
    color: var(--ink);
  }

  main { padding: 36px 28px 120px; max-width: 1700px; margin: 0 auto; position: relative; z-index: 2; }

  .topic { margin-bottom: 56px; }
  .topic-head {
    display: flex; align-items: baseline; gap: 16px;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--rule);
  }
  .topic-num {
    font-family: 'Cascadia Code', monospace;
    font-size: 14px;
    color: var(--ink-faint);
  }
  .topic-title {
    font-family: 'Excalifont', cursive;
    font-size: 22px;
    color: var(--ink);
  }
  .topic-section {
    margin-left: auto;
    font-family: 'Cascadia Code', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--yellow);

  .variations {

    grid-template-columns: repeat(3, 1fr);

  .var-card {

    border: 2px solid var(--ink-faint);

    flex-direction: column;

  .var-meta .label {

  .var-meta textarea:focus {

  .select-btn {
    width: 100%;
    margin-top: 10px;
    padding: 6px 12px 8px;
    background: var(--bg);
    color: var(--ink);
    border: 2px solid var(--ink-soft);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Excalifont', cursive;
    font-size: 17px;
    box-shadow: 2px 2px 0 var(--ink-soft);
    transition: all 100ms ease;
  }
  .select-btn:hover {

    box-shadow: 3px 3px 0 var(--ink-soft);
    border-color: var(--ink);

  .var-card.selected .select-btn {

    color: #1e1e1e;
    border-color: var(--yellow);

  .toast {

    transform: translateX(-50%) translateY(80px);
    background: var(--yellow);
    color: #1e1e1e;

    border: 2px solid var(--ink);
    border-radius: 12px;
    box-shadow: 3px 4px 0 var(--ink);

    font-size: 18px;

<script>
// ================================================================
// Excalidraw-flavored DARK palette
// ================================================================
const COLORS = {
  bg: '#121212',
  ink: '#ececec',
  soft: '#9a9a9a',
  faint: '#4a4a4a',
  paper: '#1a1a1a',
  panel: '#1e1e1e',
  yellow: '#ffec99',
  blue: '#a5d8ff',
  green: '#b2f2bb',
  pink: '#fcc2d7',
  amber: '#ffd8a8',
  violet: '#d0bfff',
  teal: '#96f2d7',
  lightRed: '#ffc9c9',
  // strokes/text on dark — use light fills tinted for headers
  strokeBlue: '#74c0fc',
  strokeYellow: '#ffd43b',
  strokeGreen: '#8ce99a',
  strokePink: '#faa2c1',
  strokeViolet: '#b197fc',
  strokeAmber: '#ffc078',
  rose: '#ff8787',
};

// Each variation gets a fresh SVG and a fresh rough.svg() instance.
// Drawing helpers below operate on (svg, rc).

function el(tag, attrs={}) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function H(svg, rc) {
  return {
    rect(x,y,w,h,o={}) {
      const n = rc.rectangle(x,y,w,h, {
        stroke: o.stroke || COLORS.ink, strokeWidth: o.strokeWidth || 1.6,
        roughness: o.roughness || 1.8, bowing: o.bowing || 1.5,
        fill: o.fill, fillStyle: o.fillStyle || 'solid', fillWeight: 1,
        hachureGap: 6, ...o
      });
      svg.appendChild(n); return n;
    },
    line(x1,y1,x2,y2,o={}) {
      const n = rc.line(x1,y1,x2,y2,{
        stroke: o.stroke || COLORS.ink, strokeWidth: o.strokeWidth || 1.4,
        roughness: o.roughness || 1.5, ...o
      });
      svg.appendChild(n); return n;
    },
    circle(cx,cy,d,o={}) {
      const n = rc.circle(cx,cy,d,{
        stroke: o.stroke || COLORS.ink, strokeWidth: o.strokeWidth || 1.4,
        roughness: o.roughness || 1.5, fill: o.fill, fillStyle: o.fillStyle||'solid', ...o
      });
      svg.appendChild(n); return n;
    },
    path(d,o={}) {
      const n = rc.path(d,{
        stroke: o.stroke || COLORS.ink, strokeWidth: o.strokeWidth || 1.4,
        roughness: o.roughness || 1.6, ...o
      });
      svg.appendChild(n); return n;
    },
    text(x,y,t,o={}) {
      const n = el('text',{
        x, y,
        'font-family': o.font || "'Excalifont', cursive",
        'font-size': o.size || 30,
        fill: o.fill || COLORS.ink,
        'text-anchor': o.anchor || 'start',
      });
      if (o.weight) n.setAttribute('font-weight', o.weight);
      if (o.style) n.setAttribute('font-style', o.style);
      n.textContent = t;
      svg.appendChild(n); return n;
    },
    arrow(x1,y1,x2,y2,o={}) {
      const curve = o.curve != null ? o.curve : 0;
      const cx = (x1+x2)/2 + curve;
      const cy = (y1+y2)/2 - Math.abs(curve)*0.6;
      const d = curve === 0
        ? `M ${x1} ${y1} L ${x2} ${y2}`
        : `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
      this.path(d, o);
      const ang = Math.atan2(y2-cy, x2-cx);
      const ah = o.head || 16;
      this.line(x2,y2, x2-ah*Math.cos(ang-Math.PI/7), y2-ah*Math.sin(ang-Math.PI/7), o);
      this.line(x2,y2, x2-ah*Math.cos(ang+Math.PI/7), y2-ah*Math.sin(ang+Math.PI/7), o);
    },
    underline(x,y,w,o={}) {
      // wavy underline
      const dy = 6;
      const segs = 6;
      let d = `M ${x} ${y}`;
      for (let i=1;i<=segs;i++) {
        const xi = x + (w*i/segs);
        const yi = y + (i%2===0 ? 0 : dy);
        d += ` L ${xi} ${yi}`;
      }
      this.path(d,{stroke: o.stroke || COLORS.yellow, strokeWidth: 3, roughness: 1.2});
    },
    sticky(x,y,w,h,fill,o={}) {
      this.rect(x,y,w,h,{fill, fillStyle:'solid', stroke: COLORS.ink, strokeWidth:1.6, roughness:2.0, bowing:1.8, ...o});
    },
  };
}

// ================================================================
// SLIDE LAYOUTS — each takes (svg, rc) and draws a 1600x900 scene
// ================================================================

// helper: title slide with optional subtitle
function titleSlide(svg, rc, line1, line2, sub, opts={}) {
  const h = H(svg,rc);
  h.text(800, 380, line1, { size: 92, weight: 700, anchor: 'middle' });
  if (line2) h.text(800, 490, line2, { size: 92, weight: 700, anchor: 'middle', fill: opts.color || COLORS.yellow });
  if (sub) h.text(800, 600, sub, { size: 30, anchor: 'middle', fill: COLORS.soft });
}

function kicker(h, x, y, text, color) {
  h.text(x, y, text, { size: 22, fill: color || COLORS.yellow, font: "'Cascadia Code', monospace" });
}

// ================================================================
// TOPICS — 3 vars each
// ================================================================
const TOPICS = [

  // ---- 1: COLD OPEN ----
  { id: 1, section: "Cold open", title: "Hook — channel artifact demo",
    vars: [
      { kind: "demo-frame", draw: (svg,rc) => {
        const h = H(svg,rc);
        // sketched browser frame
        h.rect(180, 180, 1240, 540, { stroke: COLORS.ink, strokeWidth: 2, roughness: 2 });
        h.line(180, 240, 1420, 240);
        h.circle(220, 210, 14, { fill: COLORS.rose });
        h.circle(250, 210, 14, { fill: COLORS.strokeAmber });
        h.circle(280, 210, 14, { fill: COLORS.strokeGreen });
        h.text(800, 360, 'click anywhere on this page —', { size: 50, anchor: 'middle' });
        h.text(800, 440, 'claude rewrites the file.', { size: 50, anchor: 'middle', fill: COLORS.yellow });
        h.text(800, 540, '[ live demo · 30s ]', { size: 22, anchor: 'middle', fill: COLORS.soft, font: "'Cascadia Code', monospace" });
        h.underline(440, 460, 720);
      }},
      { kind: "bold-q", draw: (svg,rc) => {
        const h = H(svg,rc);
        h.text(800, 380, 'what if every', { size: 90, weight: 700, anchor: 'middle' });
        h.text(800, 490, 'claude output', { size: 90, weight: 700, anchor: 'middle' });
        h.text(800, 620, 'was a TOOL?', { size: 110, weight: 700, anchor: 'middle', fill: COLORS.yellow });
        h.underline(440, 645, 720);
      }},
      { kind: "tweet-quote", draw: (svg,rc) => {
        const h = H(svg,rc);
        h.rect(200, 220, 1200, 480, { fill: COLORS.paper, fillStyle: 'solid', roughness: 2 });
        h.text(260, 320, '"Markdown has become', { size: 42, style: 'italic' });
        h.text(260, 380, ' a restricting format.', { size: 42, style: 'italic' });
        h.text(260, 460, ' I now prefer HTML', { size: 42, style: 'italic' });
        h.text(260, 520, ' as an output format."', { size: 42, style: 'italic' });
        h.text(260, 620, '— Anthropic, May 2026', { size: 24, fill: COLORS.soft });
        h.text(1340, 660, '1.7M views', { size: 22, anchor:'end', fill: COLORS.yellow, font: "'Cascadia Code', monospace" });
      }},
    ]},

  // ---- 2: THESIS LINE ----
  { id: 2, section: "Thesis", title: "The unifying line",
    vars: [
      { kind: "thesis-xl", draw: (svg,rc) => {
        const h = H(svg,rc);
        h.text(800, 340, 'stop asking claude for', { size: 70, weight: 700, anchor: 'middle' });
        // strikethrough on "documents"
        h.text(800, 460, 'documents.', { size: 100, weight: 700, anchor: 'middle', fill: COLORS.soft });
        h.line(420, 440, 1180, 440, { stroke: COLORS.rose, strokeWidth: 5, roughness: 1.4 });
        h.text(800, 620, 'ask for SURFACES.', { size: 100, weight: 700, anchor: 'middle', fill: COLORS.yellow });
        h.underline(370, 645, 860);
      }},
      { kind: "split-arrow", draw: (svg,rc) => {
        const h = H(svg,rc);
        kicker(h, 200, 250, 'before');
        h.text(200, 360, 'document', { size: 70, weight: 700 });
        h.text(200, 430, 'read once · file · forget', { size: 26, fill: COLORS.soft });
        kicker(h, 1000, 250, 'after', COLORS.strokeGreen);
        h.text(1000, 360, 'surface', { size: 70, weight: 700, fill: COLORS.yellow });
        h.text(1000, 430, 'read · click · edit · ship', { size: 26, fill: COLORS.soft });
        h.arrow(720, 360, 980, 360, { stroke: COLORS.yellow, strokeWidth: 3, head: 22 });
      }},
      { kind: "subtle", draw: (svg,rc) => {
        const h = H(svg,rc);
        kicker(h, 200, 250, 'the real shift');
        h.text(200, 360, 'the artifact stops being the END', { size: 50 });
        h.text(200, 430, 'of a claude turn.', { size: 50 });
        h.text(200, 580, 'it becomes the START', { size: 50, fill: COLORS.yellow });
        h.text(200, 650, 'of the next one.', { size: 50, fill: COLORS.yellow });
        h.underline(200, 670, 460);
      }},
    ]},

  // ---- 3: AHEAD OF THE CURVE ----
  { id: 3, section: "Thesis", title: "I've been saying this",
    vars: [
      { kind: "timeline", draw: (svg,rc) => {
        const h = H(svg,rc);
        kicker(h, 200, 200, '8 months teaching this');
        // horizontal timeline line
        h.line(200, 500, 1400, 500, { strokeWidth: 2 });
        const stops = [
          {x:260, label:'sep 25', sub:'understanding output'},
          {x:460, label:'oct 25', sub:'mermaid diagrams'},
          {x:660, label:'jan 26', sub:'artifact planning'},
          {x:860, label:'apr 26', sub:'interactive html'},
          {x:1060, label:'apr 26', sub:'channel artifacts'},
          {x:1300, label:'may 26', sub:'anthropic post', hot:true},
        ];
        stops.forEach(s => {
          h.circle(s.x, 500, 22, { fill: s.hot ? COLORS.yellow : COLORS.bg, strokeWidth: 2 });
          h.text(s.x, 470, s.label, { size: 18, anchor:'middle', font: "'Cascadia Code', monospace", fill: s.hot ? COLORS.yellow : COLORS.soft });
          h.text(s.x, 560, s.sub, { size: 20, anchor:'middle', fill: s.hot ? COLORS.yellow : COLORS.ink });
        });
      }},
      { kind: "badge", draw: (svg,rc) => {
        const h = H(svg,rc);
        // sticky-note badge
        h.sticky(540, 220, 520, 130, COLORS.yellow);
        h.text(800, 310, '8 MONTHS EARLY', { size: 56, weight: 700, anchor:'middle', fill: '#1e1e1e' });
        h.text(800, 480, "i've been doing this since april.", { size: 38, anchor:'middle' });
        h.text(800, 580, '5 videos in the school.', { size: 28, anchor:'middle', fill: COLORS.soft });
        h.text(800, 640, 'this is the deeper playbook.', { size: 28, anchor:'middle', fill: COLORS.soft });
      }},
      { kind: "calm", draw: (svg,rc) => {
        const h = H(svg,rc);
        kicker(h, 200, 250, 'credibility note', COLORS.strokeAmber);
        h.text(200, 380, 'anthropic just confirmed something', { size: 44 });
        h.text(200, 440, "i've taught for months.", { size: 44 });
        h.text(200, 580, "today i'll show you what goes", { size: 36, fill: COLORS.yellow });
        h.text(200, 640, "further than the post.", { size: 36, fill: COLORS.yellow });
      }},
    ]},

  // ---- 4: MARKDOWN'S FAILURE MODE ----
  { id: 4, section: "Why HTML", title: "Markdown's failure mode",
    vars: [
      { kind: "ascii-color", draw: (svg,rc) => {
        const h = H(svg,rc);
        kicker(h, 200, 200, 'markdown trying to show color', COLORS.strokeAmber);
        // mock terminal block
        h.rect(200, 260, 1200, 440, { fill: COLORS.paper, fillStyle:'solid', roughness: 2 });
        const term = (y, t, c) => h.text(240, y, t, { size: 26, font: "'Cascadia Code', monospace", fill: c || COLORS.strokeGreen });
        term(310, '🟧 orange · 🟦 blue · 🟪 violet', COLORS.ink);
        term(370, '// ascii diagram with unicode "colors"', COLORS.faint);
        term(440, '+----+----+----+', COLORS.soft);
        term(490, '| ▓▓ | ░░ | ▒▒ |', COLORS.soft);
        term(540, '+----+----+----+', COLORS.soft);
        term(620, "this is a real claude code output.", COLORS.yellow);
      }},
      { kind: "stat", draw: (svg,rc) => {
        const h = H(svg,rc);
        h.text(800, 360, '100 LINES', { size: 160, weight: 700, anchor:'middle', fill: COLORS.yellow });
        h.underline(380, 380, 840);
        h.text(800, 500, '= unread.', { size: 70, weight: 700, anchor:'middle' });
        h.text(800, 620, "no one reads a long markdown spec.", { size: 28, anchor:'middle', fill: COLORS.soft });
        h.text(800, 670, "you barely will.", { size: 28, anchor:'middle', fill: COLORS.soft });
      }},
      { kind: "compare", draw: (svg,rc) => {
        const h = H(svg,rc);
        h.rect(140, 200, 620, 540, { fill: COLORS.paper, roughness: 2 });
        h.rect(840, 200, 620, 540, { fill: COLORS.paper, roughness: 2, stroke: COLORS.yellow, strokeWidth: 2 });
        kicker(h, 180, 250, 'markdown', COLORS.strokeAmber);
        const md = (y,t,c) => h.text(180, y, t, { size: 22, font: "'Cascadia Code', monospace", fill: c||COLORS.ink });
        md(310,'# Plan'); md(350,'- step 1'); md(390,'- step 2');
        md(460,'no diagrams', COLORS.faint);
        md(500,'no color', COLORS.faint);
        md(540,'no interaction', COLORS.faint);
        kicker(h, 880, 250, 'html', COLORS.strokeGreen);
        const ht = (y,t,c) => h.text(880, y, t, { size: 22, font: "'Cascadia Code', monospace", fill: c||COLORS.ink });
        ht(310,'<svg>...</svg>', COLORS.blue);
        ht(350,'<table>...</table>', COLORS.blue);
        ht(390,'<script>...<\/script>', COLORS.blue);
        ht(460,'+ diagrams', COLORS.strokeGreen);
        ht(500,'+ interaction', COLORS.strokeGreen);
        ht(540,'+ shareable', COLORS.strokeGreen);
      }},
    ]},

  // ---- 5: 4 REASONS ----
  { id: 5, section: "Why HTML", title: "The 4 reasons HTML wins",
    vars: [
      { kind: "quad", draw: (svg,rc) => {
        const h = H(svg,rc);
        kicker(h, 800, 200, 'why html wins', null); // overridden below
        h.text(800, 200, 'why html wins', { size: 28, anchor:'middle', font: "'Cascadia Code', monospace", fill: COLORS.yellow });
        const cells = [
          {x:200, y:280, c:COLORS.yellow, t:'DENSITY', s:'tables · svg · code · canvas'},

const grid = document.getElementById('grid');
const selCount = document.getElementById('selCount');

const state = { selections: new Map() };

function renderAll() {
  if (typeof rough === 'undefined') {
    grid.innerHTML = '<div style="color:#ff8787;font-size:24px;padding:40px;font-family:monospace">rough.js failed to load — check your internet connection or CDN access.</div>';
    return;
  }
  grid.innerHTML = '';
  for (const t of TOPICS) {
    const topic = document.createElement('section');
    topic.className = 'topic';
    topic.innerHTML = `
      <div class="topic-head">
        <div class="topic-num">#${String(t.id).padStart(2,'0')}</div>
        <div class="topic-title">${t.title}</div>
        <div class="topic-section">${t.section}</div>
      </div>
      <div class="variations" id="vars-${t.id}"></div>
    `;
    grid.appendChild(topic);
    const vars = topic.querySelector('.variations');
    t.vars.forEach((v, idx) => {
      const key = `${t.id}-${idx}`;
      const card = document.createElement('div');
      card.className = 'var-card';
      card.dataset.key = key;
      card.innerHTML = `
        <div class="slide" data-slide></div>
        <div class="var-meta">
          <div class="head">
            <span class="label">var ${String.fromCharCode(65+idx)} · ${v.kind}</span>
            <span class="rank" data-rank></span>
          </div>
          <textarea placeholder="brief description / why you like this..." data-desc></textarea>
          <button class="select-btn" data-select>select</button>
        </div>
      `;
      vars.appendChild(card);

      // Build SVG inside the slide host directly
      const slideHost = card.querySelector('[data-slide]');
      const svg = el('svg', {
        viewBox: '0 0 1600 900',
        preserveAspectRatio: 'xMidYMid meet',
        width: '100%',
        height: '100%',
      });
      slideHost.appendChild(svg);
      try {
        const rc = rough.svg(svg);
        v.draw(svg, rc);
      } catch(e) {
        console.error('Draw error for topic', t.id, 'var', idx, e);
        slideHost.innerHTML = `<div style="padding:20px;color:#ff8787;font-family:monospace;font-size:12px">draw error: ${e.message}</div>`;
      }

      const btn = card.querySelector('[data-select]');
      const desc = card.querySelector('[data-desc]');
      btn.addEventListener('click', () => toggleSelect(t.id, idx, desc, card));
      desc.addEventListener('input', () => {
        const sel = state.selections.get(key);
        if (sel) sel.description = desc.value;
      });
    });
  }
}

function toggleSelect(topicId, varIdx, descEl, card) {
  const key = `${topicId}-${varIdx}`;
  if (state.selections.has(key)) {
    state.selections.delete(key);
    card.classList.remove('selected');
    card.querySelector('[data-select]').textContent = 'select';
  } else {
    state.selections.set(key, {
      topicId, varIdx, description: descEl.value,
      order: state.selections.size + 1
    });
    card.classList.add('selected');
    card.querySelector('[data-select]').textContent = '✓ selected';
  }
  refreshRanks();
  selCount.textContent = state.selections.size;
}

function refreshRanks() {
  document.querySelectorAll('.var-card').forEach(c => {
    c.querySelector('[data-rank]').textContent = '';
  });
  let i = 1;
  for (const [key, sel] of state.selections) {
    const card = document.querySelector(`.var-card[data-key="${key}"]`);
    if (card) card.querySelector('[data-rank]').textContent = `#${i}`;
    sel.order = i;
    i++;
  }
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const out = [...state.selections.values()].map(s => {
    const t = TOPICS.find(x => x.id === s.topicId);
    const v = t.vars[s.varIdx];
    return {
      order: s.order,
      topicId: s.topicId,
      topic: t.title,
      section: t.section,
      variation: String.fromCharCode(65 + s.varIdx),
      kind: v.kind,
      description: s.description || '',
    };
  });
  const json = JSON.stringify(out, null, 2);
  try {
    await navigator.clipboard.writeText(json);
    showToast(`copied ${out.length} slide${out.length===1?'':'s'}`);
  } catch {
    showToast("couldn't copy — open console");
    console.log(json);
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  state.selections.clear();
  document.querySelectorAll('.var-card.selected').forEach(c => {
    c.classList.remove('selected');
    c.querySelector('[data-select]').textContent = 'select';
    c.querySelector('[data-rank]').textContent = '';
  });
  selCount.textContent = '0';
});

const toast = document.getElementById('toast');
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

renderAll();
</script>
</body>
</html>
