<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>five levels of ai coding — slide picker</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  @font-face {
    font-family: 'Excalifont';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'Cascadia Code';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Cascadia/CascadiaCode-Regular.woff2') format('woff2');
    font-display: swap;
  }
</style>
<script src="./rough.js"></script>
<style>
  :root {
    --bg: #1c1c1c; --paper: #262626; --ink: #e8e8e8; --ink-soft: #9b9b9b;
    --ink-faint: #555555; --rule: #3a3a3a; --accent: #f0a429;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: 'Excalifont', cursive; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 4px 4px; z-index: 1;
  }
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(28,28,28,0.94); backdrop-filter: blur(8px);
    border-bottom: 1px dashed var(--rule);
    padding: 14px 28px; display: flex; align-items: center; gap: 18px;
  }
  header h1 { margin: 0; font-size: 24px; }
  header h1 .muted { color: var(--ink-soft); font-size: 17px; }
  header .spacer { flex: 1; }
  header .count {
    font-family: 'Cascadia Code', ui-monospace, monospace; font-size: 14px;
    color: var(--ink-soft); padding: 8px 14px; background: var(--paper);
    border: 1.5px solid var(--ink-faint); border-radius: 8px;
    box-shadow: 2px 2px 0 var(--ink-faint);
  }
  header .count b { color: var(--accent); font-weight: 700; }
  header button {
    font-family: 'Excalifont', cursive; font-size: 18px; padding: 6px 16px 8px;
    background: var(--accent); color: #1e1e1e; border: 2px solid var(--ink);
    border-radius: 12px; cursor: pointer; box-shadow: 2px 3px 0 var(--ink);
    transition: transform 100ms ease;
  }
  header button:hover { transform: translate(-1px,-1px); box-shadow: 3px 4px 0 var(--ink); }
  header button:active { transform: translate(1px,2px); box-shadow: 0 0 0 var(--ink); }
  header button.secondary { background: var(--paper); color: var(--ink); }
  main { padding: 36px 28px 120px; max-width: 1780px; margin: 0 auto; position: relative; z-index: 2; }
  .topic { margin-bottom: 60px; }
  .topic-head {
    display: flex; align-items: baseline; gap: 16px; margin-bottom: 18px;
    padding-bottom: 10px; border-bottom: 1px dashed var(--rule);
  }
  .topic-num { font-family: 'Cascadia Code', monospace; font-size: 14px; color: var(--ink-faint); }
  .topic-title { font-size: 22px; }
  .topic-section {
    margin-left: auto; font-family: 'Cascadia Code', monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent);
  }
  .variations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .var-card {
    background: var(--paper); border: 2px solid var(--ink-faint); border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 3px 4px 0 var(--ink-faint); transition: all 120ms ease;
  }
  .var-card:hover { transform: translate(-1px,-1px); box-shadow: 4px 5px 0 var(--ink-soft); border-color: var(--ink-soft); }
  .var-card.selected { border-color: var(--accent); box-shadow: 4px 5px 0 var(--accent); background: #2b2415; }
  .slide {
    aspect-ratio: 16 / 9; background: var(--bg); position: relative;
    overflow: hidden; border-bottom: 1.5px dashed var(--rule); cursor: pointer;
  }
  .slide svg { width: 100%; height: 100%; display: block; }
  .var-meta { padding: 12px 14px; }
  .var-meta .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .var-meta .label {
    font-family: 'Cascadia Code', monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft);
  }
  .var-meta input, .var-meta textarea {
    width: 100%; background: var(--bg); border: 1.5px solid var(--ink-faint);
    border-radius: 8px; padding: 7px 10px; color: var(--ink);
    font-family: 'Excalifont', cursive; font-size: 15px; line-height: 1.3;
  }
  .var-meta input { margin-bottom: 7px; font-size: 17px; }
  .var-meta textarea { min-height: 46px; resize: vertical; }
  .var-meta input:focus, .var-meta textarea:focus { outline: none; border-color: var(--accent); }
  .select-btn {
    width: 100%; margin-top: 10px; padding: 6px 12px 8px; background: var(--bg);
    color: var(--ink); border: 2px solid var(--ink-soft); border-radius: 10px;
    cursor: pointer; font-family: 'Excalifont', cursive; font-size: 17px;
    box-shadow: 2px 2px 0 var(--ink-soft); transition: all 100ms ease;
  }
  .select-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink-soft); border-color: var(--ink); }
  .var-card.selected .select-btn {
    background: var(--accent); color: #1e1e1e; border-color: var(--accent);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent); color: #1e1e1e; padding: 8px 22px 10px;
    border: 2px solid var(--ink); border-radius: 12px; box-shadow: 3px 4px 0 var(--ink);
    font-size: 18px; transition: transform 220ms ease; z-index: 100;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>five levels of ai coding <span class="muted">— 10 beats × 5 variations · pick the story</span></h1>
  <div class="spacer"></div>
  <div class="count"><b id="selCount">0</b> selected</div>
  <button class="secondary" id="clearBtn">clear</button>
  <button id="copyBtn">copy as JSON</button>
</header>

<main id="grid"></main>

<div class="toast" id="toast">copied</div>

<script>
// Deck-native dark palette: picked slides transfer 1:1 into the deck file.
const COLORS = {
  ink: '#e8e8e8', soft: '#9b9b9b', faint: '#555555', card: '#323232',
  yellow: '#4d4526', blue: '#1f3a4d', green: '#234a2c', pink: '#4d2a39',
  amber: '#523a23', paper: '#262626', emerald: '#5bd66f', rose: '#ff6b6b',
  lightRed: '#4d2626', softEmerald: '#234a2c', violet: '#352c4d', teal: '#1d4642',
  blueStroke: '#74b9e7', yellowStroke: '#f0a429',
};
const MONO = "'Cascadia Code', ui-monospace, monospace";

function el(tag, attrs={}) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

// Same helper API as the deck template, scoped to one svg.
function H(svg, rc) {
  const h = {
    rect(x,y,w,hh,o={}) {
      const n = rc.rectangle(x,y,w,hh,{
        stroke: o.stroke || COLORS.ink, strokeWidth: o.strokeWidth || 1.6,
        roughness: o.roughness != null ? o.roughness : 2.0, bowing: 1.6,
        fill: o.fill, fillStyle: o.fillStyle || 'solid', fillWeight: 1, hachureGap: 6, ...o
      });
      svg.appendChild(n); return n;
    },
    line(x1,y1,x2,y2,o={}) {
      const n = rc.line(x1,y1,x2,y2,{ stroke: o.stroke || COLORS.ink, strokeWidth: o.strokeWidth || 1.4, roughness: 1.5, ...o });
      svg.appendChild(n); return n;
    },
    circle(cx,cy,d,o={}) {
      const n = rc.circle(cx,cy,d,{ stroke: o.stroke || COLORS.ink, strokeWidth: o.strokeWidth || 1.4, roughness: 1.6, fill: o.fill, fillStyle: o.fillStyle || 'solid', ...o });
      svg.appendChild(n); return n;
    },
    path(d,o={}) {
      const n = rc.path(d,{ stroke: o.stroke || COLORS.ink, strokeWidth: o.strokeWidth || 1.4, roughness: 1.6, ...o });
      svg.appendChild(n); return n;
    },
    text(x,y,t,o={}) {
      const n = el('text',{ x, y,
        'font-family': o.font || "'Excalifont', cursive",
        'font-size': o.size || 24,
        fill: o.fill || COLORS.ink,
        'text-anchor': o.anchor || 'start' });
      if (o.weight) n.setAttribute('font-weight', o.weight);
      if (o.style) n.setAttribute('font-style', o.style);
      n.textContent = t; svg.appendChild(n); return n;
    },
    arrow(x1,y1,x2,y2,o={}) {
      const curve = o.curve != null ? o.curve : 0;
      const cx = (x1+x2)/2 + curve; const cy = (y1+y2)/2 - Math.abs(curve)*0.6;
      const d = curve === 0 ? `M ${x1} ${y1} L ${x2} ${y2}` : `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
      h.path(d, o);
      const ang = Math.atan2(y2-cy, x2-cx); const ah = o.arrowSize || 14;
      h.line(x2,y2, x2-ah*Math.cos(ang-Math.PI/7), y2-ah*Math.sin(ang-Math.PI/7), o);
      h.line(x2,y2, x2-ah*Math.cos(ang+Math.PI/7), y2-ah*Math.sin(ang+Math.PI/7), o);
    },
    loopBack(x1,y1,x2,y2,dip,o={}) {
      const cx=(x1+x2)/2, cy=dip;
      h.path(`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`, o);
      const ang = Math.atan2(y2-cy, x2-cx); const ah = o.arrowSize || 14;
      h.line(x2,y2, x2-ah*Math.cos(ang-Math.PI/7), y2-ah*Math.sin(ang-Math.PI/7), o);
      h.line(x2,y2, x2-ah*Math.cos(ang+Math.PI/7), y2-ah*Math.sin(ang+Math.PI/7), o);
    },
    check(cx,cy,size=18,color=COLORS.emerald) {
      h.path(`M ${cx-size*0.6} ${cy} L ${cx-size*0.1} ${cy+size*0.5} L ${cx+size*0.7} ${cy-size*0.6}`, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
    },
    cross(cx,cy,size=18,color=COLORS.rose) {
      h.line(cx-size*0.6, cy-size*0.6, cx+size*0.6, cy+size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
      h.line(cx-size*0.6, cy+size*0.6, cx+size*0.6, cy-size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
    },
  };
  return h;
}

// ---- shared glyphs ----
function chip(h, x, y, w, hh, label, o={}) {
  h.rect(x, y, w, hh, { fill: o.fill || COLORS.card, fillStyle: 'solid', strokeWidth: o.strokeWidth || 2 });
  h.text(x+w/2, y+hh/2 + (o.sub ? -2 : 8), label, { size: o.size || 20, anchor: 'middle', weight: 700, font: o.mono === false ? undefined : MONO, fill: o.labelFill });
  if (o.sub) h.text(x+w/2, y+hh/2 + 28, o.sub, { size: o.subSize || 14, anchor: 'middle', fill: COLORS.soft });
}
function stickman(h, cx, cy, s=1, color=COLORS.ink) {
  h.circle(cx, cy, 30*s, { strokeWidth: 2, stroke: color });
  h.line(cx, cy+15*s, cx, cy+60*s, { strokeWidth: 2, stroke: color });
  h.line(cx-20*s, cy+32*s, cx+20*s, cy+32*s, { strokeWidth: 2, stroke: color });
  h.line(cx, cy+60*s, cx-16*s, cy+90*s, { strokeWidth: 2, stroke: color });
  h.line(cx, cy+60*s, cx+16*s, cy+90*s, { strokeWidth: 2, stroke: color });
}
function phoneGlyph(h, x, y, w, hh) {
  h.rect(x, y, w, hh, { fill: COLORS.paper, strokeWidth: 2.4 });
  h.line(x+w*0.35, y+18, x+w*0.65, y+18, { stroke: COLORS.faint, strokeWidth: 3 });
}
function gauge(h, cx, cy, r, frac, color, o={}) {
  h.path(`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`, { stroke: o.arcStroke || COLORS.faint, strokeWidth: 2.4 });
  const ang = Math.PI * (1 - frac);
  h.line(cx, cy, cx + r*0.82*Math.cos(ang), cy - r*0.82*Math.sin(ang), { stroke: color, strokeWidth: 4, roughness: 1.2 });
  h.circle(cx, cy, 14, { fill: color, stroke: color });
}
function loopCircle(h, cx, cy, r, color) {
  h.path(`M ${cx+r} ${cy} A ${r} ${r} 0 1 1 ${cx+r*0.7} ${cy-r*0.7}`, { stroke: color, strokeWidth: 2.2 });
  const ang = Math.PI/4 + Math.PI/2;
  const tx = cx+r*0.7, ty = cy-r*0.7, ah = 13;
  h.line(tx, ty, tx-ah*Math.cos(ang-Math.PI/7), ty-ah*Math.sin(ang-Math.PI/7), { stroke: color, strokeWidth: 2.2 });
  h.line(tx, ty, tx-ah*Math.cos(ang+Math.PI/7), ty-ah*Math.sin(ang+Math.PI/7), { stroke: color, strokeWidth: 2.2 });
}

const BEATS = [];

// ============================================================
// BEAT 1 — the ladder (overview)
// ============================================================
BEATS.push({ id: 1, section: 'overview', title: 'the ladder', vars: [

  { kind: 'staircase', headline: 'the five steps',
    caption: "boris cherny's ladder of ai adoption; each step is roughly 10x the agents",
    draw: (h) => {
      const steps = [
        { n:'0', name:'gated',     count:'0 agents',      top:560, c:COLORS.lightRed },
        { n:'1', name:'assisted',  count:'~1 agent',      top:465, c:COLORS.blue },
        { n:'2', name:'parallel',  count:'~10 agents',    top:370, c:COLORS.violet },
        { n:'3', name:'autonomy',  count:'~100 agents',   top:275, c:COLORS.amber },
        { n:'4', name:'ai native', count:'~1000+ agents', top:180, c:COLORS.softEmerald },
      ];
      steps.forEach((s, i) => {
        const x = 120 + i*280;
        h.rect(x, s.top, 260, 700 - s.top, { fill: s.c, strokeWidth: 2.2 });
        h.text(x+130, s.top+46, s.n, { size: 32, anchor: 'middle', weight: 700, font: MONO });
        h.text(x+130, s.top+80, s.name, { size: 21, anchor: 'middle' });
        h.text(x+130, s.top+110, s.count, { size: 15, anchor: 'middle', fill: COLORS.soft, font: MONO });
      });
      stickman(h, 530, 415, 0.55);
      h.text(530, 385, 'most engineers', { size: 16, anchor: 'middle', fill: COLORS.soft });
    }},

  { kind: 'staircase-bottlenecks', headline: 'the five steps',
    caption: 'every step has one bottleneck; naming yours tells you where you are',
    draw: (h) => {
      const steps = [
        { n:'0', name:'gated',     bn:'approvals',        top:500, c:COLORS.lightRed },
        { n:'1', name:'assisted',  bn:'your attention',   top:425, c:COLORS.blue },
        { n:'2', name:'parallel',  bn:'reviewing output', top:350, c:COLORS.violet },
        { n:'3', name:'autonomy',  bn:'trust in the loop',top:275, c:COLORS.amber },
        { n:'4', name:'ai native', bn:'finding the work', top:200, c:COLORS.softEmerald },
      ];
      steps.forEach((s, i) => {
        const x = 120 + i*280;
        h.rect(x, s.top, 260, 620 - s.top, { fill: s.c, strokeWidth: 2.2 });
        h.text(x+130, s.top+42, s.n + ' . ' + s.name, { size: 20, anchor: 'middle', weight: 700 });
        h.text(x+130, 668, 'bottleneck', { size: 13, anchor: 'middle', fill: COLORS.faint, font: MONO });
        h.text(x+130, 695, s.bn, { size: 17, anchor: 'middle', fill: COLORS.soft });
      });
    }},

  { kind: 'growing-circles', headline: 'the five steps',
    caption: 'agent count grows 10x per step, from zero to a thousand',
    draw: (h) => {
      const dots = [
        { cx:190,  d:70,  label:'gated',     count:'0',      c:null },
        { cx:480,  d:70,  label:'assisted',  count:'1',      c:COLORS.blue },
        { cx:790,  d:130, label:'parallel',  count:'10',     c:COLORS.violet },
        { cx:1110, d:200, label:'autonomy',  count:'100',    c:COLORS.amber },
        { cx:1420, d:290, label:'ai native', count:'1000+',  c:COLORS.softEmerald },
      ];
      dots.forEach((s) => {
        if (s.c) h.circle(s.cx, 400, s.d, { fill: s.c, strokeWidth: 2.2 });
        else { h.circle(s.cx, 400, s.d, { strokeWidth: 1.6, strokeLineDash: [8,7], stroke: COLORS.faint }); h.cross(s.cx, 400, 16); }
        if (s.c) h.text(s.cx, 410, s.count, { size: 26, anchor: 'middle', weight: 700, font: MONO });
        h.text(s.cx, 640, s.label, { size: 20, anchor: 'middle' });
        h.text(s.cx, 670, 'agents: ' + s.count, { size: 14, anchor: 'middle', fill: COLORS.soft, font: MONO });
      });
      h.arrow(150, 720, 1470, 720, { stroke: COLORS.faint, strokeWidth: 1.6, arrowSize: 12 });
    }},

  { kind: 'role-ladder', headline: 'your job changes every step',
    caption: 'the agents multiply; your role climbs from pair to steering by intent',
    draw: (h) => {
      const cols = [
        { role:'blocked',            agents:'0',     c:COLORS.lightRed },
        { role:'a pair',             agents:'1',     c:COLORS.blue },
        { role:'orchestrator',       agents:'10',    c:COLORS.violet },
        { role:'manager of managers',agents:'100',   c:COLORS.amber },
        { role:'steering by intent', agents:'1000+', c:COLORS.softEmerald },
      ];
      cols.forEach((s, i) => {
        const x = 90 + i*300;
        h.rect(x, 200, 260, 110, { fill: COLORS.card, strokeWidth: 2.2 });
        h.text(x+130, 248, 'you', { size: 19, anchor: 'middle', weight: 700 });
        h.text(x+130, 282, s.role, { size: 15, anchor: 'middle', fill: COLORS.soft });
        h.arrow(x+130, 315, x+130, 385, { strokeWidth: 1.8, arrowSize: 11 });
        h.rect(x, 390, 260, 170, { fill: s.c, strokeWidth: 2.2 });
        h.text(x+130, 470, s.agents, { size: 34, anchor: 'middle', weight: 700, font: MONO });
        h.text(x+130, 510, 'agents', { size: 15, anchor: 'middle', fill: COLORS.soft });
        h.text(x+130, 620, 'step ' + i, { size: 16, anchor: 'middle', fill: COLORS.soft, font: MONO });
      });
    }},

  { kind: 'org-trees', headline: 'from a pair to an org tree',
    caption: 'each step reshapes the org chart underneath you',
    draw: (h) => {
      const px = [90, 390, 690, 990, 1290];
      px.forEach((x, i) => {
        h.rect(x, 180, 260, 440, { stroke: COLORS.faint, strokeWidth: 1.4, strokeLineDash: [9,8] });
        h.text(x+130, 665, 'step ' + i, { size: 16, anchor: 'middle', fill: COLORS.soft, font: MONO });
      });
      // step 0: you alone, crossed
      h.circle(220, 300, 40, { fill: COLORS.card, strokeWidth: 2 });
      h.cross(220, 400, 18);
      // step 1: you + one agent
      h.circle(520, 280, 40, { fill: COLORS.card, strokeWidth: 2 });
      h.line(520, 300, 520, 380, { strokeWidth: 1.6 });
      h.circle(520, 410, 44, { fill: COLORS.blue, strokeWidth: 2 });
      // step 2: you + 5 agents
      h.circle(820, 260, 40, { fill: COLORS.card, strokeWidth: 2 });
      for (let k=0;k<5;k++) {
        const ax = 720 + k*50;
        h.line(820, 280, ax, 390, { strokeWidth: 1.2 });
        h.circle(ax, 410, 34, { fill: COLORS.violet, strokeWidth: 1.8 });
      }
      // step 3: tree, two tiers
      h.circle(1120, 250, 40, { fill: COLORS.card, strokeWidth: 2 });
      for (let k=0;k<3;k++) {
        const mx = 1050 + k*70;
        h.line(1120, 270, mx, 350, { strokeWidth: 1.2 });
        h.circle(mx, 370, 30, { fill: COLORS.amber, strokeWidth: 1.6 });
        for (let j=0;j<3;j++) {
          const lx = mx - 40 + j*40;
          h.line(mx, 385, lx, 460, { strokeWidth: 1 });
          h.circle(lx, 475, 20, { fill: COLORS.amber, strokeWidth: 1.2 });
        }
      }
      // step 4: dense forest of dots
      h.circle(1420, 250, 40, { fill: COLORS.card, strokeWidth: 2 });
      for (let r=0;r<4;r++) for (let c=0;c<6;c++) {
        h.circle(1330 + c*36, 350 + r*56, 16, { fill: COLORS.softEmerald, strokeWidth: 1, stroke: COLORS.faint });
      }
      h.text(1420, 590, '...x1000', { size: 15, anchor: 'middle', fill: COLORS.soft, font: MONO });
    }},
]});

// ============================================================
// BEAT 2 — step 0 . gated
// ============================================================
BEATS.push({ id: 2, section: 'step 0', title: 'gated', vars: [

  { kind: 'gate-pipeline', headline: 'step 0 . gated',
    caption: 'older models behind gateways, auth and approval chains; outputs never leave your laptop',
    draw: (h) => {
      const boxes = [
        { t:'claude',      sub:'older models only',  c:COLORS.blue },
        { t:'ai gateway',  sub:'adds latency',       c:COLORS.lightRed },
        { t:'custom auth', sub:'adds latency',       c:COLORS.lightRed },
        { t:'approvals',   sub:'adds weeks',         c:COLORS.lightRed },
        { t:'you',         sub:'outputs stay local', c:COLORS.card },
      ];
      boxes.forEach((b, i) => {
        const x = 65 + i*305;
        h.rect(x, 380, 250, 150, { fill: b.c, strokeWidth: 2.2 });
        h.text(x+125, 448, b.t, { size: 23, anchor: 'middle', weight: 700, font: MONO });
        h.text(x+125, 485, b.sub, { size: 15, anchor: 'middle', fill: COLORS.soft });
        if (i < boxes.length-1) {
          const rose = (i === boxes.length-2);
          h.arrow(x+255, 455, x+300, 455, { stroke: rose ? COLORS.rose : COLORS.ink, strokeWidth: 2, arrowSize: 12 });
        }
      });
      h.cross(1257, 410, 16);
    }},

  { kind: 'model-cage', headline: 'step 0 . gated',
    caption: 'the approved model lives in a cage while the frontier sits behind the wall',

// ==== RENDER ====
const grid = document.getElementById('grid');
const state = JSON.parse(localStorage.getItem('five-levels-picker') || '{}');
// state: { "<beatId>:<kind>": { selected: true, headline, caption } }

function key(beat, v) { return beat.id + ':' + v.kind; }
function save() { localStorage.setItem('five-levels-picker', JSON.stringify(state)); }
function updateCount() {
  const n = Object.values(state).filter(s => s.selected).length;
  document.getElementById('selCount').textContent = n;
}

BEATS.forEach((beat) => {
  const topic = document.createElement('div');
  topic.className = 'topic';
  topic.innerHTML = `<div class="topic-head">
    <span class="topic-num">${String(beat.id).padStart(2,'0')}</span>
    <span class="topic-title">${beat.title}</span>
    <span class="topic-section">${beat.section}</span>
  </div>`;
  const wrap = document.createElement('div');
  wrap.className = 'variations';
  beat.vars.forEach((v) => {
    const k = key(beat, v);
    const st = state[k] || {};
    const card = document.createElement('div');
    card.className = 'var-card' + (st.selected ? ' selected' : '');
    const slideDiv = document.createElement('div');
    slideDiv.className = 'slide';
    const svg = el('svg', { viewBox: '0 0 1600 900', preserveAspectRatio: 'xMidYMid meet' });
    slideDiv.appendChild(svg);
    const rc = rough.svg(svg);
    try { v.draw(H(svg, rc)); } catch (e) {
      const t = el('text', { x: 800, y: 450, 'text-anchor': 'middle', fill: '#ff6b6b', 'font-size': 30 });
      t.textContent = 'draw error: ' + e.message; svg.appendChild(t);
    }
    const meta = document.createElement('div');
    meta.className = 'var-meta';
    meta.innerHTML = `<div class="head"><span class="label">${v.kind}</span></div>`;
    const hInput = document.createElement('input');
    hInput.value = st.headline || v.headline;
    const cInput = document.createElement('textarea');
    cInput.value = st.caption || v.caption;
    const btn = document.createElement('button');
    btn.className = 'select-btn';
    btn.textContent = st.selected ? 'selected ✓' : 'select';
    const toggle = () => {
      const cur = state[k] || {};
      cur.selected = !cur.selected;
      cur.headline = hInput.value; cur.caption = cInput.value;
      state[k] = cur; save();
      card.classList.toggle('selected', cur.selected);
      btn.textContent = cur.selected ? 'selected ✓' : 'select';
      updateCount();
    };
    btn.addEventListener('click', toggle);
    slideDiv.addEventListener('click', toggle);
    const persist = () => {
      const cur = state[k] || {};
      cur.headline = hInput.value; cur.caption = cInput.value;
      state[k] = cur; save();
    };
    hInput.addEventListener('input', persist);
    cInput.addEventListener('input', persist);
    meta.appendChild(hInput); meta.appendChild(cInput); meta.appendChild(btn);
    card.appendChild(slideDiv); card.appendChild(meta);
    wrap.appendChild(card);
  });
  topic.appendChild(wrap);
  grid.appendChild(topic);
});
updateCount();

document.getElementById('clearBtn').addEventListener('click', () => {
  Object.keys(state).forEach(k => state[k].selected = false);
  save(); updateCount();
  document.querySelectorAll('.var-card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.select-btn').forEach(b => b.textContent = 'select');
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const picks = [];
  BEATS.forEach((beat) => beat.vars.forEach((v) => {
    const st = state[key(beat, v)];
    if (st && st.selected) picks.push({
      beat: beat.id, beatTitle: beat.title, section: beat.section,
      kind: v.kind, headline: st.headline || v.headline, caption: st.caption || v.caption,
    });
  }));
  navigator.clipboard.writeText(JSON.stringify(picks, null, 2)).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1400);
  });
});
