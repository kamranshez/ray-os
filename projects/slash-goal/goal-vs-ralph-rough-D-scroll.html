<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>/goal vs ralph — slide deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  :root {
    --cream: #faf7f0;
    --paper: #f5efe1;
    --ink: #1f2937;
    --ink-soft: #4b5563;
    --ink-faint: #9ca3af;
    --yellow: #fef3c7;
    --blue: #dbeafe;
    --green: #dcfce7;
    --pink: #fce7f3;
    --rule: #d6cdb6;
    --emerald: #10b981;
    --amber: #f59e0b;
    --rose: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: var(--cream); color: var(--ink);
    overflow: hidden;
    font-family: 'Crimson Pro', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ============== STAGE ============== */
  .stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ============== TABS (top) ============== */
  .tabs {
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    border-bottom: 1px dashed var(--rule);
    flex-shrink: 0;
    z-index: 10;
  }
  .tab {
    font-family: 'Caveat', cursive;
    font-size: clamp(20px, 2.2vw, 26px);
    color: var(--ink-soft);
    background: transparent;
    border: 2px solid transparent;
    padding: 2px 18px 4px;
    cursor: pointer;
    border-radius: 12px;
    transition: all 200ms ease;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: var(--ink);
    background: #fff;
    border-color: var(--ink);
    transform: rotate(-0.6deg);
    box-shadow: 2px 3px 0 var(--ink);
  }
  .tab .bracket { color: var(--ink-faint); margin: 0 4px; }
  .tab.active .bracket { color: var(--ink); }

  /* ============== SLIDE HEAD (headline + caption) ============== */
  .slide-head {
    text-align: center;
    padding: 14px 24px 4px;
    flex-shrink: 0;
  }
  .slide-head .headline {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(34px, 5vw, 64px);
    color: var(--ink);
    line-height: 1;
    margin: 0;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 380ms ease, transform 380ms ease;
  }
  .slide-head .caption {
    font-family: 'Kalam', cursive;
    font-size: clamp(15px, 1.4vw, 20px);
    color: var(--ink-soft);
    margin: 6px 0 0;
    min-height: 1.4em;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 380ms ease 80ms, transform 380ms ease 80ms;
  }
  .slide.mounted .slide-head .headline,
  .slide.mounted .slide-head .caption {
    opacity: 1;
    transform: none;
  }

  /* ============== STAGE BODY (sketch) ============== */
  .stage-body {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
  }
  .slide.active { display: flex; }
  .sketch-wrap {
    flex: 1;
    position: relative;
    margin: 0 24px 12px;
    min-height: 0;
  }
  .sketch-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .sketch-wrap .draw-on path,
  .sketch-wrap .draw-on line,
  .sketch-wrap .draw-on rect,
  .sketch-wrap .draw-on circle,
  .sketch-wrap .draw-on ellipse {
    /* draw-on animation applied via JS */
  }

  /* ============== FOOTER (counter + nav) ============== */
  .footer-bar {
    height: 60px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-top: 1px dashed var(--rule);
  }
  .counter {
    font-family: 'Caveat', cursive;
    font-size: clamp(18px, 1.6vw, 24px);
    color: var(--ink-soft);
  }
  .counter .num { color: var(--ink); font-weight: 600; }
  .nav {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .nav-btn {
    font-family: 'Caveat', cursive;
    font-size: clamp(18px, 1.6vw, 22px);
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 2px 16px 4px;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 2px 3px 0 var(--ink);
    transition: transform 100ms ease, box-shadow 100ms ease;
    min-width: 56px;
  }
  .nav-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 4px 0 var(--ink); }
  .nav-btn:active { transform: translate(1px,2px); box-shadow: 0 0 0 var(--ink); }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; transform: none; }
  .hint {
    font-family: 'Kalam', cursive;
    font-size: 13px;
    color: var(--ink-faint);
    margin-left: 14px;
  }

  /* tap zones for mobile */
  .tap-zone {
    position: absolute;
    top: 0; bottom: 0;
    width: 25%;
    z-index: 5;
    cursor: pointer;
  }
  .tap-zone.left { left: 0; }
  .tap-zone.right { right: 0; }
</style>
</head>
<body>

<div class="stage">

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="goal"><span class="bracket">[</span> /goal <span class="bracket">]</span></button>
    <button class="tab" data-tab="ralph"><span class="bracket">[</span> ralph <span class="bracket">]</span></button>
  </div>

  <div class="stage-body" id="stage-body">
    <div class="tap-zone left" id="tap-left"></div>
    <div class="tap-zone right" id="tap-right"></div>
    <!-- slides injected by JS -->
  </div>

  <div class="footer-bar">
    <div class="counter">
      <span class="num" id="slide-num">1</span> / <span id="slide-total">7</span>
      <span class="hint">← → keys · T to switch tab</span>
    </div>
    <div class="nav">
      <button class="nav-btn" id="btn-prev">← prev</button>
      <button class="nav-btn" id="btn-next">next →</button>
    </div>
  </div>

</div>

<script>
(() => {
  // ============== ROUGH.JS HELPERS ==============
  const COLORS = {
    ink: '#1f2937', soft: '#4b5563', faint: '#9ca3af',
    yellow: '#fef3c7', blue: '#dbeafe', green: '#dcfce7', pink: '#fce7f3', paper: '#f5efe1',
    emerald: '#10b981', amber: '#f59e0b', rose: '#ef4444',
  };

  const VB_W = 1600, VB_H = 900;

  const ensureRC = (svg) => {
    if (!svg.__rc) svg.__rc = rough.svg(svg);
    return svg.__rc;
  };

  const addRect = (svg, x, y, w, h, opts={}) => {
    const node = ensureRC(svg).rectangle(x, y, w, h, {
      stroke: COLORS.ink, strokeWidth: 1.6, roughness: 1.4, bowing: 1.6,
      fillStyle: 'solid', ...opts
    });
    svg.appendChild(node);
    return node;
  };
  const addLine = (svg, x1, y1, x2, y2, opts={}) => {
    const node = ensureRC(svg).line(x1, y1, x2, y2, {
      stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.2, ...opts
    });
    svg.appendChild(node);
    return node;
  };
  const addCircle = (svg, cx, cy, d, opts={}) => {
    const node = ensureRC(svg).circle(cx, cy, d, {
      stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.4, ...opts
    });
    svg.appendChild(node);
    return node;
  };
  const addPath = (svg, path, opts={}) => {
    const node = ensureRC(svg).path(path, {
      stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.4, ...opts
    });
    svg.appendChild(node);
    return node;
  };

  const addText = (svg, x, y, text, opts={}) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('font-family', opts.font || "'Caveat', cursive");
    t.setAttribute('font-size', opts.size || 28);
    t.setAttribute('fill', opts.fill || COLORS.ink);
    t.setAttribute('text-anchor', opts.anchor || 'start');
    if (opts.weight) t.setAttribute('font-weight', opts.weight);
    if (opts.style) t.setAttribute('font-style', opts.style);
    t.textContent = text;
    svg.appendChild(t);
    return t;
  };

  const addArrow = (svg, x1, y1, x2, y2, opts={}) => {
    const curve = opts.curve ?? 0;
    const cx = (x1 + x2) / 2 + curve;
    const cy = (y1 + y2) / 2 - Math.abs(curve) * 0.5;
    const path = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
    addPath(svg, path, opts);
    const angle = Math.atan2(y2 - cy, x2 - cx);
    const ah = opts.head || 18;
    const ax1 = x2 - ah * Math.cos(angle - Math.PI / 7);
    const ay1 = y2 - ah * Math.sin(angle - Math.PI / 7);
    const ax2 = x2 - ah * Math.cos(angle + Math.PI / 7);
    const ay2 = y2 - ah * Math.sin(angle + Math.PI / 7);
    addLine(svg, x2, y2, ax1, ay1, opts);
    addLine(svg, x2, y2, ax2, ay2, opts);
  };

  const addStickyNote = (svg, x, y, w, h, color, lines, opts={}) => {
    addRect(svg, x, y, w, h, { fill: color, fillStyle: 'solid', roughness: 1.6, bowing: 2 });
    addRect(svg, x + w/2 - 36, y - 14, 72, 22, {
      fill: '#ffffffcc', fillStyle: 'solid', stroke: COLORS.soft, strokeWidth: 0.8, roughness: 0.6
    });
    const size = opts.size || 26;
    lines.forEach((line, i) => {
      addText(svg, x + 22, y + 38 + i * (size + 6), line, { size, fill: COLORS.ink });
    });
  };

  const clearSvg = (svg) => { while (svg.firstChild) svg.removeChild(svg.firstChild); };

  // draw-on animation: stroke-dasharray + animate dashoffset on every path/line
  const animateDrawOn = (svg, duration=700) => {
    const els = svg.querySelectorAll('path, line, polyline, polygon, rect, circle, ellipse');
    els.forEach((el, i) => {
      try {
        let len = 0;
        if (typeof el.getTotalLength === 'function') {
          len = el.getTotalLength();
        }
        if (!len || len < 1) return;
        const fill = el.getAttribute('fill');
        const isFill = fill && fill !== 'none' && el.getAttribute('stroke') === 'none';
        if (isFill) return; // don't animate solid fills, only strokes
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
        el.style.transition = `stroke-dashoffset ${duration}ms ease`;
        // stagger
        const delay = Math.min(i * 6, 300);
        setTimeout(() => { el.style.strokeDashoffset = 0; }, delay);
        setTimeout(() => {
          el.style.strokeDasharray = '';
          el.style.strokeDashoffset = '';
          el.style.transition = '';
        }, duration + delay + 50);
      } catch (e) {}
    });
  };

  // ============== SLIDE DEFS ==============
  // Each slide: { headline, caption, render(svg) }

  const goalSlides = [
    {
      headline: 'you type /goal',
      caption: '"ship checkout v2" — pinned. you walk away.',
      render: (svg) => {
        // pinned goal card center-top
        addRect(svg, 500, 180, 600, 140, { fill: COLORS.yellow, fillStyle: 'solid', strokeWidth: 2 });
        addCircle(svg, 800, 170, 26, { fill: COLORS.rose, fillStyle: 'solid' });
        addText(svg, 800, 250, '/goal ship checkout v2', { size: 56, anchor: 'middle', font: "'JetBrains Mono', monospace" });
        addText(svg, 800, 296, 'pinned · turn 0', { size: 30, anchor: 'middle', fill: COLORS.soft });

        // empty whiteboard hint
        addText(svg, 800, 500, '(empty whiteboard below)', { size: 36, anchor: 'middle', fill: COLORS.faint, style: 'italic' });
        addText(svg, 800, 580, 'walk away →', { size: 60, anchor: 'middle', fill: COLORS.soft, weight: 600 });

        // dotted column markers
        for (let i = 0; i < 5; i++) {
          addLine(svg, 540 + i*120, 680, 540 + i*120, 720, { stroke: COLORS.faint, strokeWidth: 0.8 });
        }
      }
    },
    {
      headline: 'the model takes the wheel',
      caption: 'turns stack · thermometer climbs · you are not in the loop',
      render: (svg) => {
        // goal pin at top
        addRect(svg, 500, 80, 600, 90, { fill: COLORS.yellow, fillStyle: 'solid' });
        addCircle(svg, 800, 76, 22, { fill: COLORS.rose, fillStyle: 'solid' });
        addText(svg, 800, 130, '/goal ship checkout v2', { size: 36, anchor: 'middle', font: "'JetBrains Mono', monospace" });

        // stacked turn cells
        const cells = [
          { y: 210, fill: COLORS.blue, label: 'turn 1 · scaffold tables' },
          { y: 290, fill: COLORS.blue, label: 'turn 2 · run tests · 3 fail' },
          { y: 370, fill: COLORS.blue, label: 'turn 3 · fix migration' },
          { y: 450, fill: COLORS.blue, label: 'turn 4 · re-run · 1 fail' },
          { y: 530, fill: COLORS.paper, label: 'turn 5 · ...', dim: true },
        ];
        cells.forEach(c => {
          addRect(svg, 500, c.y, 600, 70, {
            fill: c.fill, fillStyle: 'solid',
            strokeWidth: c.dim ? 1 : 1.6, roughness: c.dim ? 0.9 : 1.4
          });
          addText(svg, 530, c.y + 46, c.label, { size: 30, fill: c.dim ? COLORS.soft : COLORS.ink });
        });

        // thermometer right
        addRect(svg, 1280, 200, 60, 480, { strokeWidth: 1.6 });
        addRect(svg, 1284, 480, 52, 196, { fill: COLORS.amber, fillStyle: 'solid', stroke: COLORS.ink });
        addCircle(svg, 1310, 700, 90, { fill: COLORS.amber, fillStyle: 'solid' });
        addText(svg, 1310, 180, 'tokens', { size: 28, anchor: 'middle', fill: COLORS.soft });
        addText(svg, 1310, 712, '32%', { size: 32, anchor: 'middle' });

        // arrow showing autonomous loop
        addArrow(svg, 460, 580, 460, 250, { stroke: COLORS.rose, strokeWidth: 2, curve: -120, head: 22 });
        addText(svg, 280, 420, 'autonomous', { size: 40, fill: COLORS.rose, weight: 600 });
        addText(svg, 290, 460, 'loop', { size: 40, fill: COLORS.rose, weight: 600 });
      }
    },
    {
      headline: 'between every turn — a hidden audit',
      caption: 'codex re-grounds the model on the original goal',
      render: (svg) => {
        // goal pin
        addRect(svg, 500, 80, 600, 80, { fill: COLORS.yellow, fillStyle: 'solid' });
        addText(svg, 800, 130, '/goal ship checkout v2', { size: 32, anchor: 'middle', font: "'JetBrains Mono', monospace" });

        // turn cells with gap
        addRect(svg, 500, 200, 600, 60, { fill: COLORS.blue, fillStyle: 'solid' });
        addText(svg, 530, 240, 'turn 2 · fix tests', { size: 28 });
        addText(svg, 800, 300, '↓ between turns ↓', { size: 32, anchor: 'middle', fill: COLORS.soft, style: 'italic' });
        addRect(svg, 500, 340, 600, 60, { fill: COLORS.paper, fillStyle: 'solid' });
        addText(svg, 530, 380, 'turn 3 · ...', { size: 28, fill: COLORS.soft });

        // hidden continuation prompt sticky note
        addStickyNote(svg, 1130, 440, 420, 260, COLORS.pink, [
          'hidden prompt:',
          'audit completion',
          'against the original',
          'goal. if uncertain,',
          'mark not achieved.',
        ], { size: 32 });
        addText(svg, 1340, 430, 'developer · injected', { size: 24, anchor: 'middle', fill: COLORS.soft, style: 'italic' });

        // curved arrow from sticky into the gap
        addArrow(svg, 1130, 480, 820, 320, { stroke: COLORS.rose, strokeWidth: 2, curve: -80, head: 20 });

        addText(svg, 80, 580, 'you don\'t see this in the UI →', { size: 34, fill: COLORS.soft });
      }
    },
    {
      headline: 'context fills · auto-compaction',
      caption: 'turns crumple into a 📜 summary · thermometer drops',
      render: (svg) => {
        // goal pin
        addRect(svg, 500, 80, 600, 80, { fill: COLORS.yellow, fillStyle: 'solid' });
        addText(svg, 800, 130, '/goal ship checkout v2', { size: 32, anchor: 'middle', font: "'JetBrains Mono', monospace" });

        // big summary card
        addRect(svg, 500, 200, 600, 130, { fill: COLORS.yellow, fillStyle: 'solid', strokeWidth: 2.2 });
        addText(svg, 530, 254, '📜 summary', { size: 44, weight: 600 });
        addText(svg, 530, 296, 'turns 1–7 compacted · 410k cached', { size: 26, fill: COLORS.soft });

        // crumpled lines below
        for (let i = 0; i < 5; i++) {
          const y = 380 + i * 44;
          addPath(svg,
            `M 530 ${y} L 620 ${y+12} L 720 ${y-10} L 820 ${y+10} L 920 ${y-6} L 1070 ${y+8}`,
            { stroke: COLORS.ink, strokeWidth: 1.2, roughness: 2 }
          );
        }

        addText(svg, 800, 660, '↑ crumpled into the summary ↑', { size: 30, anchor: 'middle', fill: COLORS.soft, style: 'italic' });

        // thermometer dropped
        addRect(svg, 1280, 200, 60, 480, { strokeWidth: 1.6 });
        addRect(svg, 1284, 600, 52, 76, { fill: COLORS.green, fillStyle: 'solid', stroke: COLORS.ink });
        addCircle(svg, 1310, 700, 90, { fill: COLORS.green, fillStyle: 'solid' });
        addText(svg, 1310, 180, 'tokens', { size: 28, anchor: 'middle', fill: COLORS.soft });
        addText(svg, 1310, 712, '18%', { size: 32, anchor: 'middle' });
        addText(svg, 1410, 480, 'auto', { size: 30, fill: COLORS.amber, weight: 600 });
        addText(svg, 1410, 516, 'compact', { size: 30, fill: COLORS.amber, weight: 600 });
        addArrow(svg, 1410, 540, 1340, 600, { stroke: COLORS.amber, strokeWidth: 1.8, curve: -10 });
      }
    },
    {
      headline: 'you can still interject',
      caption: 'queued messages snap in at the next turn boundary',
      render: (svg) => {
        addRect(svg, 500, 80, 600, 80, { fill: COLORS.yellow, fillStyle: 'solid' });
        addText(svg, 800, 130, '/goal ship checkout v2', { size: 32, anchor: 'middle', font: "'JetBrains Mono', monospace" });

        addRect(svg, 500, 200, 600, 60, { fill: COLORS.yellow, fillStyle: 'solid' });
        addText(svg, 530, 240, '📜 summary · turns 1-7', { size: 26 });

        addRect(svg, 500, 290, 600, 60, { fill: COLORS.blue, fillStyle: 'solid' });
        addText(svg, 530, 330, 'turn 8 · S03 webhook', { size: 28 });

        // pink sticky from user
        addStickyNote(svg, 500, 390, 600, 100, COLORS.pink, [
          '"also handle apple pay"'
        ], { size: 36 });
        addText(svg, 1110, 380, 'queued · next turn', { size: 24, anchor: 'start', fill: COLORS.soft, style: 'italic' });

        addRect(svg, 500, 520, 600, 60, { fill: COLORS.blue, fillStyle: 'solid' });
        addText(svg, 530, 560, 'turn 9 · integrating apple pay', { size: 28 });

        // user arrow
        addArrow(svg, 200, 360, 480, 430, { stroke: COLORS.rose, strokeWidth: 2, curve: -40, head: 20 });
        addText(svg, 60, 320, 'you, mid-loop', { size: 32, fill: COLORS.soft });

        addText(svg, 800, 700, 'snaps in at the boundary', { size: 38, anchor: 'middle', fill: COLORS.soft });
      }
    },
    {
      headline: 'update_goal({status: "complete"})',
      caption: 'the goal subsystem owns the exit · one prompt in, one outcome out',
      render: (svg) => {
        // goal pin (green)
        addRect(svg, 500, 100, 600, 110, { fill: COLORS.green, fillStyle: 'solid', strokeWidth: 2.4 });
        addCircle(svg, 800, 96, 26, { fill: COLORS.emerald, fillStyle: 'solid' });
        addText(svg, 800, 158, '/goal ship checkout v2', { size: 40, anchor: 'middle', font: "'JetBrains Mono', monospace" });
        addText(svg, 800, 192, '✓ complete', { size: 28, anchor: 'middle', fill: COLORS.emerald, weight: 600 });

        // big check
        addRect(svg, 500, 260, 600, 220, { fill: COLORS.green, fillStyle: 'solid', strokeWidth: 1.8 });
        addPath(svg, 'M 640 380 L 740 460 L 940 280', {
          stroke: COLORS.emerald, strokeWidth: 10, roughness: 1.2
        });

        addText(svg, 800, 540, 'update_goal({status: "complete"})', {
          size: 30, anchor: 'middle', font: "'JetBrains Mono', monospace", fill: COLORS.soft
        });

        addText(svg, 800, 640, 'one prompt in.', { size: 56, anchor: 'middle', weight: 600 });
        addText(svg, 800, 720, 'one outcome out.', { size: 56, anchor: 'middle', weight: 600 });

        // confetti
        const confetti = [[180,200],[1380,180],[150,500],[1430,420],[260,720],[1340,720],[420,800],[1180,800]];
        confetti.forEach(([x,y]) => {
          const c = [COLORS.amber, COLORS.rose, COLORS.emerald, COLORS.blue][Math.floor(Math.random()*4)];
          addCircle(svg, x, y, 22, { fill: c, fillStyle: 'solid', stroke: 'none' });
        });
      }
    },
    // SLIDE 7 — INVERSION (goal-side framing)
    {
      headline: 'the inversion',
      caption: 'where does the loop live? — goal wraps the loop, ralph wraps the agent',
      render: (svg) => {
        renderInversion(svg);
      }
    },
  ];

  const ralphSlides = [
    {
      headline: 'everything starts on disk',
      caption: 'prd.json + 5 checkboxes + ralph.sh — that\'s the whole goal',
      render: (svg) => {
        // ralph.sh terminal
        addRect(svg, 460, 80, 680, 110, { fill: COLORS.paper, fillStyle: 'solid' });
        addCircle(svg, 490, 110, 16, { fill: COLORS.rose, fillStyle: 'solid', stroke: 'none' });
        addCircle(svg, 516, 110, 16, { fill: COLORS.amber, fillStyle: 'solid', stroke: 'none' });
        addCircle(svg, 542, 110, 16, { fill: COLORS.emerald, fillStyle: 'solid', stroke: 'none' });
        addText(svg, 580, 116, 'ralph.sh', { size: 26, font: "'JetBrains Mono', monospace", fill: COLORS.soft });
        addText(svg, 488, 162, '$ for i in {1..5}; do agent < prd.json; done', {
          size: 26, font: "'JetBrains Mono', monospace"
        });

        // prd.json paper
        addRect(svg, 200, 280, 480, 480, { fill: COLORS.yellow, fillStyle: 'solid', roughness: 1.6 });
        addPath(svg, 'M 640 280 L 680 280 L 680 320 Z', { fill: COLORS.paper, fillStyle: 'solid' });
        addText(svg, 240, 340, 'prd.json', { size: 48, weight: 600 });
        addText(svg, 240, 380, '─────────', { size: 28, fill: COLORS.soft });
        const stories = ['signup + login', 'cart add/remove', 'stripe webhook', 'receipt email', 'admin refund'];
        stories.forEach((s, i) => {
          const y = 440 + i * 56;

  // ============== INVERSION SLIDE (shared) ==============
  function renderInversion(svg) {
    // ----- LEFT (RALPH): outer "ralph.sh loop" rect, inner agent box -----
    const leftX = 60, leftY = 40, leftW = 720, leftH = 760;

    // outer loop rect
    addRect(svg, leftX, leftY, leftW, leftH, {
      fill: COLORS.pink, fillStyle: 'solid', strokeWidth: 2.6, roughness: 1.6
    });
    addText(svg, leftX + 30, leftY + 56, 'ralph.sh loop', {
      size: 44, font: "'JetBrains Mono', monospace", weight: 600
    });
    addText(svg, leftX + 30, leftY + 96, 'for i in {1..5}; do ... done', {
      size: 24, font: "'JetBrains Mono', monospace", fill: COLORS.soft
    });

    // ghost copies (faded earlier agents)
    const ghostBoxes = [
      { x: leftX + 90, y: leftY + 180, op: 0.15 },
      { x: leftX + 140, y: leftY + 230, op: 0.30 },
      { x: leftX + 190, y: leftY + 280, op: 0.50 },
    ];
    ghostBoxes.forEach(g => {
      const r = ensureRC(svg).rectangle(g.x, g.y, 320, 200, {
        stroke: COLORS.ink, strokeWidth: 1, roughness: 2.4, fill: COLORS.blue, fillStyle: 'solid', fillWeight: 1
      });
      r.setAttribute('opacity', g.op);
      svg.appendChild(r);
    });

    // current agent (live)
    const agentX = leftX + 240, agentY = leftY + 340, agentW = 360, agentH = 220;
    addRect(svg, agentX, agentY, agentW, agentH, {
      fill: COLORS.blue, fillStyle: 'solid', strokeWidth: 2.4, roughness: 1.4
    });
    addText(svg, agentX + agentW/2, agentY + 60, 'agent', {
      size: 48, anchor: 'middle', weight: 600
    });
    addText(svg, agentX + agentW/2, agentY + 110, '(spawned this iter)', {
      size: 26, anchor: 'middle', fill: COLORS.soft, style: 'italic'
    });
    addText(svg, agentX + agentW/2, agentY + 158, 'reads disk · writes disk', {
      size: 24, anchor: 'middle', fill: COLORS.soft
    });
    addText(svg, agentX + agentW/2, agentY + 192, '· then dies', {
      size: 24, anchor: 'middle', fill: COLORS.rose, weight: 600
    });

    // loop arrow inside outer rect
    addPath(svg,
      `M ${leftX + 80} ${leftY + 640} Q ${leftX + 360} ${leftY + 720} ${leftX + 640} ${leftY + 640}`,
      { stroke: COLORS.rose, strokeWidth: 3, roughness: 1.4 }
    );
    addPath(svg,
      `M ${leftX + 640} ${leftY + 640} Q ${leftX + 690} ${leftY + 600} ${leftX + 660} ${leftY + 560}`,
      { stroke: COLORS.rose, strokeWidth: 3, roughness: 1.4 }
    );
    addArrow(svg, leftX + 660, leftY + 560, leftX + 480, leftY + 560, {
      stroke: COLORS.rose, strokeWidth: 3, curve: 0, head: 20
    });
    addText(svg, leftX + leftW/2, leftY + 720, 'spawn → die → spawn', {
      size: 28, anchor: 'middle', fill: COLORS.rose, weight: 600
    });

    // bottom annotation
    addText(svg, leftX + leftW/2, leftY + leftH - 30, 'the agent lives INSIDE the loop', {
      size: 28, anchor: 'middle', weight: 600
    });

    // ----- RIGHT (GOAL): outer "single session" rect, inner persistent loop -----
    const rightX = 820, rightY = 40, rightW = 720, rightH = 760;

    addRect(svg, rightX, rightY, rightW, rightH, {
      fill: COLORS.yellow, fillStyle: 'solid', strokeWidth: 2.6, roughness: 1.6
    });
    addText(svg, rightX + 30, rightY + 56, 'single session', {
      size: 44, weight: 600
    });
    addText(svg, rightX + 30, rightY + 96, '/goal ship checkout v2', {
      size: 24, font: "'JetBrains Mono', monospace", fill: COLORS.soft
    });

    // inner persistent loop circle
    const cx = rightX + rightW/2, cy = rightY + 380;
    addCircle(svg, cx, cy, 360, {
      fill: COLORS.green, fillStyle: 'solid', strokeWidth: 2.4
    });

    // compact glyph in middle
    addText(svg, cx, cy - 50, '📜', { size: 80, anchor: 'middle' });
    addText(svg, cx, cy + 10, 'context', { size: 28, anchor: 'middle', font: "'Caveat', cursive", weight: 600 });
    addText(svg, cx, cy + 46, 'compacted, never reset', {
      size: 22, anchor: 'middle', fill: COLORS.soft, style: 'italic'
    });

    // cycling arrows around the inner circle
    const r = 230;
    // top arrow
    addPath(svg,
      `M ${cx - r} ${cy - 40} Q ${cx} ${cy - 280} ${cx + r} ${cy - 40}`,
      { stroke: COLORS.rose, strokeWidth: 3, roughness: 1.2 }
    );
    addArrow(svg, cx + r - 20, cy - 60, cx + r, cy - 30, {
      stroke: COLORS.rose, strokeWidth: 3, curve: 0, head: 20
    });
    // bottom arrow
    addPath(svg,
      `M ${cx + r} ${cy + 40} Q ${cx} ${cy + 280} ${cx - r} ${cy + 40}`,
      { stroke: COLORS.rose, strokeWidth: 3, roughness: 1.2 }
    );
    addArrow(svg, cx - r + 20, cy + 60, cx - r, cy + 30, {
      stroke: COLORS.rose, strokeWidth: 3, curve: 0, head: 20
    });

    addText(svg, cx, rightY + 720, 'turns cycle · session never ends', {
      size: 28, anchor: 'middle', fill: COLORS.rose, weight: 600
    });

    addText(svg, rightX + rightW/2, rightY + rightH - 30, 'the loop lives INSIDE the session', {
      size: 28, anchor: 'middle', weight: 600
    });

    // ----- center footnote -----
    addText(svg, 800, 870, 'ralph wraps the agent · goal wraps the loop', {
      size: 32, anchor: 'middle', fill: COLORS.soft, font: "'Caveat', cursive", weight: 600
    });
  }

  // ============== STATE + RENDERING ==============
  const decks = { goal: goalSlides, ralph: ralphSlides };
  const state = {
    activeTab: 'goal',
    idx: { goal: 0, ralph: 0 },
  };

  const stageBody = document.getElementById('stage-body');

  // build slide DOM containers
  const slideEls = {};
  ['goal', 'ralph'].forEach(tab => {
    decks[tab].forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'slide';
      el.dataset.tab = tab;
      el.dataset.idx = i;
      el.innerHTML = `
        <div class="slide-head">
          <h1 class="headline">${s.headline}</h1>
          <p class="caption">${s.caption || ''}</p>
        </div>
        <div class="sketch-wrap">
          <svg viewBox="0 0 ${VB_W} ${VB_H}" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      `;
      stageBody.appendChild(el);
      slideEls[`${tab}-${i}`] = el;
    });
  });

  const renderSlide = (tab, i) => {
    const key = `${tab}-${i}`;
    const el = slideEls[key];
    if (!el) return;
    const svg = el.querySelector('svg');
    clearSvg(svg);
    decks[tab][i].render(svg);
    // mount animation
    el.classList.remove('mounted');
    requestAnimationFrame(() => {
      el.classList.add('active', 'mounted');
      animateDrawOn(svg, 700);
    });
  };

  const showSlide = (tab, i) => {
    // hide all
    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active', 'mounted'));
    state.idx[tab] = i;
    renderSlide(tab, i);
    // counter
    document.getElementById('slide-num').textContent = i + 1;
    document.getElementById('slide-total').textContent = decks[tab].length;
    // disable buttons at edges
    document.getElementById('btn-prev').disabled = i === 0;
    document.getElementById('btn-next').disabled = i === decks[tab].length - 1;
  };

  const next = () => {
    const cur = state.idx[state.activeTab];
    const max = decks[state.activeTab].length - 1;
    if (cur < max) showSlide(state.activeTab, cur + 1);
  };
  const prev = () => {
    const cur = state.idx[state.activeTab];
    if (cur > 0) showSlide(state.activeTab, cur - 1);
  };
  const switchTab = (tab) => {
    if (state.activeTab === tab) return;
    state.activeTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    showSlide(tab, state.idx[tab]);
  };

  // ============== EVENTS ==============
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 't' || e.key === 'T') {
      e.preventDefault();
      switchTab(state.activeTab === 'goal' ? 'ralph' : 'goal');
    }
  });

  document.getElementById('btn-next').addEventListener('click', next);
  document.getElementById('btn-prev').addEventListener('click', prev);

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  // tap zones
  document.getElementById('tap-left').addEventListener('click', prev);
  document.getElementById('tap-right').addEventListener('click', next);

  // ============== INIT ==============
  showSlide('goal', 0);

})();
