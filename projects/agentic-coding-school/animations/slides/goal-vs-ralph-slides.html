<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>two kinds of work — pre-decomposable vs unfolding</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  /* Excalidraw's actual fonts, loaded from their public repo via jsdelivr */
  @font-face {
    font-family: 'Excalifont';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Cascadia Code';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Cascadia/CascadiaCode-Regular.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
</style>
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  :root {
    /* Excalidraw palette */
    --cream: #ffffff;          /* canvas */
    --paper: #f8f9fa;          /* gray [1] — subtle off-white panels */
    --ink: #1e1e1e;            /* black */
    --ink-soft: #868e96;       /* gray [3] */
    --ink-faint: #ced4da;      /* gray [2] */
    --yellow: #ffec99;         /* yellow [1] */
    --blue: #a5d8ff;           /* blue [1] */
    --green: #b2f2bb;          /* green [1] */
    --pink: #fcc2d7;           /* pink [1] */
    --amber: #ffd8a8;          /* orange [1] */
    --light-red: #ffc9c9;      /* red [1] */
    --soft-emerald: #b2f2bb;   /* green [1] */
    --violet: #d0bfff;         /* violet [1] */
    --teal: #96f2d7;           /* teal [1] */
    --rule: #ced4da;           /* gray [2] */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: 'Excalifont', cursive;
    -webkit-font-smoothing: antialiased;
  }

  /* subtle paper grain */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px);
    background-size: 4px 4px;
    z-index: 1;
  }

  /* ========== THUMBNAIL SIDEBAR ========== */
  .thumb-sidebar {
    position: fixed;
    top: 50px;
    bottom: 0;
    left: 0;
    width: 220px;
    background: var(--paper);
    border-right: 1px dashed var(--rule);
    overflow-y: auto;
    padding: 10px 8px 60px;
    z-index: 15;
    font-family: 'Excalifont', cursive;
  }
  .thumb-sidebar .thumb {
    background: var(--cream);
    border: 1.5px solid var(--ink-soft);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    cursor: pointer;
    box-shadow: 1px 2px 0 var(--ink-soft);
    transition: transform 100ms ease;
  }
  .thumb-sidebar .thumb:hover {
    transform: translate(-1px,-1px);
    border-color: var(--ink);
    box-shadow: 2px 3px 0 var(--ink);
  }
  .thumb-sidebar .thumb.active {
    background: var(--yellow);
    border-color: var(--ink);
    border-width: 2px;
    box-shadow: 3px 4px 0 var(--ink), inset 4px 0 0 var(--ink);
    transform: translate(-1px,-1px);
    padding-left: 14px;
  }
  .thumb-sidebar .thumb.active .num {
    color: var(--ink);
    font-weight: 800;
  }
  .thumb-sidebar .thumb.active .label {
    font-weight: 700;
  }
  .thumb-sidebar .thumb.active::after {
    content: '◀';
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: var(--ink);
  }
  .thumb-sidebar .thumb { position: relative; }
  .thumb-sidebar .thumb .num {
    font-size: 14px;
    color: var(--ink-soft);
    font-family: 'Cascadia Code', ui-monospace, monospace;
    font-weight: 600;
  }
  .thumb-sidebar .thumb .label {
    font-size: 18px;
    color: var(--ink);
    line-height: 1.15;
    margin-top: 2px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  @media (min-width: 900px) {
    body:not(.sidebar-collapsed) .topbar,
    body:not(.sidebar-collapsed) .stage { left: 220px; }
  }
  @media (max-width: 899px) {
    .thumb-sidebar { display: none; }
  }
  body.sidebar-collapsed .thumb-sidebar { display: none; }
  body.sidebar-collapsed .topbar,
  body.sidebar-collapsed .stage { left: 0; }

  /* ========== HEADER ========== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 28px;
    border-bottom: 1px dashed var(--rule);
    background: var(--cream);
    z-index: 20;
  }
  .topbar .title {
    font-family: 'Excalifont', cursive;
    font-size: 26px;
    color: var(--ink);
    line-height: 1;
  }
  .topbar .counter {
    font-family: 'Excalifont', cursive;
    font-size: 22px;
    color: var(--ink-soft);
  }
  .topbar .counter .num { color: var(--ink); font-weight: 700; }

  /* ========== SLIDE STAGE ========== */
  .stage {
    position: fixed;
    top: 50px;
    bottom: 0;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    z-index: 5;
  }
  .sketch-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 20px 4px;
    position: relative;
  }
  .sketch-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
    transition: opacity 250ms ease;
  }
  .sketch-wrap svg.fading { opacity: 0; }

  /* ========== COMMENT MODE ========== */
  #comment-overlay {
    position: absolute;
    inset: 12px 20px 4px;
    pointer-events: none;
    z-index: 8;
  }
  body.comment-mode #comment-overlay {
    pointer-events: auto;
    cursor: crosshair;
  }
  .comment-banner {
    position: fixed;
    top: 12px;
    right: 14px;
    background: #ef4444;
    color: white;
    font-family: 'Cascadia Code', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 4px 8px;
    border-radius: 4px;
    box-shadow: 1px 1px 0 #1f2937;
    display: none;
    z-index: 30;
    text-transform: uppercase;
  }
  body.comment-mode .comment-banner { display: block; }
  .comment-pin {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ef4444;
    color: white;
    font-family: 'Cascadia Code', ui-monospace, monospace;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate(-50%, -50%);
    border: 2px solid #1f2937;
    box-shadow: 1px 2px 0 #1f2937;
    pointer-events: auto;
    cursor: pointer;
    z-index: 9;
  }
  .comment-pin:hover {
    transform: translate(-50%, -50%) scale(1.15);
  }
  .comment-pin .tooltip {
    position: absolute;
    left: 34px;
    top: -4px;
    background: #fef3c7;
    color: #1f2937;
    font-family: 'Excalifont', cursive;
    font-size: 16px;
    padding: 4px 10px;
    border: 1.5px solid #1f2937;
    border-radius: 4px;
    white-space: nowrap;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 2px 2px 0 #1f2937;
    display: none;
  }
  .comment-pin:hover .tooltip { display: block; }

  .caption-area {
    flex: 0 0 auto;
    text-align: center;
    padding: 8px 32px 70px;
    transition: opacity 250ms ease;
  }
  .caption-area.fading { opacity: 0; }
  .caption-area h2 {
    font-family: 'Excalifont', cursive;
    font-weight: 700;
    margin: 0 0 6px;
    font-size: clamp(2.2rem, 4.2vw, 3.4rem);
    line-height: 1.05;
    color: var(--ink);
  }
  .caption-area p {
    font-family: 'Excalifont', cursive;
    margin: 0 auto;
    font-size: clamp(1.1rem, 1.6vw, 1.45rem);
    line-height: 1.4;
    color: var(--ink-soft);
    max-width: 920px;
  }

  /* ========== TAP ZONES ========== */
  .tap-zone {
    position: fixed;
    top: 50px; bottom: 0;
    width: 50%;
    z-index: 8;
    cursor: pointer;
  }
  .tap-zone.left { left: 0; }
  .tap-zone.right { right: 0; }

  /* ========== NAV BUTTONS ========== */
  .nav-btn {
    position: fixed;
    bottom: 18px;
    z-index: 25;
    font-family: 'Excalifont', cursive;
    font-size: 22px;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 6px 18px 8px;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 2px 3px 0 var(--ink);
    transition: transform 120ms ease, box-shadow 120ms ease, opacity 200ms ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .nav-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 4px 0 var(--ink); }
  .nav-btn:active { transform: translate(1px,2px); box-shadow: 0 0 0 var(--ink); }
  .nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
  }
  .nav-btn.prev { left: 24px; }
  .nav-btn.next { right: 24px; }
  .nav-btn .arrow {
    font-family: 'Excalifont', cursive;
    font-size: 28px;
    line-height: 1;
  }

  .replay-btn {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 25;
    font-family: 'Excalifont', cursive;
    font-size: 18px;
    background: var(--paper);
    border: 1.5px dashed var(--ink-soft);
    border-radius: 10px;
    padding: 4px 14px 6px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .replay-btn:hover {
    color: var(--ink);
    border-color: var(--ink);
    border-style: solid;
  }

  /* draw-on animation */
  .draw-on path,
  .draw-on line,
  .draw-on circle,
  .draw-on rect {
    stroke-dasharray: 1500;
    stroke-dashoffset: 1500;
    animation: drawOn 700ms ease forwards;
  }
  @keyframes drawOn {
    to { stroke-dashoffset: 0; }
  }
  .draw-on text {
    opacity: 0;
    animation: fadeIn 500ms ease forwards;
    animation-delay: 400ms;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>

<aside class="thumb-sidebar" id="thumb-sidebar"></aside>

<div class="topbar">
  <div class="title">two kinds of work</div>
  <div class="counter"><span class="num" id="slide-num">1</span> / <span id="slide-total">10</span></div>
</div>

<div class="stage">
  <div class="sketch-wrap" id="sketch-wrap">
    <svg id="sketch" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="comment-overlay"></div>
    <div id="comment-banner" class="comment-banner">● comment mode</div>
  </div>
  <div class="caption-area" id="caption">
    <h2 id="headline">two kinds of work</h2>
    <p id="caption-text">I noticed something weird about Codex's /goal command</p>
  </div>
</div>

<div class="tap-zone left" id="tap-left"></div>
<div class="tap-zone right" id="tap-right"></div>

<button class="nav-btn prev" id="btn-prev"><span class="arrow">←</span> prev</button>
<button class="nav-btn next" id="btn-next">next <span class="arrow">→</span></button>

<script>
(() => {
  // Excalidraw palette
  const COLORS = {
    ink: '#1e1e1e',          // black
    soft: '#868e96',         // gray [3]
    faint: '#ced4da',         // gray [2]
    yellow: '#ffec99',       // yellow [1]
    blue: '#a5d8ff',         // blue [1]
    green: '#b2f2bb',        // green [1]
    pink: '#fcc2d7',         // pink [1]
    amber: '#ffd8a8',        // orange [1]
    paper: '#f8f9fa',        // gray [1]
    emerald: '#2f9e44',      // green [4]
    rose: '#e03131',         // red [4]
    lightRed: '#ffc9c9',     // red [1]
    softEmerald: '#b2f2bb',  // green [1] (alias)
    violet: '#d0bfff',       // violet [1]
    teal: '#96f2d7',         // teal [1]
    blueStroke: '#1971c2',   // blue [4]
    yellowStroke: '#f08c00', // yellow [4]
  };

  const svg = document.getElementById('sketch');
  let rc = rough.svg(svg);

  const clearSvg = (s) => { while (s.firstChild) s.removeChild(s.firstChild); };

  const addRect = (x, y, w, h, opts={}) => {
    const node = rc.rectangle(x, y, w, h, {
      stroke: COLORS.ink, strokeWidth: 1.6, roughness: 2.0, bowing: 1.6,
      fill: opts.fill, fillStyle: opts.fillStyle || 'solid', fillWeight: 1,
      hachureGap: 6, ...opts
    });
    svg.appendChild(node);
    return node;
  };
  const addLine = (x1,y1,x2,y2, opts={}) => {
    const node = rc.line(x1,y1,x2,y2, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.5, ...opts });
    svg.appendChild(node);
    return node;
  };
  const addCircle = (cx,cy,d, opts={}) => {
    const node = rc.circle(cx,cy,d, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.6, ...opts });
    svg.appendChild(node);
    return node;
  };
  const addEllipse = (cx,cy,w,h, opts={}) => {
    const node = rc.ellipse(cx,cy,w,h, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.8, ...opts });
    svg.appendChild(node);
    return node;
  };
  const addPath = (path, opts={}) => {
    const node = rc.path(path, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.6, ...opts });
    svg.appendChild(node);
    return node;
  };

  const addText = (x,y, text, opts={}) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('font-family', opts.font || "'Excalifont', cursive");
    t.setAttribute('font-size', opts.size || 24);
    t.setAttribute('fill', opts.fill || COLORS.ink);
    t.setAttribute('text-anchor', opts.anchor || 'start');
    if (opts.weight) t.setAttribute('font-weight', opts.weight);
    if (opts.style) t.setAttribute('font-style', opts.style);
    t.textContent = text;
    svg.appendChild(t);
    return t;
  };

  const addArrow = (x1,y1,x2,y2, opts={}) => {
    const curve = opts.curve != null ? opts.curve : 30;
    const cx = (x1+x2)/2 + curve;
    const cy = (y1+y2)/2 - Math.abs(curve)*0.6;
    const path = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
    addPath(path, opts);
    const angle = Math.atan2(y2-cy, x2-cx);
    const ah = opts.arrowSize || 14;
    const ax1 = x2 - ah*Math.cos(angle - Math.PI/7);
    const ay1 = y2 - ah*Math.sin(angle - Math.PI/7);
    const ax2 = x2 - ah*Math.cos(angle + Math.PI/7);
    const ay2 = y2 - ah*Math.sin(angle + Math.PI/7);
    addLine(x2,y2,ax1,ay1, opts);
    addLine(x2,y2,ax2,ay2, opts);
  };

  // checkmark / x icon
  const addCheck = (cx, cy, size=18, color=COLORS.emerald) => {
    addPath(`M ${cx-size*0.6} ${cy} L ${cx-size*0.1} ${cy+size*0.5} L ${cx+size*0.7} ${cy-size*0.6}`, {
      stroke: color, strokeWidth: 3.5, roughness: 1.2
    });
  };
  const addCross = (cx, cy, size=18, color=COLORS.rose) => {
    addLine(cx-size*0.6, cy-size*0.6, cx+size*0.6, cy+size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
    addLine(cx-size*0.6, cy+size*0.6, cx+size*0.6, cy-size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
  };

  // ============== SLIDES ==============
  const slides = [];

  // -------- SLIDE 1: TITLE --------
  const slideTitle = {
    headline: 'two kinds of work',
    caption: "I noticed something weird about Codex's /goal command",
    draw: () => {
      // Left box: tickets
      addRect(180, 180, 540, 520, { fill: COLORS.yellow, fillStyle: 'solid', strokeWidth: 2 });
      addText(450, 240, 'tickets', { size: 52, anchor: 'middle', weight: 700 });
      // stack of papers
      for (let i = 0; i < 5; i++) {
        const y = 290 + i * 60;
        addRect(260, y, 380, 44, { fill: '#fff', fillStyle: 'solid', strokeWidth: 1.4 });
        addLine(290, y+22, 600, y+22, { stroke: COLORS.faint, strokeWidth: 1 });
        addLine(290, y+32, 540, y+32, { stroke: COLORS.faint, strokeWidth: 1 });
        // tiny checkbox
        addRect(275, y+12, 18, 18, { strokeWidth: 1.2 });
      }
      addText(450, 660, 'tidy · enumerable · finite', { size: 26, anchor: 'middle', fill: COLORS.soft, style: 'italic' });

      // Right box: tangle
      addRect(880, 180, 540, 520, { fill: COLORS.pink, fillStyle: 'solid', strokeWidth: 2 });
      addText(1150, 240, '? ?', { size: 52, anchor: 'middle', weight: 700 });

      // tangled scribble of arrows
      addPath('M 970 340 Q 1050 300 1120 360 T 1280 380 Q 1340 420 1280 470 T 1120 460 Q 1040 480 990 440 T 1020 380', {
        stroke: COLORS.ink, strokeWidth: 2, roughness: 2.4, fill: 'none'
      });
      addPath('M 1000 420 Q 1100 460 1200 420 T 1340 470 Q 1300 540 1180 520 T 1020 510', {
        stroke: COLORS.rose, strokeWidth: 2, roughness: 2.6, fill: 'none'
      });
      addPath('M 1080 360 Q 1180 400 1240 460 Q 1290 500 1240 540 Q 1180 560 1140 510', {
        stroke: COLORS.ink, strokeWidth: 1.6, roughness: 2.4, fill: 'none'
      });
      // arrowheads sprinkled
      addLine(1280, 470, 1268, 460, { strokeWidth: 1.6 });
      addLine(1280, 470, 1268, 480, { strokeWidth: 1.6 });
      addLine(1140, 510, 1128, 504, { strokeWidth: 1.6 });
      addLine(1140, 510, 1128, 516, { strokeWidth: 1.6 });

      // big "?"
      addText(1150, 640, '?', { size: 96, anchor: 'middle', weight: 700, fill: COLORS.ink });

      // divider scribble
      addPath('M 800 200 Q 810 450 800 700', { stroke: COLORS.faint, strokeWidth: 1.2, roughness: 2, fill: 'none' });
    }
  };
  slides.push(slideTitle);

  // -------- SLIDE 2: PRE-DECOMPOSABLE --------
  const slidePreDecomposable = {
    headline: 'pre-decomposable',
    caption: 'example: notion integration — every story is known upfront',
    draw: () => {
      // big paper
      addRect(380, 100, 840, 720, { fill: COLORS.yellow, fillStyle: 'solid', strokeWidth: 2 });
      // dog ear
      addPath('M 1180 100 L 1220 100 L 1220 140 Z', { stroke: COLORS.ink, fill: COLORS.paper, fillStyle: 'solid', strokeWidth: 1.4 });

      addText(420, 165, 'prd.json', { size: 44, weight: 700, font: "'Cascadia Code', ui-monospace, monospace" });
      addLine(420, 185, 1180, 185, { stroke: COLORS.soft, strokeWidth: 1.2 });

      const items = [
        'S01: notion oauth flow',
        'S02: page picker UI',
        'S03: markdown sync task',
        'S04: child page recursion',
        'S05: webhook receiver',
        'S06: rate-limit wrapper',
        'S07: 500KB truncation',
        'S08: auto-retrain hook',
      ];
      items.forEach((s, i) => {
        const y = 240 + i * 52;
        // checkbox
        addRect(440, y, 26, 26, { strokeWidth: 1.4 });
        addText(490, y+22, '[ ]', { size: 22, font: "'Cascadia Code', ui-monospace, monospace", fill: COLORS.soft });
        addText(560, y+22, s, { size: 26, font: "'Cascadia Code', ui-monospace, monospace", fill: COLORS.ink });
      });

      // marginalia
      addText(180, 405, 'known up', { size: 36, fill: COLORS.soft });
      addText(180, 450, 'front', { size: 36, fill: COLORS.soft });
      addArrow(290, 420, 420, 380, { stroke: COLORS.rose, strokeWidth: 1.8, curve: -20 });

      addText(1300, 540, 'finite.', { size: 38, weight: 700 });
      addText(1300, 590, 'parallel.', { size: 38, weight: 700 });
      addText(1300, 640, 'independent.', { size: 38, weight: 700 });
    }
  };
  slides.push(slidePreDecomposable);

  // -------- SLIDE 3: UNFOLDING --------
  const slideUnfolding = {
    headline: 'unfolding',
    caption: 'you only know the goal. the plan emerges. example: cut p95 /api/checkout latency by 20%',
    draw: () => {
      // pinned goal at top
      addRect(360, 80, 880, 90, { fill: COLORS.amber, fillStyle: 'solid', strokeWidth: 2 });
      addCircle(800, 76, 16, { fill: COLORS.rose, fillStyle: 'solid' });
      addText(800, 125, 'cut p95 /api/checkout latency by 20%', { size: 26, anchor: 'middle', font: "'Cascadia Code', ui-monospace, monospace", weight: 600 });
      addText(800, 154, '(287ms → ≤ 230ms)', { size: 20, anchor: 'middle', fill: COLORS.soft, style: 'italic' });

      // Root
      addEllipse(800, 240, 200, 60, { fill: COLORS.blue, fillStyle: 'solid', strokeWidth: 1.6 });
      addText(800, 247, 'cut latency 20%', { size: 22, anchor: 'middle', weight: 600 });

      // 4 children: network roundtrips? · query waterfall? · payload size? · cold start?
      const children = [
        { x: 250, label: 'network', label2: 'roundtrips?', dead: true },
        { x: 640, label: 'query', label2: 'waterfall?', active: true },
        { x: 1040, label: 'payload', label2: 'size?', dead: true },
        { x: 1380, label: 'cold start?', label2: '', dead: true },
      ];
      children.forEach(c => {
        addArrow(800, 270, c.x, 380, { stroke: COLORS.ink, curve: (c.x - 800) * 0.05, arrowSize: 12 });
        addEllipse(c.x, 405, 170, 60, { fill: c.active ? COLORS.softEmerald : COLORS.pink, fillStyle: 'solid', strokeWidth: c.active ? 2 : 1.4 });

          const x2 = startX + (endX - startX) * t2;
          const y2 = s.y + (endY - s.y) * t2;
          addLine(x1, y1, x2, y2, { stroke: COLORS.soft, strokeWidth: 1.4, roughness: 0.6 });
        }
      });

      // bottom callout
      addText(800, 850, 'no reach → /goal can\'t fix what it can\'t see', {
        size: 24, anchor: 'middle', fill: COLORS.soft, style: 'italic'
      });
    }
  };

  // ============== FINAL SLIDE ORDER (Pass 1: reorder + drop) ==============
  // Drops: slideRalphPre (eats for breakfast), slideGoalPre (struggles here),
  //        slideRalphLosesThread, slideVagueness, slideResists
  // New slides (mechanism, audit, two-ways-to-point, audio-transcribe map,
  //             auto-research, contamination, scrappy-copy, opener, two-solutions, closer)
  //             will be added in Pass 2.
  slides.length = 0;
  slides.push(
    slideOpener,             // 1.  the agent stops before it's actually done
    slideTwoSolutions,       // 2.  two kinds of solutions
    slideTitle,              // 3.  two kinds of work
    slidePreDecomposable,    // 4.  pre-decomposable
    slideUnfolding,          // 5.  unfolding
    slideVerifiable,         // 6.  a goal must be verifiable
    slideMechanism,          // 7.  how /goal works behind the scenes
    slideTwoWays,            // 8.  two ways to point /goal
    slideMap,                // 9.  a real example: audio transcribe service
    slideGoalUnf,            // 10. goal carries the hypothesis
    slidePeek,               // 11. peek without breaking flow
    slideCompaction,         // 12. compaction makes the thread richer
    slideDecompositionCost,  // 13. decomposition isn't free
    slideHybrid,             // 14. the hybrid: ralph wraps goal
    slideMatrix              // 15. the right tool depends on the work
  );

  // ============== STATE / RENDER ==============
  let current = 0;

  const render = (idx, animate=true) => {
    const slide = slides[idx];
    const captionEl = document.getElementById('caption');
    captionEl.classList.add('fading');
    svg.classList.add('fading');

    setTimeout(() => {
      clearSvg(svg);
      // re-grab roughjs instance after clear (svg same node, fine)
      rc = rough.svg(svg);

      // render slide
      slide.draw();

      // draw-on animation
      if (animate) {
        svg.classList.add('draw-on');
        // restart animation
        svg.getBoundingClientRect();
      }

      // update caption
      document.getElementById('headline').textContent = slide.headline;
      document.getElementById('caption-text').textContent = slide.caption;
      document.getElementById('slide-num').textContent = (idx+1);

      svg.classList.remove('fading');
      captionEl.classList.remove('fading');

      // remove draw-on class after animation done
      if (animate) {
        setTimeout(() => svg.classList.remove('draw-on'), 1200);
      }

      // disabled state
      document.getElementById('btn-prev').disabled = idx === 0;
      document.getElementById('btn-next').disabled = idx === slides.length - 1;
      document.getElementById('slide-total').textContent = slides.length;
    }, 220);
  };

  const goTo = (idx) => {
    if (idx < 0 || idx >= slides.length) return;
    if (idx === current) return;
    current = idx;
    render(current);
  };

  const next = () => goTo(current + 1);
  const prev = () => goTo(current - 1);

  // ============== NOTES.JSON SYNC ==============
  const NOTES_URL = 'notes.json';
  const SYNC_URL = 'http://localhost:7878/current';
  let lastNotesHash = null;
  let suppressLocalPost = false;

  const applyNotes = (data) => {
    if (!data || !Array.isArray(data.slides)) return;
    data.slides.forEach((s, i) => {
      if (slides[i]) {
        if (s.headline) slides[i].headline = s.headline;
        if (s.caption)  slides[i].caption  = s.caption;
      }
    });
    // refresh visible caption
    if (slides[current]) {
      document.getElementById('headline').textContent = slides[current].headline;
      document.getElementById('caption-text').textContent = slides[current].caption;
    }
    renderThumbs();
  };

  const fetchNotes = async () => {
    try {
      const r = await fetch(NOTES_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return null;
      return await r.json();
    } catch (e) {
      return null;
    }
  };

  const pollNotes = async () => {
    const data = await fetchNotes();
    if (!data) return;
    const hash = JSON.stringify(data);
    if (hash === lastNotesHash) return;
    lastNotesHash = hash;
    applyNotes(data);
    if (typeof data.current === 'number' && data.current !== current) {
      suppressLocalPost = true;
      goTo(data.current);
      suppressLocalPost = false;
    }
  };

  const postCurrent = (idx) => {
    if (suppressLocalPost) return;
    fetch(SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current: idx })
    }).catch(() => { /* offline / no server — silent */ });
  };

  // ============== THUMBNAIL SIDEBAR ==============
  const sidebar = document.getElementById('thumb-sidebar');
  const renderThumbs = () => {
    sidebar.innerHTML = '';
    slides.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'thumb' + (i === current ? ' active' : '');
      div.innerHTML = `<div class="num">${String(i+1).padStart(2,'0')}</div><div class="label">${s.headline}</div>`;
      div.addEventListener('click', () => { goTo(i); postCurrent(i); });
      sidebar.appendChild(div);
    });
  };

  // wrap goTo to update thumbs
  const _goTo = goTo;
  const goToWithThumbs = (idx) => {
    _goTo(idx);
    renderThumbs();
  };

  // ============== SIDEBAR COLLAPSE (keyboard: S) ==============
  const SIDEBAR_KEY = 'goal-vs-ralph-sidebar-collapsed';
  const applySidebarState = (collapsed) => {
    document.body.classList.toggle('sidebar-collapsed', collapsed);
  };
  applySidebarState(localStorage.getItem(SIDEBAR_KEY) === '1');
  const toggleSidebar = () => {
    const collapsed = !document.body.classList.contains('sidebar-collapsed');
    applySidebarState(collapsed);
    localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0');
  };

  // ============== INIT ==============
  (async () => {
    const initial = await fetchNotes();
    if (initial) {
      lastNotesHash = JSON.stringify(initial);
      applyNotes(initial);
      if (typeof initial.current === 'number') current = Math.max(0, Math.min(slides.length - 1, initial.current));
    }
    render(current);
    renderThumbs();
    setInterval(pollNotes, 1000);
  })();

  // Buttons
  document.getElementById('btn-next').addEventListener('click', () => { next(); renderThumbs(); postCurrent(current); });
  document.getElementById('btn-prev').addEventListener('click', () => { prev(); renderThumbs(); postCurrent(current); });

  // Tap zones
  document.getElementById('tap-left').addEventListener('click', () => { prev(); renderThumbs(); postCurrent(current); });
  document.getElementById('tap-right').addEventListener('click', () => { next(); renderThumbs(); postCurrent(current); });

  // ============== COMMENT MODE ==============
  const COMMENTS_KEY = 'goal-vs-ralph-comments';
  const overlay = document.getElementById('comment-overlay');
  let comments = JSON.parse(localStorage.getItem(COMMENTS_KEY) || '{}'); // { [slideIdx]: [{x, y, text}] }

  const saveComments = () => localStorage.setItem(COMMENTS_KEY, JSON.stringify(comments));

  const renderComments = () => {
    overlay.querySelectorAll('.comment-pin').forEach(n => n.remove());
    const list = comments[current] || [];
    list.forEach((c, i) => {
      const pin = document.createElement('div');
      pin.className = 'comment-pin';
      pin.style.left = (c.x * 100) + '%';
      pin.style.top = (c.y * 100) + '%';
      pin.textContent = (i + 1);
      const tip = document.createElement('div');
      tip.className = 'tooltip';
      tip.textContent = c.text;
      pin.appendChild(tip);
      pin.addEventListener('click', (e) => {
        e.stopPropagation();
        if (document.body.classList.contains('comment-mode')) {
          const newText = prompt('edit comment (leave empty to delete):', c.text);
          if (newText === null) return;
          if (newText.trim() === '') list.splice(i, 1);
          else list[i].text = newText;
          comments[current] = list;
          saveComments();
          renderComments();
        }
      });
      overlay.appendChild(pin);
    });
  };

  const toggleCommentMode = () => {
    document.body.classList.toggle('comment-mode');
    renderComments();
  };

  overlay.addEventListener('click', (e) => {
    if (!document.body.classList.contains('comment-mode')) return;
    if (e.target !== overlay) return; // clicked existing pin handled separately
    const rect = overlay.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    const text = prompt('comment:');
    if (!text) return;
    if (!comments[current]) comments[current] = [];
    comments[current].push({ x, y, text });
    saveComments();
    renderComments();
  });

  const exportComments = () => {
    const slidesWithComments = Object.entries(comments)
      .filter(([_, arr]) => arr && arr.length)
      .map(([idx, arr]) => ({
        slide: parseInt(idx, 10) + 1,
        headline: slides[idx]?.headline || '',
        comments: arr.map((c, i) => ({ n: i + 1, x: +c.x.toFixed(3), y: +c.y.toFixed(3), text: c.text }))
      }));
    const blob = JSON.stringify({ exportedAt: new Date().toISOString(), slides: slidesWithComments }, null, 2);
    navigator.clipboard.writeText(blob).then(() => {
      alert('comments copied to clipboard (' + slidesWithComments.reduce((n, s) => n + s.comments.length, 0) + ' total)');
    }).catch(() => {
      // fallback: download as file
      const a = document.createElement('a');
      a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(blob);
      a.download = 'slide-comments.json';
      a.click();
    });
  };

  const clearSlideComments = () => {
    if (!comments[current] || !comments[current].length) return;
    if (confirm('clear ' + comments[current].length + ' comment(s) on this slide?')) {
      delete comments[current];
      saveComments();
      renderComments();
    }
  };

  // re-render comments whenever slide changes
  const _origRenderThumbs = renderThumbs;
  // hook into navigation: render comments after each goTo
  const origGoTo = goTo;
  // simple: re-render on any nav by hooking navigation calls below
  // but simpler — listen for slide-num text change via mutation observer:
  new MutationObserver(renderComments).observe(document.getElementById('slide-num'), { childList: true });

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); renderThumbs(); postCurrent(current); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); renderThumbs(); postCurrent(current); }
    else if (e.key === 's' || e.key === 'S') { e.preventDefault(); toggleSidebar(); }
    else if (e.key === 'c' || e.key === 'C') { e.preventDefault(); toggleCommentMode(); }
    else if (e.key === 'Escape') { document.body.classList.remove('comment-mode'); }
    else if ((e.key === 'e' || e.key === 'E') && document.body.classList.contains('comment-mode')) { e.preventDefault(); exportComments(); }
    else if ((e.key === 'x' || e.key === 'X') && document.body.classList.contains('comment-mode')) { e.preventDefault(); clearSlideComments(); }
  });

  renderComments();
})();
</script>

</body>
