<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>goal-vs-ralph · level 1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; }
  body {
    background-color: #020617; /* slate-950 */
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  .bar-fill {
    transition: width 0.5s ease-out, transform 0.35s ease-in-out;
    will-change: width, transform;
  }
  .tick {
    transition: opacity 0.3s ease-out, transform 0.3s ease-out;
  }
  .check {
    transition: opacity 0.4s ease-out, transform 0.4s ease-out;
  }
  .compaction {
    transform: scaleY(0.55);
  }
  .traffic-dot { width: 12px; height: 12px; border-radius: 9999px; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-6xl rounded-2xl border border-slate-800 bg-slate-900/60 shadow-2xl overflow-hidden">

    <!-- Title bar -->
    <div class="flex items-center gap-3 px-5 py-3 border-b border-slate-800 bg-slate-900/80">
      <span class="traffic-dot bg-red-500/90"></span>
      <span class="traffic-dot bg-yellow-400/90"></span>
      <span class="traffic-dot bg-green-500/90"></span>
      <span class="ml-3 text-slate-400 text-sm tracking-tight">goal-vs-ralph · level 1</span>
    </div>

    <!-- Body -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-14 px-8 md:px-14 py-14">

      <!-- LEFT: GOAL -->
      <section class="flex flex-col">
        <div class="mb-8">
          <div class="text-purple-400 text-2xl md:text-3xl font-semibold tracking-tight">GOAL</div>
          <div class="text-slate-500 text-sm md:text-base mt-1">one long thread</div>
        </div>

        <div class="flex-1 flex flex-col justify-center">
          <div class="relative h-14 w-full rounded-xl bg-slate-800/70 overflow-hidden ring-1 ring-slate-700/60">
            <div id="goalBar" class="bar-fill h-full bg-purple-500 rounded-xl flex items-center" style="width:0%">
              <div id="goalTicks" class="relative w-full h-full"></div>
            </div>
          </div>
          <div class="mt-4 flex items-center justify-between text-xs text-slate-500">
            <span id="goalPct">0%</span>
            <span id="goalCheck" class="check opacity-0 text-emerald-400 text-2xl translate-y-1">&#10003;</span>
          </div>
        </div>
      </section>

      <!-- RIGHT: RALPH -->
      <section class="flex flex-col">
        <div class="mb-8">
          <div class="text-cyan-400 text-2xl md:text-3xl font-semibold tracking-tight">RALPH</div>
          <div class="text-slate-500 text-sm md:text-base mt-1">many fresh threads</div>
        </div>

        <div class="flex-1 flex flex-col justify-center gap-3" id="ralphStack"></div>

        <div class="mt-4 flex items-center justify-between text-xs text-slate-500">
          <span id="ralphIter">iter 0 / 6</span>
          <span id="ralphCheck" class="check opacity-0 text-emerald-400 text-2xl translate-y-1">&#10003;</span>
        </div>
      </section>
    </div>

    <!-- Caption + replay -->
    <div class="px-8 md:px-14 pb-8 flex flex-col items-center gap-4">
      <p class="text-slate-500 text-sm md:text-base text-center">Same problem. Different control loop.</p>
      <button id="replay" class="text-slate-400 hover:text-slate-100 text-sm border border-slate-700 hover:border-slate-500 rounded-lg px-3 py-1.5 transition-colors">
        &#9654; replay
      </button>
    </div>
  </div>

<script>
(function () {
  // Build Ralph stack
  const RALPH_COUNT = 6;
  const stack = document.getElementById('ralphStack');
  const ralphBars = [];
  for (let i = 0; i < RALPH_COUNT; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'relative h-6 w-full rounded-md bg-slate-800/70 overflow-hidden ring-1 ring-slate-700/60';
    const fill = document.createElement('div');
    fill.className = 'bar-fill h-full bg-cyan-500 rounded-md';
    fill.style.width = '0%';
    wrap.appendChild(fill);
    stack.appendChild(wrap);
    ralphBars.push(fill);
  }

  // Goal ticks (tool calls)
  const TICK_COUNT = 8;
  const goalTicks = document.getElementById('goalTicks');
  const tickEls = [];
  for (let i = 0; i < TICK_COUNT; i++) {
    const t = document.createElement('span');
    t.className = 'tick absolute top-1/2 -translate-y-1/2 w-1.5 h-6 rounded-sm bg-purple-200/80 opacity-0';
    // Distribute ticks across full bar width
    const leftPct = ((i + 1) / (TICK_COUNT + 1)) * 100;
    t.style.left = leftPct + '%';
    goalTicks.appendChild(t);
    tickEls.push({ el: t, threshold: leftPct });
  }

  const goalBar = document.getElementById('goalBar');
  const goalPct = document.getElementById('goalPct');
  const goalCheck = document.getElementById('goalCheck');
  const ralphIter = document.getElementById('ralphIter');
  const ralphCheck = document.getElementById('ralphCheck');
  const replayBtn = document.getElementById('replay');

  // Timing
  const TICK_MS = 100;          // step interval
  const TOTAL_MS = 12000;       // total run time
  const TOTAL_STEPS = TOTAL_MS / TICK_MS; // 120 steps
  const RALPH_STEPS_PER_BAR = TOTAL_STEPS / RALPH_COUNT; // 20

  let step = 0;
  let timer = null;
  let compacted = false;

  function reset() {
    step = 0;
    compacted = false;
    goalBar.style.width = '0%';
    goalBar.classList.remove('compaction');
    goalPct.textContent = '0%';
    goalCheck.classList.add('opacity-0');
    goalCheck.classList.add('translate-y-1');
    tickEls.forEach(t => {
      t.el.classList.remove('opacity-100');
      t.el.classList.add('opacity-0');
    });
    ralphBars.forEach(b => { b.style.width = '0%'; });
    ralphIter.textContent = 'iter 0 / 6';
    ralphCheck.classList.add('opacity-0');
    ralphCheck.classList.add('translate-y-1');
  }

  function render() {
    const t = step / TOTAL_STEPS; // 0..1
    // GOAL bar fills linearly with brief compaction blip at ~70%
    let pct = Math.min(100, t * 100);
    goalBar.style.width = pct + '%';
    goalPct.textContent = Math.round(pct) + '%';

    // Reveal ticks as bar passes them
    tickEls.forEach(tk => {
      if (pct >= tk.threshold) {
        tk.el.classList.remove('opacity-0');
        tk.el.classList.add('opacity-100');
      }
    });

    // Compaction blip at ~70%
    if (!compacted && pct >= 70) {
      compacted = true;
      goalBar.classList.add('compaction');
      setTimeout(() => goalBar.classList.remove('compaction'), 450);
    }

    // RALPH: which bar are we on?
    const ralphIdx = Math.min(RALPH_COUNT - 1, Math.floor(step / RALPH_STEPS_PER_BAR));
    const within = (step - ralphIdx * RALPH_STEPS_PER_BAR) / RALPH_STEPS_PER_BAR;
    for (let i = 0; i < RALPH_COUNT; i++) {
      if (i < ralphIdx) {
        ralphBars[i].style.width = '100%';
      } else if (i === ralphIdx) {
        ralphBars[i].style.width = Math.min(100, within * 100) + '%';
      } else {
        ralphBars[i].style.width = '0%';
      }
    }
    ralphIter.textContent = 'iter ' + Math.min(RALPH_COUNT, ralphIdx + (within > 0 ? 1 : 0)) + ' / ' + RALPH_COUNT;

    // End
    if (step >= TOTAL_STEPS) {
      goalBar.style.width = '100%';
      goalPct.textContent = '100%';
      ralphBars.forEach(b => b.style.width = '100%');
      ralphIter.textContent = 'iter 6 / 6';
      goalCheck.classList.remove('opacity-0', 'translate-y-1');
      ralphCheck.classList.remove('opacity-0', 'translate-y-1');
      clearInterval(timer);
      timer = null;
    }
  }

  function start() {
    if (timer) return;
    reset();
    timer = setInterval(() => {
      step++;
      render();
    }, TICK_MS);
  }

  replayBtn.addEventListener('click', () => {
    if (timer) { clearInterval(timer); timer = null; }
    start();
  });

  // Autoplay on viewport entry
  let played = false;
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting && !played) {
        played = true;
        start();
      }
    });
  }, { threshold: 0.4 });
  io.observe(document.querySelector('main, body > div') || document.body);
})();
</script>
</body>
</html>
