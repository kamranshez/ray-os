<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>/goal vs ralph — stop-motion comic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  :root {
    --bg: #faf7f0;
    --ink: #1f2937;
    --ink-soft: #475569;
    --ink-faint: #94a3b8;
    --paper-y: #fef3c7;
    --paper-b: #dbeafe;
    --paper-g: #dcfce7;
    --paper-p: #fce7f3;
    --paper-a: #fed7aa;
    --paper-r: #fee2e2;
    --emerald: #059669;
    --amber: #d97706;
    --rose: #e11d48;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Kalam', 'Caveat', system-ui, sans-serif;
    min-height: 100vh;
  }
  .page {
    max-width: 1300px;
    margin: 0 auto;
    padding: 32px 28px 80px;
  }
  /* header */
  .header {
    margin-bottom: 18px;
  }
  .header .eyebrow {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
  }
  .header h1 {
    font-family: 'Caveat', cursive;
    font-size: 44px;
    font-weight: 700;
    margin: 2px 0 4px;
    color: var(--ink);
    line-height: 1;
  }
  .header .sub {
    font-family: 'Kalam', sans-serif;
    font-size: 15px;
    color: var(--ink-soft);
  }

  /* tabs */
  .tabs {
    display: flex;
    gap: 14px;
    margin: 22px 0 8px;
    align-items: flex-end;
  }
  .tab {
    font-family: 'Caveat', cursive;
    font-size: 28px;
    padding: 10px 22px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--ink-soft);
    position: relative;
    transition: color 200ms ease, transform 200ms ease;
  }
  .tab:hover { color: var(--ink); }
  .tab svg.tab-frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .tab.active { color: var(--ink); transform: translateY(-2px); }
  .tab-label { position: relative; z-index: 1; }

  /* canvas area */
  .stage-wrap {
    position: relative;
    background: var(--bg);
    margin-top: 6px;
  }
  .stage {
    width: 100%;
    height: 700px;
    position: relative;
    overflow: hidden;
  }
  .frame-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 280ms ease;
  }
  .frame-svg.visible { opacity: 1; }

  /* text overlays positioned via foreignObject style HTML */
  .frame-svg text, .frame-svg foreignObject {
    user-select: none;
  }

  /* stepper */
  .stepper {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    font-family: 'Kalam', sans-serif;
  }
  .step-btn {
    font-family: 'Caveat', cursive;
    font-size: 26px;
    background: var(--bg);
    border: none;
    cursor: pointer;
    color: var(--ink);
    padding: 8px 22px;
    position: relative;
    transition: transform 150ms ease;
  }
  .step-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .step-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .step-btn svg.btn-frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .step-btn .btn-label { position: relative; z-index: 1; }
  .step-btn.pulse { animation: pulse 900ms ease 3; }
  @keyframes pulse {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .counter {
    font-family: 'Caveat', cursive;
    font-size: 28px;
    color: var(--ink);
    min-width: 70px;
    text-align: center;
  }

  /* caption */
  .caption {
    margin-top: 18px;
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: var(--ink);
    min-height: 64px;
    padding: 0 40px;
    line-height: 1.25;
    transition: opacity 220ms ease;
  }
  .caption.fading { opacity: 0; }

  /* hint */
  .hint {
    margin-top: 16px;
    text-align: center;
    font-family: 'Kalam', sans-serif;
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
  }

  /* small fade-in helper */
  @keyframes drop { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform: none; } }
  .frame-svg.visible > * { animation: drop 280ms ease both; }
</style>
</head>
<body>

<div class="page">

  <div class="header">
    <div class="eyebrow">a stop-motion explainer</div>
    <h1>/goal vs ralph</h1>
    <div class="sub">click <b>next →</b> (or press →) to advance through the beats. press <b>T</b> to switch tabs.</div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="goal">
      <svg class="tab-frame" preserveAspectRatio="none"></svg>
      <span class="tab-label">/ goal</span>
    </button>
    <button class="tab" data-tab="ralph">
      <svg class="tab-frame" preserveAspectRatio="none"></svg>
      <span class="tab-label">ralph</span>
    </button>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <svg class="frame-svg visible" id="svg-frame" viewBox="0 0 1300 700" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>

  <div class="stepper">
    <button class="step-btn" id="prev-btn">
      <svg class="btn-frame" preserveAspectRatio="none"></svg>
      <span class="btn-label">← prev</span>
    </button>
    <div class="counter" id="counter">1 / 7</div>
    <button class="step-btn" id="next-btn">
      <svg class="btn-frame" preserveAspectRatio="none"></svg>
      <span class="btn-label">next →</span>
    </button>
  </div>

  <div class="caption" id="caption">you say <i>/goal ship checkout v2</i> and walk away.</div>

  <div class="hint">← → arrow keys · T to toggle tab</div>

</div>

<script>
(() => {
  // ============== rough helpers ==============
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const XHTML_NS = 'http://www.w3.org/1999/xhtml';

  const ROUGH_OPTS = { roughness: 2, bowing: 1.5, strokeWidth: 1.6, stroke: '#1f2937' };

  function rcSvg(svg) {
    return rough.svg(svg, { options: { roughness: 2, bowing: 1.5, strokeWidth: 1.6 } });
  }

  function append(svg, node) { svg.appendChild(node); return node; }

  function txt(svg, x, y, str, opts = {}) {
    const t = document.createElementNS(SVG_NS, 'text');
    t.setAttribute('x', x);
    t.setAttribute('y', y);
    t.setAttribute('fill', opts.fill || '#1f2937');
    t.setAttribute('font-family', opts.font || "'Caveat', cursive");
    t.setAttribute('font-size', opts.size || 22);
    if (opts.weight) t.setAttribute('font-weight', opts.weight);
    if (opts.anchor) t.setAttribute('text-anchor', opts.anchor);
    t.textContent = str;
    svg.appendChild(t);
    return t;
  }

  function box(rc, svg, x, y, w, h, fill, opts = {}) {
    const o = Object.assign({
      fill: fill || 'transparent',
      fillStyle: fill ? 'solid' : 'hachure',
      roughness: 2,
      bowing: 1.5,
      strokeWidth: 1.6,
      stroke: opts.stroke || '#1f2937',
    }, opts);
    const node = rc.rectangle(x, y, w, h, o);
    svg.appendChild(node);
    return node;
  }

  function line(rc, svg, x1, y1, x2, y2, opts = {}) {
    const o = Object.assign({ roughness: 1.8, strokeWidth: 1.4, stroke: '#1f2937' }, opts);
    svg.appendChild(rc.line(x1, y1, x2, y2, o));
  }

  function arrow(rc, svg, x1, y1, x2, y2, opts = {}) {
    line(rc, svg, x1, y1, x2, y2, opts);
    // arrowhead
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const len = 12;
    const a1x = x2 - len * Math.cos(ang - Math.PI / 7);
    const a1y = y2 - len * Math.sin(ang - Math.PI / 7);
    const a2x = x2 - len * Math.cos(ang + Math.PI / 7);
    const a2y = y2 - len * Math.sin(ang + Math.PI / 7);
    line(rc, svg, x2, y2, a1x, a1y, opts);
    line(rc, svg, x2, y2, a2x, a2y, opts);
  }

  function circle(rc, svg, cx, cy, d, fill, opts = {}) {
    const o = Object.assign({
      fill: fill || 'transparent',
      fillStyle: fill ? 'solid' : 'hachure',
      roughness: 2,
      strokeWidth: 1.6,
      stroke: '#1f2937',
    }, opts);
    svg.appendChild(rc.circle(cx, cy, d, o));
  }

  // hand-drawn check mark
  function check(rc, svg, x, y, size = 16, color = '#059669') {
    line(rc, svg, x, y + size * 0.5, x + size * 0.4, y + size, { stroke: color, strokeWidth: 2.4, roughness: 1.6 });
    line(rc, svg, x + size * 0.4, y + size, x + size, y, { stroke: color, strokeWidth: 2.4, roughness: 1.6 });
  }

  function xmark(rc, svg, x, y, size = 14, color = '#94a3b8') {
    line(rc, svg, x, y, x + size, y + size, { stroke: color, strokeWidth: 1.8, roughness: 2 });
    line(rc, svg, x + size, y, x, y + size, { stroke: color, strokeWidth: 1.8, roughness: 2 });
  }

  // sticky note
  function sticky(rc, svg, x, y, w, h, lines, fill = '#fef3c7') {
    box(rc, svg, x, y, w, h, fill, { roughness: 2.2, bowing: 1.8 });
    // little tape on top
    box(rc, svg, x + w/2 - 18, y - 8, 36, 12, '#cbd5e1', { roughness: 1.5, fillStyle: 'solid' });
    lines.forEach((ln, i) => {
      txt(svg, x + 12, y + 26 + i * 22, ln, { size: 18, font: "'Kalam', sans-serif" });
    });
  }

  // thermometer (token meter)
  function thermometer(rc, svg, x, y, h, fillPct, label, hot = false) {
    const w = 28;
    box(rc, svg, x, y, w, h, '#ffffff', { roughness: 1.8 });
    // bulb
    circle(rc, svg, x + w/2, y + h + 22, 38, '#ffffff', { roughness: 1.8 });
    // fill
    const fillH = (h - 8) * fillPct;
    const fillColor = hot ? '#f87171' : '#60a5fa';
    box(rc, svg, x + 4, y + h - fillH - 4, w - 8, fillH, fillColor,
        { roughness: 1.4, fillStyle: 'solid', stroke: 'transparent' });
    circle(rc, svg, x + w/2, y + h + 22, 28, fillColor, { roughness: 1.4, stroke: 'transparent' });
    // label
    txt(svg, x + w/2, y - 10, label, { size: 18, anchor: 'middle' });
    txt(svg, x + w/2, y + h + 56, Math.round(fillPct * 100) + '%',
        { size: 18, anchor: 'middle', fill: hot ? '#dc2626' : '#1f2937' });
  }

  // wavy/curly arrow (multi-segment)
  function curly(rc, svg, points, opts = {}) {
    for (let i = 0; i < points.length - 1; i++) {
      const isLast = i === points.length - 2;
      if (isLast) arrow(rc, svg, points[i][0], points[i][1], points[i+1][0], points[i+1][1], opts);
      else line(rc, svg, points[i][0], points[i][1], points[i+1][0], points[i+1][1], opts);
    }
  }

  // ============== state ==============
  let currentTab = 'goal';
  let currentFrame = 1;
  const FRAMES = { goal: 7, ralph: 7 };

  const CAPTIONS = {
    goal: [
      'you say <i>/goal ship checkout v2</i> and walk away.',
      'codex starts a long single thread. tools and model turns alternate.',
      'the model just keeps going. between every turn, codex audits whether the goal is done.',
      'a hidden continuation prompt is injected at every turn boundary.',
      'context fills up — codex compacts the conversation in place. tokens drop, work continues.',
      'you can interject mid-loop — your message gets delivered next turn.',
      'model declares complete · loop ends · single thread, single objective.'
    ],
    ralph: [
      'a tiny bash loop. a PRD on disk. no clever runtime — just files and a fresh process each iteration.',
      'iteration 1 — spawn fresh claude, read prd.json, pick first story.',
      'story done. process exits. all state lives on disk: prd.json, progress.txt, .git.',
      'next iteration: a brand-new process with no memory. its only inheritance is what is on the filesystem.',
      'agents can write down patterns to AGENTS.md so future iterations inherit hard-won lessons.',
      'when work is done, the model prints a sentinel. ralph.sh greps for it.',
      'loop terminates. you have a feature, a clean prd, and a progress log of how it got built.'
    ]
  };

  // ============== decorate buttons / tabs with rough frames ==============
  function decorateFrame(svgEl, w, h, fill = 'transparent') {
    while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
    svgEl.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const rc = rough.svg(svgEl);
    const node = rc.rectangle(2, 2, w - 4, h - 4, {
      roughness: 2.2, bowing: 1.8, strokeWidth: 1.6, stroke: '#1f2937',
      fill: fill, fillStyle: fill === 'transparent' ? 'hachure' : 'solid'
    });
    svgEl.appendChild(node);
  }

  function redrawDecorations() {
    document.querySelectorAll('.tab').forEach(btn => {
      const r = btn.getBoundingClientRect();
      const svg = btn.querySelector('.tab-frame');
      const fill = btn.classList.contains('active') ? '#fef3c7' : 'transparent';
      decorateFrame(svg, r.width, r.height, fill);
    });
    document.querySelectorAll('.step-btn').forEach(btn => {
      const r = btn.getBoundingClientRect();
      const svg = btn.querySelector('.btn-frame');
      decorateFrame(svg, r.width, r.height, 'transparent');
    });
  }

  // ============== GOAL FRAMES ==============
  // Reusable: draw the goal banner box at the top of every goal frame
  function drawGoalBanner(rc, svg, complete = false) {
    const fill = complete ? '#dcfce7' : '#dbeafe';
    box(rc, svg, 420, 40, 460, 64, fill, { roughness: 2.2, bowing: 2 });
    txt(svg, 650, 68, '🎯 your goal', { size: 18, anchor: 'middle', fill: '#475569' });
    txt(svg, 650, 92, 'ship checkout v2', { size: 26, anchor: 'middle', weight: 700 });
    if (complete) {
      check(rc, svg, 870, 56, 22);
    }
  }

  // model/tool cell column on goal canvas — produces a list of "cells"
  function drawCells(rc, svg, cells, opts = {}) {
    // cells: [{label, kind: 'model'|'tool', state?: 'crossed'}]
    const startX = 480;
    const startY = 140;
    const w = 340;
    const h = 36;
    const gap = 8;
    cells.forEach((c, i) => {
      const y = startY + i * (h + gap);
      const fill = c.kind === 'tool' ? '#fef3c7' : '#dbeafe';
      box(rc, svg, startX, y, w, h, fill, { roughness: 1.8, bowing: 1.5 });
      txt(svg, startX + 14, y + 23, (c.kind === 'tool' ? '🔧 ' : '🤖 ') + c.label,
          { size: 18, font: "'Kalam', sans-serif" });
      if (c.crossed) {
        line(rc, svg, startX + 6, y + 18, startX + w - 6, y + 22, { stroke: '#94a3b8', strokeWidth: 1.4 });
      }
    });
    return startX + w;
  }

  function renderGoalFrame(n, svg) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const rc = rough.svg(svg);

    // F1 — empty whiteboard, just goal pinned
    if (n === 1) {
      drawGoalBanner(rc, svg);
      txt(svg, 650, 380, 'codex is about to take this and run', { size: 26, anchor: 'middle', fill: '#475569' });
      // pin
      circle(rc, svg, 650, 36, 12, '#e11d48', { roughness: 1.4 });
      // hand-drawn arrow from goal down into nothing
      arrow(rc, svg, 650, 110, 650, 320, { stroke: '#94a3b8' });
      // bottom hint
      txt(svg, 650, 620, 'you walk away.', { size: 28, anchor: 'middle', fill: '#475569' });
      return;
    }

    // For frames 2-7 we need the thermometer
    const thermPct = { 2: 0.18, 3: 0.5, 4: 0.8, 5: 0.3, 6: 0.45, 7: 0.6 }[n];
    const hot = (n === 4);
    drawGoalBanner(rc, svg, n === 7);
    thermometer(rc, svg, 220, 180, 320, thermPct, 'tokens', hot);

    // F2: a few cells
    if (n === 2) {
      drawCells(rc, svg, [
        { kind: 'model', label: 'plan: read repo, find checkout/' },
        { kind: 'tool',  label: 'read_files( apps/checkout/* )' },
        { kind: 'model', label: 'edit: scaffold v2 routes' },
      ]);
      return;
    }

    // F3: more cells, audit hint
    if (n === 3) {
      drawCells(rc, svg, [
        { kind: 'model', label: 'plan: read repo, find checkout/' },
        { kind: 'tool',  label: 'read_files( apps/checkout/* )' },
        { kind: 'model', label: 'edit: scaffold v2 routes' },
        { kind: 'tool',  label: 'run_tests( unit )' },
        { kind: 'model', label: 'fix failing assertion' },
        { kind: 'tool',  label: 'get_goal()  →  status: active' },
      ]);
      // small whisper to the side
      txt(svg, 870, 220, '· no human in the loop ·', { size: 20, fill: '#94a3b8' });
      txt(svg, 870, 250, 'the model picks the next', { size: 20, fill: '#94a3b8' });
      txt(svg, 870, 274, 'tool, every turn.', { size: 20, fill: '#94a3b8' });
      return;
    }

    // F4: even more cells, sticky hidden prompt
    if (n === 4) {
      drawCells(rc, svg, [
        { kind: 'model', label: 'plan: read repo, find checkout/' },
        { kind: 'tool',  label: 'read_files( apps/checkout/* )' },
        { kind: 'model', label: 'edit: scaffold v2 routes' },
        { kind: 'tool',  label: 'run_tests( unit )' },
        { kind: 'model', label: 'fix failing assertion' },
        { kind: 'tool',  label: 'get_goal()  →  status: active' },
        { kind: 'model', label: 'wire stripe webhook' },
        { kind: 'tool',  label: 'run_tests( integration )' },
      ]);
      sticky(rc, svg, 880, 200, 280, 130, [
        'hidden continuation:',
        '"audit completion vs',
        ' the original goal.',
        ' if uncertain, say no."'
      ], '#fef3c7');
      // arrow from sticky into the cell column
      curly(rc, svg, [[880, 240], [840, 240], [840, 320], [820, 320]], { stroke: '#475569' });
      return;
    }

    // F5: AUTO-COMPACT
    if (n === 5) {
      // a single yellow summary box at top of the column
      box(rc, svg, 480, 140, 340, 60, '#fef3c7', { roughness: 2.2, bowing: 2 });
      txt(svg, 494, 165, '📜  summary', { size: 20, font: "'Kalam', sans-serif", weight: 700 });
      txt(svg, 494, 188, 'turns 1 — 14 distilled, kept goal',
          { size: 16, font: "'Kalam', sans-serif", fill: '#475569' });

      // crumpled / crossed-out cells underneath
      const ghosts = [
        'plan: read repo…', 'read_files(…)', 'edit: scaffold…',
        'run_tests(unit)', 'fix assertion', 'get_goal()…',
        'wire stripe webhook',
      ];
      ghosts.forEach((g, i) => {
        const y = 220 + i * 36;
        box(rc, svg, 480, y, 340, 28, '#f1f5f9', { roughness: 2.4, bowing: 2 });
        txt(svg, 494, y + 19, g, { size: 16, font: "'Kalam', sans-serif", fill: '#94a3b8' });
        line(rc, svg, 484, y + 14, 816, y + 18, { stroke: '#94a3b8', strokeWidth: 1.2 });
      });
      // big AUTO-COMPACT arrow from old → new
      txt(svg, 880, 320, 'auto-compact', { size: 26, weight: 700, fill: '#d97706' });
      arrow(rc, svg, 880, 340, 830, 180, { stroke: '#d97706', strokeWidth: 1.8 });
      txt(svg, 880, 350, '↓ tokens, same goal', { size: 18, fill: '#475569' });
      return;
    }

    // F6: queued user message
    if (n === 6) {
      drawCells(rc, svg, [
        { kind: 'model', label: '📜  summary (compacted)' },
        { kind: 'tool',  label: 'read_files( apps/checkout/pay )' },
        { kind: 'model', label: 'add stripe webhook handler' },
        { kind: 'tool',  label: 'run_tests( integration )' },
        { kind: 'model', label: 'next: payment methods…' },
      ]);
      sticky(rc, svg, 880, 200, 290, 110, [
        'you (mid-loop):',
        '"also handle apple pay"'
      ], '#fce7f3');
      txt(svg, 880, 326, 'queued · next turn', { size: 18, fill: '#be185d' });
      // curly arrow into the column at the next-turn boundary
      curly(rc, svg, [[880, 360], [840, 380], [840, 320], [820, 314]], { stroke: '#be185d' });
      return;
    }

    // F7: complete
    if (n === 7) {
      drawCells(rc, svg, [
        { kind: 'model', label: '📜  summary (compacted)' },
        { kind: 'tool',  label: 'read_files( apps/checkout/pay )' },
        { kind: 'model', label: 'add apple pay path' },
        { kind: 'tool',  label: 'run_tests( e2e )' },
        { kind: 'model', label: 'audit: 5/5 user concerns met' },
      ]);
      // last cell — special, green
      box(rc, svg, 480, 140 + 5 * 44, 340, 50, '#dcfce7', { roughness: 1.8 });
      txt(svg, 494, 140 + 5 * 44 + 22, '🔧 update_goal({ status: complete })',
          { size: 18, font: "'Kalam', sans-serif", weight: 700 });
      check(rc, svg, 790, 140 + 5 * 44 + 14, 22);
      txt(svg, 870, 540, 'one thread.', { size: 28, fill: '#475569' });
      txt(svg, 870, 572, 'one objective.', { size: 28, fill: '#475569' });
      txt(svg, 870, 604, 'done.', { size: 32, fill: '#059669', weight: 700 });
      return;
    }
  }

  // ============== RALPH FRAMES ==============
  function drawPRD(rc, svg, x, y, statuses) {
    // statuses: array of booleans length 5
    const stories = [
      'auth · signup + login',
      'cart · add/remove',
      'checkout · stripe webhook',
      'orders · receipt email',
      'admin · refund flow',
    ];
    box(rc, svg, x, y, 360, 220, '#ffffff', { roughness: 2.2, bowing: 2 });
    // dog-eared corner
    line(rc, svg, x + 340, y, x + 360, y + 20, { strokeWidth: 1.2 });
    line(rc, svg, x + 340, y, x + 340, y + 20, { strokeWidth: 1.2 });
    line(rc, svg, x + 340, y + 20, x + 360, y + 20, { strokeWidth: 1.2 });

    txt(svg, x + 14, y + 28, 'PRD.json', { size: 22, weight: 700 });
    txt(svg, x + 14, y + 50, '5 user stories', { size: 16, fill: '#475569' });
    stories.forEach((s, i) => {
      const cy = y + 78 + i * 28;
      // checkbox
      box(rc, svg, x + 16, cy - 14, 18, 18, statuses[i] ? '#dcfce7' : 'transparent', { roughness: 2 });
      if (statuses[i]) check(rc, svg, x + 18, cy - 14, 14);
      txt(svg, x + 44, cy, s, { size: 18, font: "'Kalam', sans-serif" });
    });
  }

  function drawTerminal(rc, svg, x, y, label, lines = []) {
    box(rc, svg, x, y, 280, 90 + lines.length * 22, '#ffffff', { roughness: 2 });
    txt(svg, x + 12, y + 24, '$ ' + label, { size: 18, font: "'JetBrains Mono', monospace", weight: 600 });
    line(rc, svg, x + 12, y + 32, x + 268, y + 32, { strokeWidth: 1 });
    lines.forEach((ln, i) => {
      txt(svg, x + 12, y + 58 + i * 22, ln, { size: 14, font: "'JetBrains Mono', monospace", fill: ln.startsWith('!') ? '#d97706' : '#1f2937' });
    });
  }

  function drawProcess(rc, svg, x, y, label, color = '#dbeafe', faded = false) {
    box(rc, svg, x, y, 230, 110, color, { roughness: 2.2, bowing: 1.8 });
    txt(svg, x + 14, y + 28, '⚙  ' + label, { size: 18, weight: 700, fill: faded ? '#94a3b8' : '#1f2937' });
    txt(svg, x + 14, y + 54, 'fresh claude', { size: 16, fill: '#475569' });
    txt(svg, x + 14, y + 76, 'no prior memory', { size: 14, fill: '#475569' });
    txt(svg, x + 14, y + 98, 'reads disk → does work', { size: 14, fill: '#475569' });
    if (faded) {
      line(rc, svg, x, y, x + 230, y + 110, { stroke: '#94a3b8', strokeWidth: 1 });
    }
  }

  function drawDisk(rc, svg, x, y, items) {
    // items: [{label, color}]
    box(rc, svg, x, y, 460, 110, '#f8fafc', { roughness: 2 });
    txt(svg, x + 14, y + 26, '💾  filesystem', { size: 18, weight: 700, fill: '#475569' });
    items.forEach((it, i) => {
      const ix = x + 18 + (i % 4) * 110;
      const iy = y + 50 + Math.floor(i / 4) * 32;
      box(rc, svg, ix, iy, 100, 26, it.color || '#fef3c7', { roughness: 1.8 });
      txt(svg, ix + 8, iy + 18, it.label, { size: 14, font: "'JetBrains Mono', monospace" });
    });
  }

  function renderRalphFrame(n, svg) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const rc = rough.svg(svg);

    // status of stories per frame
    const STATUS = {
      1: [false, false, false, false, false],
      2: [false, false, false, false, false],
      3: [true,  false, false, false, false],
      4: [true,  true,  false, false, false],
      5: [true,  true,  true,  false, false],
      6: [true,  true,  true,  true,  false],
      7: [true,  true,  true,  true,  true ],
    }[n];

    // F1 — empty whiteboard with bash terminal + PRD pinned
    if (n === 1) {
      drawTerminal(rc, svg, 60, 60, 'ralph.sh', [
        'while true; do',
        '  claude -p "$(cat agent.md)"',
        '  grep -q "<promise>COMPLETE" || ',
        'done'
      ]);
      drawPRD(rc, svg, 800, 80, STATUS);
      txt(svg, 480, 360, 'no clever runtime.', { size: 28, anchor: 'middle', fill: '#475569' });
      txt(svg, 480, 396, 'just files + a fresh process each loop.', { size: 22, anchor: 'middle', fill: '#475569' });
      // arrow from terminal to PRD
      curly(rc, svg, [[340, 110], [620, 110], [620, 200], [800, 200]], { stroke: '#94a3b8' });
      return;
    }

    // For 2-7 layout: PRD top-right, iter counter top-left, process box in middle, disk at bottom
    drawPRD(rc, svg, 880, 40, STATUS);
    txt(svg, 80, 60, 'iter ' + (n - 1) + ' / 5', { size: 28, weight: 700, fill: '#0891b2' });

    // disk at the bottom always
    const diskItems = (() => {
      if (n === 2) return [
        { label: 'prd.json' }, { label: 'AGENTS.md' }, { label: 'progress.txt' }, { label: '.git' },
      ];
      if (n === 3) return [
        { label: 'prd.json', color: '#dcfce7' }, { label: 'AGENTS.md' },
        { label: 'progress.txt', color: '#dbeafe' }, { label: '.git +a3f2e1', color: '#fed7aa' },
      ];
      if (n === 4) return [
        { label: 'prd.json', color: '#dcfce7' }, { label: 'AGENTS.md' },
        { label: 'progress.txt', color: '#dbeafe' }, { label: '.git +b71e09', color: '#fed7aa' },
      ];
      if (n === 5) return [
        { label: 'prd.json', color: '#dcfce7' }, { label: 'AGENTS.md', color: '#fce7f3' },
        { label: 'progress.txt', color: '#dbeafe' }, { label: '.git +c2d8aa', color: '#fed7aa' },
      ];
      if (n === 6) return [
        { label: 'prd.json', color: '#dcfce7' }, { label: 'AGENTS.md', color: '#fce7f3' },
        { label: 'progress.txt', color: '#dbeafe' }, { label: '.git +9f0e44', color: '#fed7aa' },
      ];
      return [
        { label: 'prd.json ✓', color: '#dcfce7' }, { label: 'AGENTS.md', color: '#fce7f3' },
        { label: 'progress.txt', color: '#dbeafe' }, { label: '.git +42e7b3', color: '#fed7aa' },
      ];
    })();
    drawDisk(rc, svg, 60, 540, diskItems);

    // F2 — first process box appears
    if (n === 2) {
      drawProcess(rc, svg, 480, 200, 'iteration 1');
      // arrow PRD → process
      curly(rc, svg, [[880, 140], [800, 200], [710, 230]], { stroke: '#475569' });
      txt(svg, 920, 195, 'read story 1', { size: 16, fill: '#475569' });
      // arrow process → disk
      arrow(rc, svg, 595, 310, 290, 540, { stroke: '#475569' });
      txt(svg, 380, 460, 'will write here', { size: 16, fill: '#94a3b8' });
      return;
    }

    // F3 — process did its work, disk updated, process fades
    if (n === 3) {
      drawProcess(rc, svg, 480, 200, 'iteration 1', '#e2e8f0', true);
      txt(svg, 480, 350, 'process exited.', { size: 22, fill: '#475569' });
      txt(svg, 480, 378, 'state lives on disk now.', { size: 20, fill: '#475569' });
      // arrows pointing to each updated disk file
      arrow(rc, svg, 600, 320, 110, 540, { stroke: '#059669' });
      arrow(rc, svg, 605, 320, 290, 540, { stroke: '#0891b2' });
      arrow(rc, svg, 610, 320, 470, 540, { stroke: '#d97706' });
      txt(svg, 880, 320, '✓ S01 passes', { size: 18, fill: '#059669' });
      return;
    }

    // F4 — new process, brand new, reads disk
    if (n === 4) {
      drawProcess(rc, svg, 480, 200, 'iteration 2', '#dcfce7');
      // curly arrows up from disk into the new process
      curly(rc, svg, [[110, 540], [110, 410], [480, 320]], { stroke: '#059669' });
      curly(rc, svg, [[290, 540], [350, 420], [560, 310]], { stroke: '#0891b2' });
      txt(svg, 240, 410, 'reads prd.json', { size: 16, fill: '#475569' });
      txt(svg, 380, 480, '+ progress.txt', { size: 16, fill: '#475569' });
      txt(svg, 720, 250, 'the only inheritance', { size: 18, fill: '#94a3b8' });
      txt(svg, 720, 274, 'is what is on disk.', { size: 18, fill: '#94a3b8' });
      return;
    }

    // F5 — agents.md gets a learning appended
    if (n === 5) {
      drawProcess(rc, svg, 460, 200, 'iteration 3', '#fce7f3');
      // sticky pattern note flying down to AGENTS.md
      sticky(rc, svg, 740, 220, 280, 110, [
        'learning:',
        'tests need PORT=3000',
        'before vitest runs.'
      ], '#fce7f3');
      arrow(rc, svg, 800, 330, 290, 540, { stroke: '#be185d' });
      txt(svg, 480, 460, 'append to AGENTS.md', { size: 18, fill: '#be185d' });
      txt(svg, 460, 484, '↳ next iteration will read it', { size: 16, fill: '#94a3b8' });
      return;
    }

    // F6 — sentinel matches
    if (n === 6) {
      drawProcess(rc, svg, 460, 200, 'iteration 5', '#dcfce7');
      box(rc, svg, 720, 220, 320, 90, '#fef3c7', { roughness: 2 });
      txt(svg, 736, 252, 'stdout:', { size: 16, fill: '#475569', font: "'JetBrains Mono', monospace" });
      txt(svg, 736, 280, '<promise>COMPLETE</promise>',
          { size: 20, font: "'JetBrains Mono', monospace", weight: 700, fill: '#d97706' });
      // magnifying glass icon
      circle(rc, svg, 1080, 250, 38, '#dcfce7', { roughness: 2 });
      line(rc, svg, 1095, 265, 1118, 290, { strokeWidth: 3, stroke: '#059669' });
      txt(svg, 1080, 318, 'sentinel', { size: 16, anchor: 'middle', fill: '#059669' });
      arrow(rc, svg, 1040, 250, 880, 250, { stroke: '#059669' });
      txt(svg, 720, 360, 'ralph.sh greps for the sentinel · match!', { size: 20, fill: '#475569' });
      return;
    }

    // F7 — done
    if (n === 7) {
      // big exit
      box(rc, svg, 380, 180, 400, 160, '#dcfce7', { roughness: 2.2, bowing: 2 });
      txt(svg, 580, 230, 'exit 0', { size: 56, anchor: 'middle', weight: 700, fill: '#059669' });
      txt(svg, 580, 280, 'all 5 stories ✓', { size: 26, anchor: 'middle', fill: '#475569' });
      txt(svg, 580, 320, 'feature shipped · prd clean · history readable', { size: 18, anchor: 'middle', fill: '#475569' });
      check(rc, svg, 420, 200, 26);
      check(rc, svg, 720, 200, 26);
      // small notes
      txt(svg, 80, 220, 'no live agent.', { size: 22, fill: '#475569' });
      txt(svg, 80, 250, 'no compaction.', { size: 22, fill: '#475569' });
      txt(svg, 80, 280, 'no resume token.', { size: 22, fill: '#475569' });
      txt(svg, 80, 320, 'just files,', { size: 22, fill: '#475569' });
      txt(svg, 80, 348, 'and a loop', { size: 22, fill: '#475569' });
      txt(svg, 80, 376, 'that knew when', { size: 22, fill: '#475569' });
      txt(svg, 80, 404, 'to stop.', { size: 22, weight: 700 });
      return;
    }
  }

  // ============== driver ==============
  const stage = document.getElementById('stage');
  const captionEl = document.getElementById('caption');
  const counterEl = document.getElementById('counter');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  function render() {
    const svg = document.getElementById('svg-frame');
    // fade out, swap, fade in
    svg.classList.remove('visible');
    captionEl.classList.add('fading');

    setTimeout(() => {
      if (currentTab === 'goal') renderGoalFrame(currentFrame, svg);
      else renderRalphFrame(currentFrame, svg);
      captionEl.innerHTML = CAPTIONS[currentTab][currentFrame - 1];
      counterEl.textContent = `${currentFrame} / ${FRAMES[currentTab]}`;
      prevBtn.disabled = currentFrame === 1;
      nextBtn.disabled = currentFrame === FRAMES[currentTab];
      svg.classList.add('visible');
      captionEl.classList.remove('fading');
      redrawDecorations();
    }, 180);
  }

  function go(delta) {
    const next = currentFrame + delta;
    if (next < 1 || next > FRAMES[currentTab]) return;
    currentFrame = next;
    render();
  }

  function setTab(tab) {
    if (tab === currentTab) return;
    currentTab = tab;
    currentFrame = 1;
    document.querySelectorAll('.tab').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    render();
  }

  // tab clicks
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => setTab(btn.dataset.tab));
  });

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));

  // keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    else if (e.key === 't' || e.key === 'T') {
      e.preventDefault();
      setTab(currentTab === 'goal' ? 'ralph' : 'goal');
    }
  });

  // initial render once fonts load
  function init() {
    redrawDecorations();
    render();
    // pulse next button on first scroll-into-view
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          nextBtn.classList.add('pulse');
          setTimeout(() => nextBtn.classList.remove('pulse'), 3000);
          io.disconnect();
        }
      });
    }, { threshold: 0.4 });
    io.observe(stage);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(init);
  } else {
    window.addEventListener('load', init);
  }

  window.addEventListener('resize', redrawDecorations);
})();
</script>
</body>
</html>
