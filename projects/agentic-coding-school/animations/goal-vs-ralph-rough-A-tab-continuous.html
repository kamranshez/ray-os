<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>goal vs ralph · live sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  :root {
    --paper: #faf7f0;
    --paper-2: #fdfbf6;
    --ink: #1f2937;
    --ink-soft: #475569;
    --ink-faint: #94a3b8;
    --amber: #fef3c7;
    --blue: #dbeafe;
    --green: #dcfce7;
    --pink: #fce7f3;
    --rose: #fecaca;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--paper); margin: 0; padding: 0; color: var(--ink); }
  body {
    font-family: 'Caveat', 'Kalam', cursive;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0, transparent 50%);
    min-height: 100vh;
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 28px 32px 60px; }

  /* Header */
  .header { margin-bottom: 18px; }
  .eyebrow {
    font-family: 'Kalam', cursive;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  h1.title {
    font-family: 'Caveat', cursive;
    font-size: 44px;
    font-weight: 700;
    margin: 4px 0 2px;
    color: var(--ink);
  }
  .subtitle {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--ink-soft);
    margin: 0;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 32px;
    margin: 28px 0 8px;
    align-items: flex-end;
    position: relative;
  }
  .tab {
    font-family: 'Caveat', cursive;
    font-size: 38px;
    font-weight: 600;
    color: var(--ink-faint);
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px 18px 10px;
    position: relative;
    transition: color 200ms ease;
  }
  .tab:hover { color: var(--ink-soft); }
  .tab.active { color: var(--ink); }
  .tab .underline {
    position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 16px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 250ms ease;
  }
  .tab.active .underline { opacity: 1; }

  /* Stage */
  .stage {
    margin-top: 18px;
    border-radius: 14px;
    background: var(--paper-2);
    position: relative;
    height: 900px;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(0,0,0,0.04),
      0 12px 30px -18px rgba(0,0,0,0.15);
  }
  .stage-frame {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .panel {
    position: absolute;
    inset: 0;
    display: none;
  }
  .panel.active { display: block; }
  svg.scene {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  /* HTML overlays inside panels */
  .overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .label {
    position: absolute;
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--ink);
    transition: opacity 380ms ease, transform 380ms ease;
  }
  .label.small { font-size: 18px; color: var(--ink-soft); }
  .label.tiny { font-size: 16px; color: var(--ink-faint); font-family: 'Kalam', cursive; }
  .label.code {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size: 13px;
    color: var(--ink);
  }
  .label.fade-in { animation: fadeIn 480ms ease both; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .crumple { animation: crumple 700ms ease forwards; }
  @keyframes crumple {
    0% { opacity: 1; transform: scale(1) rotate(0); }
    40% { opacity: 0.8; transform: scale(0.96) rotate(-2deg); }
    70% { opacity: 0.4; transform: scale(0.85) rotate(3deg); }
    100% { opacity: 0; transform: scale(0.6) rotate(-5deg); }
  }
  .shake { animation: shake 600ms ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
  .glow-green {
    filter: drop-shadow(0 0 12px rgba(34,197,94,0.6));
    transition: filter 400ms ease;
  }

  /* Footer */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    padding: 0 6px;
  }
  .caption {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--ink-soft);
  }
  .replay {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--ink);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 10px;
    position: relative;
  }
  .replay::after {
    content: '';
    position: absolute;
    left: 8px; right: 8px; bottom: -2px;
    height: 4px;
    background: repeating-linear-gradient(
      90deg,
      var(--ink) 0 6px, transparent 6px 9px
    );
    opacity: 0.6;
  }
  .replay:hover { color: #000; }

  /* Animated dashed-stroke arrows */
  .draw-in {
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    animation: drawIn 900ms ease forwards;
  }
  @keyframes drawIn {
    to { stroke-dashoffset: 0; }
  }

  /* Sticky note flair */
  .stickynote {
    position: absolute;
    width: 170px;
    padding: 12px 14px;
    font-family: 'Caveat', cursive;
    font-size: 20px;
    color: #78350f;
    background: #fde68a;
    box-shadow:
      2px 3px 0 rgba(0,0,0,0.06),
      0 8px 14px -6px rgba(0,0,0,0.18);
    transform: rotate(-3deg);
    border-radius: 2px;
  }
  .stickynote::before {
    content: '';
    position: absolute;
    top: -8px; left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 50px; height: 14px;
    background: rgba(180,140,40,0.35);
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <div class="eyebrow">live sketch · two ways to keep an agent on task</div>
    <h1 class="title">goal vs ralph</h1>
    <p class="subtitle">one moves intent into the prompt &nbsp;·&nbsp; the other moves intent into the filesystem</p>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="goal">
      [ /goal ]
      <svg class="underline" viewBox="0 0 200 16" preserveAspectRatio="none"><g id="ul-goal"></g></svg>
    </button>
    <button class="tab" data-tab="ralph">
      [ ralph ]
      <svg class="underline" viewBox="0 0 200 16" preserveAspectRatio="none"><g id="ul-ralph"></g></svg>
    </button>
  </div>

  <div class="stage" id="stage">
    <!-- GOAL panel -->
    <div class="panel active" id="panel-goal">
      <svg class="scene" id="svg-goal" viewBox="0 0 1340 900" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="overlay" id="ov-goal"></div>
    </div>
    <!-- RALPH panel -->
    <div class="panel" id="panel-ralph">
      <svg class="scene" id="svg-ralph" viewBox="0 0 1340 900" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="overlay" id="ov-ralph"></div>
    </div>
  </div>

  <div class="footer">
    <div class="caption" id="caption">filling the prompt, watching the meter, compacting when it gets full</div>
    <button class="replay" id="replay">↻ replay</button>
  </div>

</div>

<script>
(() => {
  // ============= rough helpers =============
  const NS = 'http://www.w3.org/2000/svg';
  const rcSvg = (svg) => rough.svg(svg);

  const drawTabUnderline = (gid, color = '#1f2937') => {
    const svg = document.querySelector(`#${gid}`).ownerSVGElement;
    const rc = rcSvg(svg);
    const g = document.getElementById(gid);
    g.innerHTML = '';
    const node = rc.line(2, 8, 198, 6, { stroke: color, strokeWidth: 2.5, roughness: 2.2, bowing: 2 });
    g.appendChild(node);
    const node2 = rc.line(8, 12, 192, 11, { stroke: color, strokeWidth: 1.5, roughness: 3, bowing: 2 });
    g.appendChild(node2);
  };
  drawTabUnderline('ul-goal');
  drawTabUnderline('ul-ralph');

  // ============= general drawing utils =============
  const clearChildren = (el) => { while (el.firstChild) el.removeChild(el.firstChild); };

  const append = (parent, node) => { parent.appendChild(node); return node; };

  // wobble: re-render a callback every interval with new seeds
  const wobblers = { goal: [], ralph: [] };
  const startWobbleLoop = () => {
    setInterval(() => {
      ['goal','ralph'].forEach(side => {
        wobblers[side].forEach(w => { try { w(); } catch(e){} });
      });
    }, 650);
  };
  startWobbleLoop();

  // ============= GOAL scene =============
  const goalSvg = document.getElementById('svg-goal');
  const goalOv = document.getElementById('ov-goal');
  const goalRc = rcSvg(goalSvg);

  // Layout constants (viewBox 1340 x 900)
  const GOAL = {
    colX: 560,        // context column left edge
    colW: 360,        // column width
    colTop: 100,
    colBottom: 820,
    cellH: 56,
    cells: [
      { label: 'create_goal({ "ship checkout v2" })', fill: '#dbeafe', tokens: 8000 },
      { label: 'model: thinking…', fill: null, tokens: 3000 },
      { label: 'tool: read prd.json', fill: null, tokens: 12000 },
      { label: 'tool: edit auth.ts', tokens: 18000 },
      { label: 'model: writing tests', tokens: 22000 },
      { label: 'tool: run pnpm test', tokens: 30000 },
      { label: 'model: refining…', tokens: 28000 },
      { label: 'tool: edit cart.ts', tokens: 35000 },
      { label: 'model: checks goal', tokens: 25000 },
      // ↑ compaction crumples 2..9 around here
      { label: '📜 summary (compacted)', fill: '#fef3c7', tokens: 60000, isSummary: true },
      { label: 'queued: also handle apple pay', fill: '#fce7f3', tokens: 8000, fromSticky: true },
      { label: 'tool: edit checkout.ts', tokens: 30000 },
      { label: 'model: verifying…', tokens: 22000 },
      { label: 'update_goal({ status: complete })', fill: '#dcfce7', tokens: 12000, isComplete: true },
    ],
  };

  let goalState = null;
  const resetGoalState = () => {
    goalState = {
      step: 0,
      drawn: [],         // {idx, group, label, tokens, crumpled}
      tokens: 0,
      maxTokens: 1000000,
      compacted: false,
      stickyShown: false,
      stickyMerged: false,
      done: false,
    };
  };
  resetGoalState();

  // Static elements: thermometer, column outline, header text
  const drawGoalStatic = () => {
    clearChildren(goalSvg);
    clearChildren(goalOv);
    wobblers.goal = [];

    // Column outline (rendered with wobble)
    const renderCol = () => {
      // remove old static outline group
      const old = document.getElementById('goal-col-outline');
      if (old) old.remove();
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('id', 'goal-col-outline');
      const seed = Math.floor(Math.random() * 10000);
      const rect = goalRc.rectangle(GOAL.colX, GOAL.colTop, GOAL.colW, GOAL.colBottom - GOAL.colTop, {
        stroke: '#1f2937', strokeWidth: 2, roughness: 2.2, bowing: 1.5, seed,
      });
      g.appendChild(rect);
      goalSvg.appendChild(g);
    };
    renderCol();
    wobblers.goal.push(renderCol);

    // "context" label above column
    const colLbl = document.createElement('div');
    colLbl.className = 'label';
    colLbl.style.left = (GOAL.colX) + 'px';
    colLbl.style.top = (GOAL.colTop - 50) + 'px';
    colLbl.style.fontSize = '28px';
    colLbl.style.fontWeight = '700';
    colLbl.innerHTML = 'context window';
    goalOv.appendChild(colLbl);

    const colSub = document.createElement('div');
    colSub.className = 'label small';
    colSub.style.left = (GOAL.colX) + 'px';
    colSub.style.top = (GOAL.colTop - 22) + 'px';
    colSub.innerHTML = 'one long prompt &nbsp;·&nbsp; one process';
    goalOv.appendChild(colSub);

    // Thermometer on the LEFT
    const thermX = 220, thermTop = 120, thermBot = 800, thermW = 60;
    const renderTherm = () => {
      const old = document.getElementById('goal-therm');
      if (old) old.remove();
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('id', 'goal-therm');
      const seed = Math.floor(Math.random() * 10000);
      // tube
      g.appendChild(goalRc.rectangle(thermX, thermTop, thermW, thermBot - thermTop, {
        stroke: '#1f2937', strokeWidth: 2, roughness: 2.4, bowing: 1.6, seed,
      }));
      // bulb
      g.appendChild(goalRc.circle(thermX + thermW/2, thermBot + 38, 80, {
        stroke: '#1f2937', strokeWidth: 2, roughness: 2, bowing: 1, seed: seed+1,
        fill: '#fecaca', fillStyle: 'hachure', hachureGap: 6, hachureAngle: 45,
      }));
      // fill (token level)
      const pct = Math.min(1, goalState.tokens / goalState.maxTokens);
      const fillH = pct * (thermBot - thermTop - 6);
      if (fillH > 4) {
        const fillColor = pct > 0.75 ? '#fde68a' : '#bfdbfe';
        const hatch = pct > 0.75 ? '#f59e0b' : '#3b82f6';
        g.appendChild(goalRc.rectangle(thermX + 3, thermBot - fillH - 3, thermW - 6, fillH, {
          stroke: hatch, strokeWidth: 1.5, roughness: 2, bowing: 1, seed: seed+2,
          fill: fillColor, fillStyle: 'hachure', hachureGap: 5, hachureAngle: -45, fillWeight: 1.2,
        }));
      }
      // tick marks
      for (let i = 0; i <= 4; i++) {
        const y = thermTop + (i * (thermBot - thermTop)) / 4;
        g.appendChild(goalRc.line(thermX - 10, y, thermX, y, {
          stroke: '#475569', strokeWidth: 1.5, roughness: 1.8, seed: seed + 10 + i,
        }));
      }
      goalSvg.appendChild(g);
    };
    renderTherm();
    wobblers.goal.push(renderTherm);

    // Thermometer labels
    const thLbl = document.createElement('div');
    thLbl.className = 'label';
    thLbl.style.left = (thermX - 80) + 'px';
    thLbl.style.top = (thermTop - 50) + 'px';
    thLbl.style.fontSize = '24px';
    thLbl.style.fontWeight = '600';
    thLbl.innerHTML = 'token meter';
    goalOv.appendChild(thLbl);

    const thSub = document.createElement('div');
    thSub.className = 'label small';
    thSub.style.left = (thermX - 80) + 'px';
    thSub.style.top = (thermTop - 22) + 'px';
    thSub.innerHTML = 'used / 1,000,000';
    goalOv.appendChild(thSub);

    // tick markers on side
    ['100%','75%','50%','25%','0'].forEach((t, i) => {
      const y = thermTop + (i * (thermBot - thermTop)) / 4;
      const el = document.createElement('div');
      el.className = 'label tiny';
      el.style.left = (thermX - 60) + 'px';
      el.style.top = (y - 12) + 'px';
      el.textContent = t;
      goalOv.appendChild(el);
    });

    // 75% danger line
    const dangerY = thermTop + 0.25 * (thermBot - thermTop);
    const dangerG = document.createElementNS(NS, 'g');
    dangerG.appendChild(goalRc.line(thermX + thermW + 8, dangerY, thermX + thermW + 50, dangerY - 8, {
      stroke: '#b45309', strokeWidth: 1.8, roughness: 2, bowing: 1,
    }));
    goalSvg.appendChild(dangerG);
    const dangerLbl = document.createElement('div');
    dangerLbl.className = 'label tiny';
    dangerLbl.style.left = (thermX + thermW + 56) + 'px';
    dangerLbl.style.top = (dangerY - 22) + 'px';
    dangerLbl.style.color = '#b45309';
    dangerLbl.textContent = '↑ 75% → auto-compact';
    goalOv.appendChild(dangerLbl);

    // live token readout
    const tokRead = document.createElement('div');
    tokRead.id = 'goal-tok-read';
    tokRead.className = 'label';
    tokRead.style.left = (thermX - 40) + 'px';
    tokRead.style.top = (thermBot + 70) + 'px';
    tokRead.style.fontSize = '32px';
    tokRead.style.fontWeight = '700';
    tokRead.innerHTML = '0';
    goalOv.appendChild(tokRead);

    const tokReadSub = document.createElement('div');
    tokReadSub.id = 'goal-tok-pct';
    tokReadSub.className = 'label small';
    tokReadSub.style.left = (thermX - 40) + 'px';
    tokReadSub.style.top = (thermBot + 110) + 'px';
    tokReadSub.innerHTML = '0.0% of budget';
    goalOv.appendChild(tokReadSub);

    // Right-side annotation labels appear during the run (containers exist)
    const annot = document.createElement('div');
    annot.id = 'goal-annot';
    annot.style.position = 'absolute';
    annot.style.left = (GOAL.colX + GOAL.colW + 70) + 'px';
    annot.style.top = '120px';
    annot.style.width = '320px';
    annot.style.pointerEvents = 'none';
    goalOv.appendChild(annot);
  };

  const updateGoalReadout = () => {
    const r = document.getElementById('goal-tok-read');
    if (r) r.textContent = goalState.tokens.toLocaleString();
    const p = document.getElementById('goal-tok-pct');
    const pct = (goalState.tokens / goalState.maxTokens) * 100;
    if (p) p.innerHTML = pct.toFixed(1) + '% of budget';
    if (p) p.style.color = pct > 75 ? '#b45309' : '';
  };

  const drawGoalCell = (idx, def) => {
    // y based on index
    const y = GOAL.colTop + 8 + idx * (GOAL.cellH + 6);
    // group with overlay text + svg shape
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'goal-cell-svg');
    g.dataset.idx = idx;
    const seed = Math.floor(Math.random() * 10000);
    const opts = {
      stroke: '#1f2937', strokeWidth: 1.6, roughness: 1.8, bowing: 1.2, seed,
    };
    if (def.fill) {
      opts.fill = def.fill;
      opts.fillStyle = 'solid';
    }
    const rect = goalRc.rectangle(GOAL.colX + 8, y, GOAL.colW - 16, GOAL.cellH, opts);
    g.appendChild(rect);
    goalSvg.appendChild(g);

    // overlay text
    const lbl = document.createElement('div');
    lbl.className = 'label fade-in';
    lbl.style.left = (GOAL.colX + 22) + 'px';
    lbl.style.top = (y + 14) + 'px';
    lbl.style.fontSize = def.isSummary || def.isComplete ? '22px' : '20px';
    lbl.style.fontWeight = (def.isSummary || def.isComplete) ? '700' : '500';
    lbl.style.maxWidth = (GOAL.colW - 36) + 'px';
    lbl.innerHTML = def.label + (def.isComplete ? ' &nbsp;✓' : '');
    goalOv.appendChild(lbl);

    return { g, lbl, def, idx };
  };

  const crumpleCells = (range) => {
    // re-render those cells with high roughness, fade out
    range.forEach(idx => {
      const cell = goalState.drawn.find(c => c.idx === idx);
      if (!cell || cell.crumpled) return;
      cell.crumpled = true;
      // crumple svg
      const seed = Math.floor(Math.random() * 10000);
      const cg = cell.g;
      // re-render with extra crossed out lines
      const y = GOAL.colTop + 8 + idx * (GOAL.cellH + 6);
      const x = GOAL.colX + 8, w = GOAL.colW - 16, h = GOAL.cellH;
      const node1 = goalRc.line(x, y, x+w, y+h, { stroke: '#7f1d1d', strokeWidth: 2, roughness: 4, bowing: 3, seed });
      const node2 = goalRc.line(x+w, y, x, y+h, { stroke: '#7f1d1d', strokeWidth: 2, roughness: 4, bowing: 3, seed: seed+1 });
      cg.appendChild(node1);
      cg.appendChild(node2);
      cg.style.transition = 'opacity 800ms ease, transform 800ms ease';
      requestAnimationFrame(() => {
        cg.style.opacity = '0';
        cg.style.transform = 'translateY(-8px) rotate(-2deg)';
      });
      cell.lbl.classList.add('crumple');
      setTimeout(() => {
        cg.remove();
        cell.lbl.remove();
      }, 900);
    });
  };

  const showStickyNote = () => {
    if (goalState.stickyShown) return;
    goalState.stickyShown = true;
    const sticky = document.createElement('div');
    sticky.className = 'stickynote fade-in';
    sticky.id = 'goal-sticky';
    sticky.style.left = (GOAL.colX + GOAL.colW + 110) + 'px';
    sticky.style.top = '380px';
    sticky.innerHTML = 'also handle<br/>apple pay 🍎';
    goalOv.appendChild(sticky);

    // curly arrow from sticky to "next turn" direction
    const arrowG = document.createElementNS(NS, 'g');
    arrowG.setAttribute('id', 'goal-sticky-arrow');
    const path = goalRc.curve(
      [
        [GOAL.colX + GOAL.colW + 100, 410],
        [GOAL.colX + GOAL.colW + 60, 440],
        [GOAL.colX + GOAL.colW + 40, 470],
        [GOAL.colX + GOAL.colW + 20, 490],
      ],
      { stroke: '#b45309', strokeWidth: 2, roughness: 2, bowing: 2 }
    );
    arrowG.appendChild(path);
    // arrowhead
    arrowG.appendChild(goalRc.line(GOAL.colX + GOAL.colW + 24, 490, GOAL.colX + GOAL.colW + 12, 482, {
      stroke: '#b45309', strokeWidth: 2, roughness: 1.5,
    }));
    arrowG.appendChild(goalRc.line(GOAL.colX + GOAL.colW + 24, 490, GOAL.colX + GOAL.colW + 18, 502, {
      stroke: '#b45309', strokeWidth: 2, roughness: 1.5,
    }));
    goalSvg.appendChild(arrowG);

    const lbl = document.createElement('div');
    lbl.className = 'label tiny fade-in';
    lbl.style.left = (GOAL.colX + GOAL.colW + 50) + 'px';
    lbl.style.top = '510px';
    lbl.style.color = '#b45309';
    lbl.textContent = 'queued → next turn';
    lbl.id = 'goal-sticky-lbl';
    goalOv.appendChild(lbl);
  };

  const mergeStickyIntoColumn = () => {
    if (goalState.stickyMerged) return;
    goalState.stickyMerged = true;
    const sticky = document.getElementById('goal-sticky');
    if (sticky) {
      sticky.style.transition = 'all 700ms ease';
      sticky.style.opacity = '0';
      sticky.style.transform = 'translate(-200px, 80px) rotate(-12deg) scale(0.4)';
      setTimeout(() => sticky.remove(), 720);
    }
    const arr = document.getElementById('goal-sticky-arrow');

  // RALPH animation script — list of step functions
  const ralphSteps = [];
  // 6 iterations, each takes ~5 ticks
  for (let i = 1; i <= 6; i++) {
    ralphSteps.push(() => spawnProcess(i));
    ralphSteps.push(() => {});
    ralphSteps.push(() => {});
    ralphSteps.push(() => {});
  }
  ralphSteps.push(() => sentinelMatch());

  // ============= drivers =============
  const TICK_MS = 480;
  const drivers = { goal: null, ralph: null };
  const stepCounters = { goal: 0, ralph: 0 };

  const startGoal = () => {
    if (drivers.goal) return;
    drivers.goal = setInterval(() => {
      const i = stepCounters.goal++;
      if (i >= goalSteps.length) {
        clearInterval(drivers.goal);
        drivers.goal = null;
        return;
      }
      try { goalSteps[i](); } catch(e) { console.error(e); }
    }, TICK_MS);
  };

  const startRalph = () => {
    if (drivers.ralph) return;
    drivers.ralph = setInterval(() => {
      const i = stepCounters.ralph++;
      if (i >= ralphSteps.length) {
        clearInterval(drivers.ralph);
        drivers.ralph = null;
        return;
      }
      try { ralphSteps[i](); } catch(e) { console.error(e); }
    }, TICK_MS);
  };

  const resetGoal = () => {
    if (drivers.goal) { clearInterval(drivers.goal); drivers.goal = null; }
    stepCounters.goal = 0;
    resetGoalState();
    drawGoalStatic();
  };
  const resetRalph = () => {
    if (drivers.ralph) { clearInterval(drivers.ralph); drivers.ralph = null; }
    stepCounters.ralph = 0;
    resetRalphState();
    drawRalphStatic();
  };

  // initial draw
  drawGoalStatic();
  drawRalphStatic();

  // ============= tab switching =============
  let activeTab = 'goal';
  const captions = {
    goal: 'filling the prompt, watching the meter, compacting when it gets full',
    ralph: 'spawn → write to disk → die. the filesystem is the memory.',
  };
  const setTab = (name) => {
    activeTab = name;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === name);
    });
    document.querySelectorAll('.panel').forEach(p => {
      p.classList.toggle('active', p.id === 'panel-' + name);
    });
    document.getElementById('caption').textContent = captions[name];
    if (name === 'goal') {
      resetGoal();
      setTimeout(startGoal, 200);
    } else {
      resetRalph();
      setTimeout(startRalph, 200);
    }
  };

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => setTab(t.dataset.tab));
  });

  document.getElementById('replay').addEventListener('click', () => {
    setTab(activeTab);
  });

  // ============= IntersectionObserver autoplay =============
  let started = false;
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting && !started) {
        started = true;
        startGoal();
      }
    });
  }, { threshold: 0.3 });
  io.observe(document.getElementById('stage'));

})();
</script>
</body>
</html>
