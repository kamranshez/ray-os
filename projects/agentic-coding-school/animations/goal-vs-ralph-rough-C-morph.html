<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>/goal vs ralph — single canvas morph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  :root {
    --cream: #faf7f0;
    --slate: #1f2937;
    --slate2: #475569;
    --yellow: #fef3c7;
    --blue: #dbeafe;
    --green: #dcfce7;
    --pink: #fce7f3;
    --amber: #fed7aa;
    --paper: #fffdf6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--slate);
    font-family: 'Kalam', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }
  .hd {
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .hd h1 {
    font-family: 'Caveat', cursive;
    font-size: 44px;
    margin: 0;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .hd .sub {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--slate2);
    transform: rotate(-1deg);
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin: 18px 0 8px;
    position: relative;
  }
  .switch-wrap {
    display: flex;
    align-items: center;
    gap: 18px;
    user-select: none;
  }
  .switch-label {
    font-family: 'Caveat', cursive;
    font-size: 32px;
    font-weight: 700;
    color: var(--slate);
    opacity: 0.45;
    transition: opacity 240ms ease, transform 240ms ease;
    cursor: pointer;
  }
  .switch-label.active {
    opacity: 1;
    transform: scale(1.08);
  }
  .switch-label .tag {
    display: block;
    font-size: 16px;
    color: var(--slate2);
    font-weight: 400;
    margin-top: -6px;
  }
  .rocker {
    position: relative;
    width: 180px;
    height: 64px;
    cursor: pointer;
  }
  .rocker svg { display: block; }
  .knob {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 76px;
    height: 52px;
    transition: transform 600ms cubic-bezier(.65,.05,.36,1);
    pointer-events: none;
  }
  .rocker.right .knob { transform: translateX(92px); }

  .caption {
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: 26px;
    color: var(--slate2);
    margin: 6px 0 4px;
    min-height: 32px;
    transform: rotate(-0.4deg);
  }

  .stage-frame {
    position: relative;
    width: 100%;
    margin-top: 8px;
  }
  .stage-svg-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 720px;
    z-index: 1;
  }
  .el {
    position: absolute;
    transition:
      transform 1500ms cubic-bezier(.65,.05,.36,1),
      opacity 900ms ease,
      width 1500ms cubic-bezier(.65,.05,.36,1),
      height 1500ms cubic-bezier(.65,.05,.36,1);
    will-change: transform, opacity;
  }
  .el .label {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    font-weight: 600;
    color: var(--slate);
    line-height: 1.1;
    pointer-events: none;
  }
  .el .small {
    font-family: 'Kalam', sans-serif;
    font-size: 12px;
    color: var(--slate2);
  }
  .el svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .el .content {
    position: absolute;
    inset: 0;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    pointer-events: none;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .footer .legend {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--slate2);
  }
  .play-btn {
    font-family: 'Caveat', cursive;
    font-size: 24px;
    font-weight: 700;
    color: var(--slate);
    background: var(--paper);
    border: 0;
    padding: 10px 20px;
    cursor: pointer;
    position: relative;
    transition: transform 200ms ease;
  }
  .play-btn:hover { transform: translate(-1px, -1px); }
  .play-btn svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .play-btn span { position: relative; z-index: 1; }

  /* token meter fill */
  .meter-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(217, 119, 6, 0.45);
    transition: height 600ms ease, background 400ms ease;
  }
  .conv-cell {
    height: 14px;
    background: var(--paper);
    border: 1.5px solid #94a3b8;
    border-radius: 3px;
    margin: 3px 6px;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 220ms ease, transform 220ms ease, background 300ms ease;
  }
  .conv-cell.show { opacity: 1; transform: translateY(0); }
  .conv-cell.user { background: var(--blue); }
  .conv-cell.assistant { background: var(--paper); }
  .conv-cell.tool { background: var(--yellow); }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Kalam', sans-serif;
    font-size: 11px;
    color: var(--slate);
    margin: 1px 0;
  }
  .check {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 1.5px solid var(--slate);
    border-radius: 2px;
    text-align: center;
    line-height: 10px;
    font-size: 10px;
    color: #16a34a;
    font-weight: 700;
  }

  .progress-line {
    font-family: 'Kalam', sans-serif;
    font-size: 10px;
    color: var(--slate2);
    margin: 1px 0;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 300ms ease, transform 300ms ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress-line.show { opacity: 1; transform: translateY(0); }

  .git-line {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10px;
    color: var(--slate);
    margin: 1px 0;
    opacity: 0;
    transition: opacity 300ms ease;
    white-space: nowrap;
  }
  .git-line.show { opacity: 1; }
  .git-line .hash { color: #b45309; }

  .proc-spawn {
    transition: opacity 600ms ease, transform 800ms cubic-bezier(.34, 1.56, .64, 1);
  }
  .proc-spawn.dead {
    opacity: 0.15;
    filter: grayscale(0.7);
  }

  .pulse {
    animation: pulse 1200ms ease;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  .tool-chip {
    background: var(--yellow);
    border: 1.5px solid #ca8a04;
    border-radius: 5px;
    padding: 3px 10px;
    font-family: 'Kalam', sans-serif;
    font-size: 12px;
    color: var(--slate);
    display: inline-block;
  }

  .sentinel-eye {
    font-size: 28px;
  }

  .scribble {
    font-family: 'Caveat', cursive;
    font-size: 16px;
    color: var(--slate2);
  }

  .arrow-note {
    font-family: 'Caveat', cursive;
    font-size: 16px;
    color: #b45309;
    transform: rotate(-3deg);
  }

  .compact-flash {
    animation: compactFlash 1500ms ease;
  }
  @keyframes compactFlash {
    0% { background: var(--paper); }
    20% { background: var(--amber); }
    100% { background: var(--paper); }
  }

  .sentinel-match-flash {
    animation: matchFlash 1500ms ease;
  }
  @keyframes matchFlash {
    0%, 100% { background: var(--paper); }
    30%, 70% { background: var(--green); }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hd">
    <h1>/goal vs ralph</h1>
    <div class="sub">watch the same machine reshape into two different control loops</div>
  </div>

  <div class="toolbar">
    <div class="switch-wrap">
      <div class="switch-label active" id="lbl-goal">/goal<span class="tag">one process</span></div>
      <div class="rocker" id="rocker">
        <svg width="180" height="64" id="rocker-svg"></svg>
        <div class="knob"><svg width="76" height="52" id="knob-svg"></svg></div>
      </div>
      <div class="switch-label" id="lbl-ralph">ralph<span class="tag">many processes</span></div>
    </div>
  </div>

  <div class="caption" id="caption">single process · state in RAM · context grows + compacts</div>

  <div class="stage-frame">
    <svg class="stage-svg-bg" id="stage-bg" viewBox="0 0 1400 720" preserveAspectRatio="none"></svg>
    <div class="stage" id="stage"></div>
  </div>

  <div class="footer">
    <div class="legend">
      <span style="color:#7c3aed;">/goal</span> moves intent into the prompt itself
      <span style="margin: 0 10px; color: #94a3b8;">·</span>
      <span style="color:#0891b2;">ralph</span> moves intent into the filesystem
    </div>
    <button class="play-btn" id="play">
      <svg id="play-svg"></svg>
      <span>▶ play loop</span>
    </button>
  </div>
</div>

<script>
(() => {
  const rc = (svgEl) => rough.svg(svgEl);
  const stage = document.getElementById('stage');
  const stageBg = document.getElementById('stage-bg');
  const rocker = document.getElementById('rocker');
  const rockerSvg = document.getElementById('rocker-svg');
  const knobSvg = document.getElementById('knob-svg');
  const lblGoal = document.getElementById('lbl-goal');
  const lblRalph = document.getElementById('lbl-ralph');
  const caption = document.getElementById('caption');
  const playBtn = document.getElementById('play');
  const playSvg = document.getElementById('play-svg');

  // --- draw rocker switch (rough) ---
  {
    const r = rc(rockerSvg);
    rockerSvg.appendChild(r.rectangle(2, 2, 176, 60, {
      roughness: 2.2, stroke: '#1f2937', strokeWidth: 2, fill: '#fffdf6', fillStyle: 'solid', seed: 1,
    }));
    // dividing tick
    rockerSvg.appendChild(r.line(90, 8, 90, 56, { roughness: 2, stroke: '#94a3b8', strokeWidth: 1, seed: 2 }));
  }
  {
    const r = rc(knobSvg);
    knobSvg.appendChild(r.rectangle(2, 2, 72, 48, {
      roughness: 2, stroke: '#1f2937', strokeWidth: 2.5, fill: '#fef3c7', fillStyle: 'cross-hatch', hachureGap: 5, seed: 3,
    }));
  }
  // --- play button bg ---
  {
    const w = playBtn.offsetWidth || 160, h = playBtn.offsetHeight || 50;
    playSvg.setAttribute('width', w);
    playSvg.setAttribute('height', h);
    const r = rc(playSvg);
    playSvg.appendChild(r.rectangle(2, 2, w - 4, h - 4, {
      roughness: 2.4, stroke: '#1f2937', strokeWidth: 2, fill: '#fef3c7', fillStyle: 'solid', seed: 7,
    }));
  }

  // ------------- ELEMENTS -------------
  // Each element lives in the DOM as a positioned div with an SVG inside.
  // Positions/sizes/opacities are toggled between goalState / ralphState.

  const STAGE_W = 1400, STAGE_H = 720;

  // helper to render an element shell
  const makeEl = (id, opts = {}) => {
    const div = document.createElement('div');
    div.className = 'el';
    div.id = id;
    div.dataset.kind = opts.kind || 'box';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    div.appendChild(svg);
    const content = document.createElement('div');
    content.className = 'content';
    div.appendChild(content);
    stage.appendChild(div);
    return { div, svg, content };
  };

  // draw a rough box with label, sized to the element width/height
  const drawBox = (svg, w, h, fill, seed = 1, opts = {}) => {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const r = rc(svg);
    svg.appendChild(r.rectangle(3, 3, Math.max(2, w - 6), Math.max(2, h - 6), {
      roughness: opts.roughness ?? 2,
      stroke: opts.stroke ?? '#1f2937',
      strokeWidth: opts.strokeWidth ?? 2,
      fill: fill,
      fillStyle: opts.fillStyle ?? 'hachure',
      hachureGap: opts.hachureGap ?? 8,
      hachureAngle: opts.hachureAngle ?? -41,
      seed,
      strokeLineDash: opts.dashed ? [10, 6] : undefined,
    }));
  };

  const drawDashedBox = (svg, w, h, seed = 1) => {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const r = rc(svg);
    svg.appendChild(r.rectangle(3, 3, Math.max(2, w - 6), Math.max(2, h - 6), {
      roughness: 2.4, stroke: '#475569', strokeWidth: 1.5, fill: 'none', seed,
      strokeLineDash: [10, 7],
    }));
  };

  const drawPaper = (svg, w, h, seed = 1, fill = '#fffdf6') => {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const r = rc(svg);
    // page with folded corner
    const path = `M 4 4 L ${w - 18} 4 L ${w - 4} 18 L ${w - 4} ${h - 4} L 4 ${h - 4} Z`;
    svg.appendChild(r.path(path, {
      roughness: 2, stroke: '#1f2937', strokeWidth: 2, fill, fillStyle: 'solid', seed,
    }));
    // fold
    svg.appendChild(r.line(w - 18, 4, w - 18, 18, { roughness: 1.6, stroke: '#1f2937', strokeWidth: 1.5, seed: seed + 1 }));
    svg.appendChild(r.line(w - 18, 18, w - 4, 18, { roughness: 1.6, stroke: '#1f2937', strokeWidth: 1.5, seed: seed + 2 }));
  };

  const drawFunnel = (svg, w, h, seed = 1) => {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const r = rc(svg);
    const path = `M 6 6 L ${w - 6} 6 L ${w * 0.62} ${h * 0.65} L ${w * 0.62} ${h - 6} L ${w * 0.38} ${h - 6} L ${w * 0.38} ${h * 0.65} Z`;
    svg.appendChild(r.path(path, {
      roughness: 2.2, stroke: '#1f2937', strokeWidth: 2, fill: '#fed7aa', fillStyle: 'hachure', hachureGap: 6, seed,
    }));
  };

  const drawMagnify = (svg, w, h, seed = 1) => {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const r = rc(svg);
    svg.appendChild(r.circle(w * 0.42, h * 0.42, Math.min(w, h) * 0.55, {
      roughness: 2, stroke: '#1f2937', strokeWidth: 2.5, fill: '#dbeafe', fillStyle: 'solid', seed,
    }));
    svg.appendChild(r.line(w * 0.7, h * 0.7, w - 6, h - 6, {
      roughness: 1.6, stroke: '#1f2937', strokeWidth: 4, seed: seed + 1,
    }));
  };

  const drawShelf = (svg, w, h, seed = 1) => {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const r = rc(svg);
    svg.appendChild(r.line(4, 8, w - 4, 8, { roughness: 2, stroke: '#1f2937', strokeWidth: 3, seed }));
    svg.appendChild(r.line(20, 8, 14, h - 4, { roughness: 2, stroke: '#1f2937', strokeWidth: 1.5, seed: seed + 1 }));
    svg.appendChild(r.line(w - 20, 8, w - 14, h - 4, { roughness: 2, stroke: '#1f2937', strokeWidth: 1.5, seed: seed + 2 }));
  };

  // ===== element registry =====
  // Each entry: { id, goal, ralph, render(state, mode) }
  // state: { x, y, w, h, opacity }

  const elements = [];

  // 1) GOAL BOX
  const goalBox = makeEl('goalBox');
  goalBox.content.innerHTML = `
    <div class="label" style="font-family:'Caveat'; font-size:28px; font-weight:700;">ship checkout v2</div>
    <div class="small" id="goalBox-sub">goal · pinned in system prompt</div>
  `;
  elements.push({
    id: 'goalBox',
    refs: goalBox,
    goal: { x: 470, y: 40, w: 460, h: 90, opacity: 1, fill: '#dbeafe', seed: 11 },
    ralph: { x: 1110, y: 470, w: 230, h: 150, opacity: 1, fill: '#fffdf6', seed: 12 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (mode === 'goal') {
        drawBox(svg, s.w, s.h, '#dbeafe', s.seed, { fillStyle: 'solid' });
        content.innerHTML = `
          <div class="label" style="font-family:'Caveat'; font-size:30px; font-weight:700; text-align:center;">ship checkout v2</div>
          <div class="small" style="text-align:center; margin-top:2px;">goal · pinned in system prompt</div>
        `;
      } else {
        drawPaper(svg, s.w, s.h, s.seed);
        content.innerHTML = `
          <div class="label" style="font-family:'Kalam'; font-size:13px; font-weight:700; padding-left:6px;">prd.json</div>
          <div style="padding: 4px 10px 0; font-size: 11px;">
            <div class="checkbox-row"><span class="check" id="prd-c1">✓</span> auth: signup + login</div>
            <div class="checkbox-row"><span class="check" id="prd-c2">✓</span> cart: add/remove items</div>
            <div class="checkbox-row"><span class="check" id="prd-c3">✓</span> checkout: stripe webhook</div>
            <div class="checkbox-row"><span class="check" id="prd-c4">✓</span> orders: receipt email</div>
            <div class="checkbox-row"><span class="check" id="prd-c5">✓</span> admin: refund flow</div>
          </div>
        `;
      }
    },
  });

  // 2) TOOL PALETTE
  const toolPal = makeEl('toolPal');
  elements.push({
    id: 'toolPal',
    refs: toolPal,
    goal: { x: 950, y: 40, w: 380, h: 90, opacity: 1, seed: 21 },
    ralph: { x: 70, y: 90, w: 200, h: 60, opacity: 1, seed: 22 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (mode === 'goal') {
        // no outer box — just floating chips
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        svg.setAttribute('width', s.w);
        svg.setAttribute('height', s.h);
        content.innerHTML = `
          <div class="small" style="margin-bottom:4px;">tool palette · goalManager</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <span class="tool-chip">create_goal</span>
            <span class="tool-chip">get_goal</span>
            <span class="tool-chip">update_goal</span>
          </div>
        `;
      } else {
        drawBox(svg, s.w, s.h, '#dcfce7', s.seed, { fillStyle: 'solid' });
        content.innerHTML = `
          <div class="label" style="font-family:'Caveat'; font-size:22px; font-weight:700;">claude tools</div>
          <div class="small">edit · bash · read · grep</div>
        `;
      }
    },
  });

  // 3) TOKEN METER
  const tokenMeter = makeEl('tokenMeter');
  elements.push({
    id: 'tokenMeter',
    refs: tokenMeter,
    goal: { x: 70, y: 170, w: 110, h: 360, opacity: 1, seed: 31 },
    ralph: { x: 0, y: 0, w: 0, h: 0, opacity: 0, seed: 32 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (s.opacity < 0.05) return;
      drawBox(svg, s.w, s.h, '#fef3c7', s.seed, { fillStyle: 'solid' });
      content.innerHTML = `
        <div class="small" style="text-align:center;">tokens / 1M</div>
        <div style="position:relative; flex:1; margin: 6px 8px; border:1.5px solid #1f2937; background:#fffdf6; border-radius:3px; overflow:hidden;">
          <div class="meter-fill" id="meter-fill" style="height: 0%;"></div>
        </div>
        <div class="small" id="meter-pct" style="text-align:center;">0%</div>
      `;
    },
  });

  // 4) CONVERSATION COLUMN
  const convCol = makeEl('convCol');
  elements.push({
    id: 'convCol',
    refs: convCol,
    goal: { x: 470, y: 170, w: 460, h: 480, opacity: 1, seed: 41 },
    ralph: { x: 0, y: 0, w: 0, h: 0, opacity: 0, seed: 42 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (s.opacity < 0.05) return;
      drawBox(svg, s.w, s.h, '#fffdf6', s.seed, { fillStyle: 'solid' });
      content.innerHTML = `
        <div class="small" style="padding: 4px 10px;">conversation · turn <span id="turn-num">0</span></div>
        <div id="conv-stack" style="flex:1; overflow:hidden; padding: 4px 0;"></div>
      `;
      const stack = content.querySelector('#conv-stack');
      // pre-create cells
      for (let i = 0; i < 22; i++) {
        const c = document.createElement('div');
        c.className = 'conv-cell';
        stack.appendChild(c);
      }
    },
  });

  // 5) PROCESS BOUNDARY (single big dashed in goal; will draw spawned procs separately in ralph)
  const procBound = makeEl('procBound');
  procBound.div.style.zIndex = '0';
  elements.push({
    id: 'procBound',
    refs: procBound,
    goal: { x: 30, y: 20, w: 1340, h: 660, opacity: 1, seed: 51 },
    ralph: { x: 0, y: 0, w: 0, h: 0, opacity: 0, seed: 52 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (s.opacity < 0.05) return;
      drawDashedBox(svg, s.w, s.h, s.seed);
      content.innerHTML = `<div class="small" style="position:absolute; top:6px; right:14px;">one living process</div>`;
    },
  });

  // 6) STATE CHIP (goal only)
  const stateChip = makeEl('stateChip');
  elements.push({
    id: 'stateChip',
    refs: stateChip,
    goal: { x: 1180, y: 170, w: 180, h: 70, opacity: 1, seed: 61 },
    ralph: { x: 0, y: 0, w: 0, h: 0, opacity: 0, seed: 62 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (s.opacity < 0.05) return;
      drawBox(svg, s.w, s.h, '#fce7f3', s.seed, { fillStyle: 'solid' });
      content.innerHTML = `
        <div class="small">goal state</div>
        <div class="label" id="state-text" style="font-family:'Caveat'; font-size:24px; font-weight:700;">active</div>
      `;
    },
  });

  // 7) AUTO-COMPACT FUNNEL (goal only)
  const compactFunnel = makeEl('compactFunnel');
  elements.push({
    id: 'compactFunnel',
    refs: compactFunnel,
    goal: { x: 950, y: 260, w: 130, h: 110, opacity: 1, seed: 71 },
    ralph: { x: 0, y: 0, w: 0, h: 0, opacity: 0, seed: 72 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (s.opacity < 0.05) return;
      drawFunnel(svg, s.w, s.h, s.seed);
      content.innerHTML = `<div class="small" style="text-align:center; margin-top: 60px;">auto-compact<br/><span style="font-size:10px;">fires &gt; 75%</span></div>`;
    },
  });

  // 8) QUEUED MESSAGE (goal only)
  const queuedMsg = makeEl('queuedMsg');
  elements.push({
    id: 'queuedMsg',
    refs: queuedMsg,
    goal: { x: 1180, y: 280, w: 180, h: 110, opacity: 1, seed: 81 },
    ralph: { x: 0, y: 0, w: 0, h: 0, opacity: 0, seed: 82 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (s.opacity < 0.05) return;
      // sticky note look — slight tilt
      div.style.transform += ' rotate(-3deg)';
      drawBox(svg, s.w, s.h, '#fef3c7', s.seed, { fillStyle: 'solid' });
      content.innerHTML = `
        <div class="small" id="queue-status">queued message</div>
        <div class="label" style="font-family:'Caveat'; font-size:20px; line-height:1.1; margin-top:6px;">"also handle apple pay"</div>
        <div class="small" id="queue-deliver" style="margin-top:auto; font-size:10px; color:#94a3b8;">waits for turn boundary</div>
      `;
    },
  });

  // 9) PRD FILE — only ralph (goal config: opacity 0). Rendered separately at top-disk
  // Already used inside goalBox-as-prd in ralph mode — but spec wants a separate disk file.
  // We'll keep a *small* prd icon on the disk shelf in ralph and hide it in goal.
  const prdFile = makeEl('prdFile');
  elements.push({
    id: 'prdFile',
    refs: prdFile,
    goal: { x: 0, y: 0, w: 0, h: 0, opacity: 0, seed: 91 },
    ralph: { x: 350, y: 470, w: 180, h: 150, opacity: 1, seed: 92 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (s.opacity < 0.05) return;
      drawPaper(svg, s.w, s.h, s.seed, '#fef3c7');
      content.innerHTML = `
        <div class="label" style="font-family:'Kalam'; font-size:13px; font-weight:700; padding-left:6px;">prd.json</div>
        <div style="padding: 4px 10px 0; font-size: 10px;" id="prd-list">
          <div class="checkbox-row"><span class="check" id="r-c1"></span> S01 auth</div>
          <div class="checkbox-row"><span class="check" id="r-c2"></span> S02 cart</div>
          <div class="checkbox-row"><span class="check" id="r-c3"></span> S03 checkout</div>
          <div class="checkbox-row"><span class="check" id="r-c4"></span> S04 receipt</div>
          <div class="checkbox-row"><span class="check" id="r-c5"></span> S05 refund</div>
        </div>
      `;
    },
  });

  // 10) progress.txt
  const progressFile = makeEl('progressFile');
  elements.push({
    id: 'progressFile',
    refs: progressFile,
    goal: { x: 0, y: 0, w: 0, h: 0, opacity: 0, seed: 101 },
    ralph: { x: 560, y: 470, w: 240, h: 150, opacity: 1, seed: 102 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (s.opacity < 0.05) return;
      drawPaper(svg, s.w, s.h, s.seed, '#fffdf6');
      content.innerHTML = `
        <div class="label" style="font-family:'Kalam'; font-size:13px; font-weight:700; padding-left:6px;">progress.txt</div>
        <div id="progress-lines" style="padding: 4px 10px; overflow:hidden; flex:1;"></div>
      `;
      const lines = content.querySelector('#progress-lines');
      for (let i = 0; i < 6; i++) {
        const ln = document.createElement('div');
        ln.className = 'progress-line';
        lines.appendChild(ln);
      }
    },
  });

  // 11) git shelf
  const gitShelf = makeEl('gitShelf');
  elements.push({
    id: 'gitShelf',
    refs: gitShelf,
    goal: { x: 1180, y: 580, w: 180, h: 70, opacity: 1, seed: 111 },
    ralph: { x: 820, y: 470, w: 260, h: 150, opacity: 1, seed: 112 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (s.opacity < 0.05) return;
      drawPaper(svg, s.w, s.h, s.seed, '#fffdf6');
      if (mode === 'goal') {
        content.innerHTML = `
          <div class="label" style="font-family:'Kalam'; font-size:12px; font-weight:700; padding-left:6px;">.git/</div>
          <div style="padding: 4px 10px; font-family:ui-monospace,Menlo,monospace; font-size:10px;">
            <span style="color:#b45309;">42e7b3</span> ship checkout v2 ✓
          </div>
        `;
      } else {
        content.innerHTML = `
          <div class="label" style="font-family:'Kalam'; font-size:12px; font-weight:700; padding-left:6px;">.git/ log</div>
          <div id="git-lines" style="padding: 4px 10px;"></div>
        `;
        const lines = content.querySelector('#git-lines');
        for (let i = 0; i < 6; i++) {
          const ln = document.createElement('div');
          ln.className = 'git-line';
          lines.appendChild(ln);
        }
      }
    },
  });

  // 12) sentinel watcher (ralph only)
  const sentinel = makeEl('sentinel');
  elements.push({
    id: 'sentinel',
    refs: sentinel,
    goal: { x: 0, y: 0, w: 0, h: 0, opacity: 0, seed: 121 },
    ralph: { x: 70, y: 470, w: 240, h: 150, opacity: 1, seed: 122 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (s.opacity < 0.05) return;
      drawBox(svg, s.w, s.h, '#fce7f3', s.seed, { fillStyle: 'solid' });
      content.innerHTML = `
        <div class="label" style="font-family:'Kalam'; font-size:13px; font-weight:700;">sentinel</div>
        <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
          <span class="sentinel-eye">🔍</span>
          <div class="small" style="font-family:ui-monospace,Menlo,monospace; font-size:10px;">grep -q '&lt;promise&gt;<br/>COMPLETE&lt;/promise&gt;'</div>
        </div>
        <div class="small" id="sentinel-status" style="margin-top:6px; font-size:11px;">scanning iter stdout…</div>
      `;
    },
  });

  // 13–17) RALPH PROCESSES (5 small dashed boxes that spawn/die over iterations)
  // These exist only in ralph; in goal they collapse to opacity 0 at the goalBox area.
  const procColors = ['#dbeafe', '#dcfce7', '#fce7f3', '#fed7aa', '#fef3c7'];
  for (let i = 0; i < 5; i++) {
    const p = makeEl('proc' + i);
    p.div.classList.add('proc-spawn');
    elements.push({
      id: 'proc' + i,
      refs: p,
      isProc: true,
      idx: i,
      goal: { x: 700, y: 90, w: 0, h: 0, opacity: 0, seed: 200 + i },
      ralph: { x: 70 + i * 250, y: 200, w: 220, h: 230, opacity: 1, seed: 210 + i },
      render(s, mode) {
        const { div, svg, content } = this.refs;
        div.style.transform = `translate(${s.x}px, ${s.y}px)`;
        div.style.width = s.w + 'px';
        div.style.height = s.h + 'px';
        div.style.opacity = s.opacity;
        if (s.opacity < 0.05) { content.innerHTML = ''; return; }
        // dashed proc box
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        svg.setAttribute('width', s.w);
        svg.setAttribute('height', s.h);
        const r = rc(svg);
        svg.appendChild(r.rectangle(3, 3, s.w - 6, s.h - 6, {
          roughness: 2.4, stroke: '#475569', strokeWidth: 1.5, fill: procColors[this.idx], fillStyle: 'solid', seed: s.seed,
          strokeLineDash: [10, 6],
        }));
        content.innerHTML = `
          <div class="small" style="font-family:'Caveat'; font-size:18px; font-weight:700;">iter ${this.idx + 1}</div>
          <div class="small" style="font-size:10px;">claude --dangerously…</div>
          <div style="margin-top:6px; padding: 4px; background: rgba(255,255,255,0.6); border:1px dashed #94a3b8; border-radius:3px;">
            <div class="small" style="font-size:10px;">tokens</div>
            <div style="height:4px; background:#fffdf6; border:1px solid #1f2937; border-radius:2px; overflow:hidden; margin-top:2px;">
              <div class="proc-meter" style="height:100%; width: ${20 + this.idx * 12}%; background: rgba(217,119,6,0.45);"></div>
            </div>
          </div>
          <div class="small" style="margin-top:6px; font-family:ui-monospace,Menlo,monospace; font-size:9px;">
            read prd.json<br/>
            edit code<br/>
            git commit<br/>
            <span class="exit-line">exit 0</span>
          </div>
        `;
      },
    });
  }

  // shelf decoration (always shows in ralph)
  const shelfEl = makeEl('shelf');
  elements.push({
    id: 'shelf',
    refs: shelfEl,
    goal: { x: 0, y: 0, w: 0, h: 0, opacity: 0, seed: 301 },
    ralph: { x: 50, y: 450, w: 1300, h: 30, opacity: 0.7, seed: 302 },
    render(s, mode) {
      const { div, svg, content } = this.refs;
      div.style.transform = `translate(${s.x}px, ${s.y}px)`;
      div.style.width = s.w + 'px';
      div.style.height = s.h + 'px';
      div.style.opacity = s.opacity;
      if (s.opacity < 0.05) return;
      drawShelf(svg, s.w, s.h, s.seed);
      content.innerHTML = `<div class="scribble" style="position:absolute; bottom:-2px; left:50%; transform:translateX(-50%); font-size:14px;">— disk · the persistent shelf —</div>`;
    },
  });

  // ============== mode + render ==============
  let mode = 'goal';

  const applyMode = (m) => {
    mode = m;
    elements.forEach(el => el.render(el[m], m));
    // toggle UI
    rocker.classList.toggle('right', m === 'ralph');
    lblGoal.classList.toggle('active', m === 'goal');
    lblRalph.classList.toggle('active', m === 'ralph');
    caption.textContent = m === 'goal'
      ? 'single process · state in RAM · context grows + compacts'
      : 'many processes · state on disk · sentinel watches stdout';
    // mid-morph re-roughness (re-render at 0.3 and 0.7)
    setTimeout(() => elements.forEach(el => {
      // re-roughen by tweaking seed +1 then re-render at intermediate state we can't lerp easily,
      // but we re-call render which will keep the CSS-driven transform in flight.
      if (el.refs && el.refs.svg) {
        const cur = el[m];
        // Only re-render the rough strokes if visible.
        if (cur.opacity > 0.1 && el.id !== 'shelf' && !el.isProc) {
          // bump seed temporarily — purely cosmetic shake
          const s = { ...cur, seed: cur.seed + 17 };
          el.render(s, m);
        }
      }
    }), 450);
    setTimeout(() => elements.forEach(el => {
      if (el.refs && el.refs.svg) {
        const cur = el[m];
        if (cur.opacity > 0.1) el.render(cur, m);
      }
    }), 1050);

    // reset play state visuals
    resetPlayVisuals();
  };

  // initial render
  applyMode('goal');

  // toggle handlers
  const toggle = () => applyMode(mode === 'goal' ? 'ralph' : 'goal');
  rocker.addEventListener('click', toggle);
  lblGoal.addEventListener('click', () => mode !== 'goal' && applyMode('goal'));
  lblRalph.addEventListener('click', () => mode !== 'ralph' && applyMode('ralph'));

  // ===================== PLAY LOOP =====================
  let playing = false;
  let timers = [];

  const clearTimers = () => { timers.forEach(t => clearTimeout(t)); timers = []; };
  const after = (ms, fn) => timers.push(setTimeout(fn, ms));

  const resetPlayVisuals = () => {
    clearTimers();
    playing = false;
    // conv cells
    document.querySelectorAll('.conv-cell').forEach(c => {
      c.classList.remove('show');
      c.classList.remove('compact-flash');
      c.style.background = '';
    });
    const fill = document.getElementById('meter-fill');
    if (fill) { fill.style.height = '0%'; fill.style.background = 'rgba(217, 119, 6, 0.45)'; }
    const pct = document.getElementById('meter-pct');
    if (pct) pct.textContent = '0%';
    const turn = document.getElementById('turn-num');
    if (turn) turn.textContent = '0';
    const stateText = document.getElementById('state-text');
    if (stateText) stateText.textContent = 'active';

    // ralph
    document.querySelectorAll('.proc-spawn').forEach(p => {
      p.classList.remove('dead', 'pulse');
    });
    elements.filter(e => e.isProc).forEach(e => {
      const s = { ...e.ralph, opacity: mode === 'ralph' ? 0 : 0 };
      e.render(s, mode);
    });
    document.querySelectorAll('.progress-line').forEach(l => { l.classList.remove('show'); l.textContent = ''; });
    document.querySelectorAll('.git-line').forEach(l => { l.classList.remove('show'); l.innerHTML = ''; });
    document.querySelectorAll('#prd-list .check').forEach(c => c.textContent = '');
    const ss = document.getElementById('sentinel-status');
    if (ss) { ss.textContent = 'scanning iter stdout…'; ss.style.color = ''; }
    const sentDiv = document.getElementById('sentinel');
    if (sentDiv) sentDiv.classList.remove('sentinel-match-flash');
  };

  const playGoal = () => {
    if (playing) return;
    playing = true;
    resetPlayVisuals();
    // re-render so proc states are correct
    elements.filter(e => e.isProc).forEach(e => e.render(e.goal, 'goal'));

    const cells = document.querySelectorAll('#convCol .conv-cell');
    const fill = document.getElementById('meter-fill');
    const pctEl = document.getElementById('meter-pct');
    const turnEl = document.getElementById('turn-num');
    const stateText = document.getElementById('state-text');

    let pct = 0;
    const cellTypes = ['user', 'assistant', 'tool', 'assistant', 'tool', 'assistant', 'tool', 'assistant', 'user', 'assistant', 'tool', 'assistant'];

    // fill cells & climb meter
    cellTypes.forEach((type, i) => {
      after(400 + i * 500, () => {
        if (cells[i]) {
          cells[i].classList.add('show', type);
        }
        pct = Math.min(82, pct + 7);
        if (fill) {
          fill.style.height = pct + '%';
          fill.style.background = pct > 75 ? 'rgba(220, 38, 38, 0.55)' : 'rgba(217, 119, 6, 0.55)';
        }
        if (pctEl) pctEl.textContent = pct + '%';
        if (turnEl) turnEl.textContent = Math.floor(i / 3) + 1;
      });
    });

    // queued message arrives at 3.2s
    after(3200, () => {
      const qs = document.getElementById('queue-status');
      if (qs) qs.textContent = '📥 queued · waiting';
    });
    after(5800, () => {
      const qs = document.getElementById('queue-status');
      const qd = document.getElementById('queue-deliver');
      if (qs) qs.textContent = '✓ delivered';
      if (qd) { qd.textContent = 'merged at turn boundary'; qd.style.color = '#16a34a'; }
    });

    // compaction at ~6.5s — flash conv cells, drop pct
    after(6800, () => {
      cells.forEach(c => c.classList.add('compact-flash'));
      if (stateText) stateText.textContent = 'compacting';
    });
    after(7600, () => {
      // shrink — hide most, keep last 4
      cells.forEach((c, i) => {
        if (i < cells.length - 4) c.classList.remove('show');
      });
      pct = 28;
      if (fill) { fill.style.height = pct + '%'; fill.style.background = 'rgba(34, 197, 94, 0.55)'; }
      if (pctEl) pctEl.textContent = pct + '% (compacted)';
      if (stateText) stateText.textContent = 'active';
    });

    // resume — fill more cells
    after(8400, () => {
      [12, 13, 14, 15, 16, 17].forEach((idx, k) => {
        after(k * 480, () => {
          if (cells[idx]) cells[idx].classList.add('show', k % 2 === 0 ? 'assistant' : 'tool');
          pct = Math.min(60, pct + 4);
          if (fill) fill.style.height = pct + '%';
          if (pctEl) pctEl.textContent = pct + '%';
        });
      });
    });

    // complete
    after(12200, () => {
      if (stateText) { stateText.textContent = 'complete ✓'; stateText.style.color = '#16a34a'; }
      const gb = document.getElementById('goalBox');
      if (gb) gb.classList.add('pulse');
      after(1200, () => playing = false);
    });
  };

  const playRalph = () => {
    if (playing) return;
    playing = true;
    resetPlayVisuals();
    // make sure procs are at hidden start — opacity 0
    elements.filter(e => e.isProc).forEach(e => {
      const s = { ...e.ralph, opacity: 0, x: e.ralph.x, y: e.ralph.y + 30 };
      e.render(s, 'ralph');
    });

    const procDivs = [0, 1, 2, 3, 4].map(i => document.getElementById('proc' + i));
    const checks = ['r-c1', 'r-c2', 'r-c3', 'r-c4', 'r-c5'].map(id => document.getElementById(id));
    const progressLines = document.querySelectorAll('#progressFile .progress-line');
    const gitLines = document.querySelectorAll('#gitShelf .git-line');
    const progressTexts = [
      '## Iter 1 — S01 scaffold',
      '## Iter 2 — S01 PASS',
      '## Iter 3 — S02 PASS, S03 wiring',
      '## Iter 4 — S03 PASS, S04 email',
      '## Iter 5 — S04+S05 done · COMPLETE',
    ];
    const gitTexts = [
      { h: 'a3f1c2', m: 'feat: S01 scaffold' },
      { h: 'b71e09', m: 'feat: S01 signup/login' },
      { h: 'c2d8aa', m: 'feat: S02 cart' },
      { h: '9f0e44', m: 'feat: S03 webhook' },
      { h: '42e7b3', m: 'feat: S05 + COMPLETE' },
    ];

    for (let i = 0; i < 5; i++) {
      const t0 = 400 + i * 2200;
      // spawn
      after(t0, () => {
        const el = elements.find(e => e.id === 'proc' + i);
        const s = { ...el.ralph, opacity: 1 };
        el.render(s, 'ralph');
        if (procDivs[i]) procDivs[i].classList.add('pulse');
      });
      // checkbox + progress + git
      after(t0 + 1100, () => {
        if (checks[i]) checks[i].textContent = '✓';
        if (progressLines[i]) {
          progressLines[i].textContent = progressTexts[i];
          progressLines[i].classList.add('show');
        }
        if (gitLines[i]) {
          gitLines[i].innerHTML = `<span class="hash">${gitTexts[i].h}</span> ${gitTexts[i].m}`;
          gitLines[i].classList.add('show');
        }
      });
      // die
      if (i < 4) {
        after(t0 + 1800, () => {
          if (procDivs[i]) procDivs[i].classList.add('dead');
        });
      }
    }

    // sentinel match on iter 5
    after(400 + 4 * 2200 + 1500, () => {
      const ss = document.getElementById('sentinel-status');
      const sd = document.getElementById('sentinel');
      if (ss) { ss.innerHTML = '✓ <b>match</b>: &lt;promise&gt;COMPLETE&lt;/promise&gt; → exit 0'; ss.style.color = '#16a34a'; }
      if (sd) sd.classList.add('sentinel-match-flash');
      after(1500, () => playing = false);
    });
  };

  playBtn.addEventListener('click', () => {
    if (mode === 'goal') playGoal();
    else playRalph();
  });

  // keyboard: space to toggle, p to play
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.key === 'p' || e.key === 'P') playBtn.click();
  });
})();
</script>
</body>
</html>
