<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CONCEPT · hand-drawn deck</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  /* Excalidraw's actual fonts, from their public repo via jsdelivr */
  @font-face {
    font-family: 'Excalifont';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2') format('woff2');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Cascadia Code';
    src: url('https://cdn.jsdelivr.net/gh/excalidraw/excalidraw@master/packages/excalidraw/fonts/Cascadia/CascadiaCode-Regular.woff2') format('woff2');
    font-weight: normal; font-style: normal; font-display: swap;
  }
</style>
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  :root {
    --cream: #1c1c1c; --paper: #262626; --ink: #e8e8e8; --ink-soft: #9b9b9b;
    --ink-faint: #555555; --rule: #3a3a3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--cream); color: var(--ink);
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Excalifont', cursive; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 4px 4px; z-index: 1;
  }

  /* ===== STAGE (full height, no topbar, no sidebar) ===== */
  .stage {
    position: fixed; top: 0; bottom: 0; left: 0; right: 0;
    display: flex; flex-direction: column; z-index: 5;
  }
  .sketch-wrap {
    flex: 1 1 auto; min-height: 0; display: flex; align-items: center;
    justify-content: center; padding: 8px 14px 2px; position: relative;
  }
  .sketch-wrap svg {
    width: 100%; height: 100%; display: block; transition: opacity 250ms ease;
  }
  .sketch-wrap svg.fading { opacity: 0; }

  .caption-area {
    flex: 0 0 auto; text-align: center; padding: 2px 28px 50px;
    transition: opacity 250ms ease;
  }
  .caption-area.fading { opacity: 0; }
  .caption-area h2 {
    font-family: 'Excalifont', cursive; font-weight: 700; margin: 0 0 6px;
    font-size: clamp(1.6rem, 2.8vw, 2.35rem); line-height: 1.05; color: var(--ink);
  }
  .caption-area p {
    font-family: 'Excalifont', cursive; margin: 0 auto;
    font-size: clamp(1.1rem, 1.6vw, 1.45rem); line-height: 1.4;
    color: var(--ink-soft); max-width: 980px;
  }

  /* ===== TAP ZONES ===== */
  .tap-zone { position: fixed; top: 0; bottom: 0; width: 50%; z-index: 8; cursor: pointer; }
  .tap-zone.left { left: 0; }
  .tap-zone.right { right: 0; }

  /* draw-on animation */
  .draw-on path, .draw-on line, .draw-on circle, .draw-on rect {
    stroke-dasharray: 1500; stroke-dashoffset: 1500; animation: drawOn 700ms ease forwards;
  }
  @keyframes drawOn { to { stroke-dashoffset: 0; } }
  .draw-on text { opacity: 0; animation: fadeIn 500ms ease forwards; animation-delay: 400ms; }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>

<div class="stage">
  <div class="sketch-wrap" id="sketch-wrap">
    <svg id="sketch" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="caption-area" id="caption">
    <h2 id="headline">the idea</h2>
    <p id="caption-text">one sentence that says what this slide shows</p>
  </div>
</div>

<div class="tap-zone left" id="tap-left"></div>
<div class="tap-zone right" id="tap-right"></div>

<script>
(() => {
  // ===== Excalidraw dark palette. Use colour for MEANING, not decoration:
  //   rose / lightRed  = problem, cost, failure
  //   emerald / green  = success, done, the good path
  //   blue/violet/amber/yellow/card = neutral stages or categories
  //   soft = secondary text   faint = subtle lines
  const COLORS = {
    ink: '#e8e8e8', soft: '#9b9b9b', faint: '#555555', card: '#323232',
    yellow: '#4d4526', blue: '#1f3a4d', green: '#234a2c', pink: '#4d2a39',
    amber: '#523a23', paper: '#262626', emerald: '#5bd66f', rose: '#ff6b6b',
    lightRed: '#4d2626', softEmerald: '#234a2c', violet: '#352c4d', teal: '#1d4642',
    blueStroke: '#74b9e7', yellowStroke: '#f0a429',
  };
  const MONO = "'Cascadia Code', ui-monospace, monospace";

  // Optional per-slide text scale. Default 1 = author at native sizes.
  // A slide may set { scale: 1.2 } to bump all its non-mono text at once.
  let TEXT_SCALE = 1, MONO_SCALE = 1;

  const svg = document.getElementById('sketch');
  let rc = rough.svg(svg);
  const clearSvg = (s) => { while (s.firstChild) s.removeChild(s.firstChild); };

  const addRect = (x, y, w, h, opts={}) => {
    const node = rc.rectangle(x, y, w, h, {
      stroke: COLORS.ink, strokeWidth: 1.6, roughness: 2.0, bowing: 1.6,
      fill: opts.fill, fillStyle: opts.fillStyle || 'solid', fillWeight: 1, hachureGap: 6, ...opts
    });
    svg.appendChild(node); return node;
  };
  const addLine = (x1,y1,x2,y2, opts={}) => {
    const node = rc.line(x1,y1,x2,y2, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.5, ...opts });
    svg.appendChild(node); return node;
  };
  const addCircle = (cx,cy,d, opts={}) => {
    const node = rc.circle(cx,cy,d, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.6, ...opts });
    svg.appendChild(node); return node;
  };
  const addEllipse = (cx,cy,w,h, opts={}) => {
    const node = rc.ellipse(cx,cy,w,h, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.8, ...opts });
    svg.appendChild(node); return node;
  };
  const addPath = (path, opts={}) => {
    const node = rc.path(path, { stroke: COLORS.ink, strokeWidth: 1.4, roughness: 1.6, ...opts });
    svg.appendChild(node); return node;
  };
  const addText = (x,y, text, opts={}) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('font-family', opts.font || "'Excalifont', cursive");
    const isMono = (opts.font || '').indexOf('Cascadia') !== -1;
    t.setAttribute('font-size', (opts.size || 24) * (isMono ? MONO_SCALE : TEXT_SCALE));
    t.setAttribute('fill', opts.fill || COLORS.ink);
    t.setAttribute('text-anchor', opts.anchor || 'start');
    if (opts.weight) t.setAttribute('font-weight', opts.weight);
    if (opts.style) t.setAttribute('font-style', opts.style);
    t.textContent = text; svg.appendChild(t); return t;
  };
  // Curved arrow with a head. curve:0 = straight. Make it REACH its target
  // (end on the box edge), never overshoot into the next box or float in space.
  const addArrow = (x1,y1,x2,y2, opts={}) => {
    const curve = opts.curve != null ? opts.curve : 30;
    const cx = (x1+x2)/2 + curve; const cy = (y1+y2)/2 - Math.abs(curve)*0.6;
    addPath(`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`, opts);
    const angle = Math.atan2(y2-cy, x2-cx); const ah = opts.arrowSize || 14;
    addLine(x2,y2, x2 - ah*Math.cos(angle - Math.PI/7), y2 - ah*Math.sin(angle - Math.PI/7), opts);
    addLine(x2,y2, x2 - ah*Math.cos(angle + Math.PI/7), y2 - ah*Math.sin(angle + Math.PI/7), opts);
  };
  const addCheck = (cx, cy, size=18, color=COLORS.emerald) => {
    addPath(`M ${cx-size*0.6} ${cy} L ${cx-size*0.1} ${cy+size*0.5} L ${cx+size*0.7} ${cy-size*0.6}`, {
      stroke: color, strokeWidth: 3.5, roughness: 1.2
    });
  };
  const addCross = (cx, cy, size=18, color=COLORS.rose) => {
    addLine(cx-size*0.6, cy-size*0.6, cx+size*0.6, cy+size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
    addLine(cx-size*0.6, cy+size*0.6, cx+size*0.6, cy-size*0.6, { stroke: color, strokeWidth: 3.5, roughness: 1.2 });
  };

  // ============== SLIDES ==============
  // Each slide = one idea, one diagram. headline + caption go in the DOM
  // caption-area (below the canvas); the SVG holds the diagram and short
  // FUNCTIONAL labels only. Do NOT add a clever one-line "thesis" at the
  // bottom of the canvas — the caption already carries the message.
  const slides = [];

  // --- RECIPE 1: before / after (the turn) ---
  slides.push({
    headline: 'the idea',
    caption: 'one sentence that says what this slide shows. lowercase, no dashes',
    draw: () => {
      // problem (left, red)
      addRect(150, 300, 480, 260, { fill: COLORS.lightRed, fillStyle: 'solid', strokeWidth: 2.4 });
      addText(390, 410, 'the old way', { size: 30, anchor: 'middle', weight: 700 });
      addText(390, 455, 'slow . manual . fragile', { size: 20, anchor: 'middle', fill: COLORS.soft });
      addCross(390, 510, 22, COLORS.rose);
      // arrow across
      addArrow(640, 430, 950, 430, { stroke: COLORS.ink, strokeWidth: 2.4, curve: 0, arrowSize: 16 });
      // solution (right, green)
      addRect(970, 300, 480, 260, { fill: COLORS.softEmerald, fillStyle: 'solid', strokeWidth: 2.4 });
      addText(1210, 410, 'the new way', { size: 30, anchor: 'middle', weight: 700 });
      addText(1210, 455, 'one clean step', { size: 20, anchor: 'middle', fill: COLORS.soft });
      addCheck(1210, 505, 22, COLORS.emerald);
    }
  });

  // --- RECIPE 2: a pipeline (ordered stages) ---
  slides.push({
    headline: 'the pipeline',
    caption: 'stages run left to right; the last one is the payoff',
    draw: () => {
      const stages = [
        { t: 'gather', c: COLORS.blue },
        { t: 'process', c: COLORS.violet },
        { t: 'verify', c: COLORS.amber },
        { t: 'ship', c: COLORS.softEmerald },
      ];
      stages.forEach((s, i) => {
        const x = 150 + i*340;          // 290-wide boxes, 50px gaps, fits 1600
        addRect(x, 360, 290, 160, { fill: s.c, fillStyle: 'solid', strokeWidth: 2 });
        addText(x+145, 450, s.t, { size: 26, anchor: 'middle', weight: 700, font: MONO });
        // arrow lands in the 50px gap, does NOT overshoot into the next box
        if (i < stages.length-1) addArrow(x+290, 440, x+340, 440, { stroke: COLORS.ink, strokeWidth: 2, curve: 0, arrowSize: 12 });
      });
    }
  });

  // --- RECIPE 3: fan-out with results ---
  slides.push({
    headline: 'fan out, then judge',
    caption: 'one orchestrator splits the work; each worker returns a single pass or fail',
    draw: () => {
      // orchestrator on top
      addRect(620, 110, 360, 120, { fill: COLORS.yellow, fillStyle: 'solid', strokeWidth: 2.4 });
      addText(800, 165, 'orchestrator', { size: 26, anchor: 'middle', weight: 700, font: MONO });
      addText(800, 202, 'splits the work', { size: 18, anchor: 'middle', fill: COLORS.soft, style: 'italic' });
      // workers, evenly spaced, no overlap
      const lefts = [120, 420, 720, 1020, 1320];   // 200-wide, ~100 gaps
      const pass  = [true, true, false, true, true];
      lefts.forEach((X, i) => {
        const cx = X + 100;
        addArrow(800, 232, cx, 360, { stroke: COLORS.ink, strokeWidth: 1.6, curve: (cx-800)*0.035, arrowSize: 9 });
        addRect(X, 365, 200, 150, { fill: COLORS.blue, fillStyle: 'solid', strokeWidth: 2 });
        addText(cx, 430, 'worker', { size: 20, anchor: 'middle', weight: 700, font: MONO });
        addText(cx, 463, 'task ' + (i+1), { size: 17, anchor: 'middle', fill: COLORS.soft, font: MONO });
        if (pass[i]) { addCheck(cx-44, 590, 14, COLORS.emerald); addText(cx-14, 598, 'pass', { size: 19, anchor: 'start', fill: COLORS.emerald, weight: 700, font: MONO }); }
        else { addCross(cx-44, 590, 14, COLORS.rose); addText(cx-14, 598, 'fail', { size: 19, anchor: 'start', fill: COLORS.rose, weight: 700, font: MONO }); }
      });
    }
  });

  // ============== STATE / RENDER ==============
  let current = 0;
  const render = (idx, animate=true) => {
    const slide = slides[idx];
    const captionEl = document.getElementById('caption');
    captionEl.classList.add('fading');
    svg.classList.add('fading');
    setTimeout(() => {
      clearSvg(svg);
      rc = rough.svg(svg);
      TEXT_SCALE = slide.scale != null ? slide.scale : 1;
      MONO_SCALE = slide.monoScale != null ? slide.monoScale : 1;
      slide.draw();
      if (animate) { svg.classList.add('draw-on'); svg.getBoundingClientRect(); }
      document.getElementById('headline').textContent = slide.headline;
      document.getElementById('caption-text').textContent = slide.caption;
      svg.classList.remove('fading');
      captionEl.classList.remove('fading');
      if (animate) setTimeout(() => svg.classList.remove('draw-on'), 1200);
    }, 220);
  };
  const goTo = (idx) => { if (idx < 0 || idx >= slides.length || idx === current) return; current = idx; render(current); };
  const next = () => goTo(current + 1);
  const prev = () => goTo(current - 1);

  render(current);
  document.getElementById('tap-left').addEventListener('click', prev);
  document.getElementById('tap-right').addEventListener('click', next);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  });
})();
</script>
</body>
</html>
