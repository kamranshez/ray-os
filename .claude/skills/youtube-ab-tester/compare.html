<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thumbnail Comparison</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; }
  h1 { font-size: 28px; margin-bottom: 8px; color: #fff; }
  .subtitle { color: #888; margin-bottom: 32px; font-size: 14px; }

  .section-title { font-size: 20px; color: #f97316; margin: 40px 0 16px; border-bottom: 1px solid #222; padding-bottom: 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; margin-bottom: 40px; }

  .card {
    background: #141414;
    border: 2px solid #222;
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    cursor: default;
  }
  .card:hover { border-color: #444; transform: translateY(-2px); }

  .card img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
  }

  .card-info { padding: 12px 16px; }
  .card-title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; line-height: 1.3; }
  .card-meta { font-size: 12px; color: #888; }
  .card-views { color: #f97316; font-weight: 600; }

  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    background: #141414;
    border: 2px solid #222;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .pair:hover { border-color: #333; }

  .pair-side { }
  .pair-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 8px; }
  .pair-side img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 8px;
  }
  .pair-title { font-size: 13px; color: #fff; margin-top: 8px; font-weight: 500; }
  .pair-meta { font-size: 11px; color: #888; margin-top: 2px; }

  .current-thumb {
    max-width: 480px;
    border-radius: 12px;
    border: 2px solid #f97316;
    margin-bottom: 32px;
  }

  .tag { display: inline-block; background: #1a1a2e; color: #f97316; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 4px; }
</style>
</head>
<body>

<h1>Thumbnail Lab</h1>
<p class="subtitle">Anthropic Just Revealed Where Coding Is Heading &mdash; Ray Amjad</p>

<h2 class="section-title">Your Current Thumbnail</h2>
<img class="current-thumb" src="research/competitor-thumbnails/../../../output/../research/competitor-thumbnails/../../output/thumbnail_1.png"
     onerror="this.style.display='none'" />

<h2 class="section-title">Generated vs Inspiration</h2>
<p style="color:#888; margin-bottom:20px; font-size:13px;">Each generated thumbnail was inspired by a single competitor's style. Side-by-side for comparison.</p>

<div id="pairs"></div>

<h2 class="section-title">All Competitors (by views)</h2>
<div class="grid" id="competitors"></div>

<h2 class="section-title">All Generated</h2>
<div class="grid" id="generated"></div>

<script>
const competitors = [
  { id: "Ii99RU3mOJM", title: "Claude can now show you", channel: "Claude", views: "456.1k", style: "Clean product UI screenshot" },
  { id: "F4zSxfBe5R0", title: "Claude Code 2.0 Has Arrived (It's Insane)", channel: "Simon Scrapes", views: "156.5k", style: "Power word + icon grid" },
  { id: "EOPJwMAjUxk", title: "I Fed an AI My Real Codebase...", channel: "Alex Ziskind", views: "118.5k", style: "Face + laptop with number" },
  { id: "4Cb_l2LJAW8", title: "Claude Code + Karpathy's Autoresearch", channel: "Nick Saraev", views: "110.8k", style: "GitHub card + face" },
  { id: "UhRGHr7pgnU", title: "My Opencode Workflow As A Senior Engineer", channel: "DevOps Toolbox", views: "108.3k", style: "Face + laptop showing tool" },
  { id: "qKU-e0x2EmE", title: "Stop Fixing Your Claude Skills", channel: "Nick Saraev", views: "97.5k", style: "Bold text + pixel art" },
  { id: "QUHrntlfPo4", title: "Claude Code is Expensive. This MCP Fixes It", channel: "Better Stack", views: "81.9k", style: "Bold metric + pixel art" },
  { id: "japT66frdhM", title: "One Simple System Gave All My AI Tools a Memory", channel: "Nate B Jones", views: "77.9k", style: "Face + prop (receipt)" },
  { id: "wQ0duoTeAAU", title: "Build Self-Improving Claude Code Skills", channel: "Simon Scrapes", views: "61.9k", style: "Progressive visual metaphor" },
  { id: "ShTxTquBDxY", title: "Claude Code 2.0 MASSIVE Upgrade!", channel: "WorldofAI", views: "56.4k", style: "Text + icons with border" },
  { id: "vou38sa3IFY", title: "The NEW Claude Visualizer Just Replaced Startups", channel: "Leonardo Grigorio", views: "55.8k", style: "Text-heavy, dark bg" },
  { id: "Rgb-Kx-kkaA", title: "Claude Code, Paperclip & AI Agent Companies", channel: "Chase AI", views: "36.9k", style: "Icon mashup + question" },
  { id: "LqN_ItMqovA", title: "I Didn't Know This Was Possible Until Now", channel: "AI LABS", views: "23.3k", style: "Bold text blocks" },
  { id: "AURa5oPVvaE", title: "Anthropic's Engineers Hit the Same Wall", channel: "Solo Swift Crafter", views: "15.0k", style: "Pixel art + text" },
  { id: "nve6PtFJeo4", title: "Claude is taking over...", channel: "Prompt Engineering", views: "15.0k", style: "Icon pair + text" },
];

const pairs = [
  { gen: "batch-a/thumbnail_1.png", ref: "F4zSxfBe5R0", concept: "Power word + icon grid style" },
  { gen: "batch-a/thumbnail_2.png", ref: "EOPJwMAjUxk", concept: "Face + laptop with number style" },
  { gen: "batch-b/thumbnail_1.png", ref: "4Cb_l2LJAW8", concept: "GitHub card + face style" },
  { gen: "batch-b/thumbnail_2.png", ref: "qKU-e0x2EmE", concept: "Bold text + pixel art style" },
  { gen: "batch-c/thumbnail_1.png", ref: "QUHrntlfPo4", concept: "Bold metric + pixel art style" },
  { gen: "batch-c/thumbnail_2.png", ref: "japT66frdhM", concept: "Face + prop style" },
  { gen: "batch-d/thumbnail_1.png", ref: "wQ0duoTeAAU", concept: "Progressive visual metaphor style" },
  { gen: "batch-d/thumbnail_2.png", ref: "Ii99RU3mOJM", concept: "Clean product UI style" },
  { gen: "batch-e/thumbnail_1.png", ref: "UhRGHr7pgnU", concept: "Face + laptop showing tool style" },
  { gen: "batch-e/thumbnail_2.png", ref: "ShTxTquBDxY", concept: "Text + icons with border style" },
];

// Render competitor grid
const compGrid = document.getElementById('competitors');
competitors.forEach(c => {
  compGrid.innerHTML += `
    <div class="card">
      <img src="research/competitor-thumbnails/${c.id}.jpg" alt="${c.title}" loading="lazy" />
      <div class="card-info">
        <div class="card-title">${c.title}</div>
        <div class="card-meta">${c.channel} &middot; <span class="card-views">${c.views} views</span></div>
        <div style="margin-top:4px"><span class="tag">${c.style}</span></div>
      </div>
    </div>`;
});

// Render pairs
const pairsEl = document.getElementById('pairs');
pairs.forEach((p, i) => {
  const comp = competitors.find(c => c.id === p.ref);
  pairsEl.innerHTML += `
    <div class="pair">
      <div class="pair-side">
        <div class="pair-label">Inspiration &mdash; ${comp?.channel || ''}</div>
        <img src="research/competitor-thumbnails/${p.ref}.jpg" alt="Reference" loading="lazy" />
        <div class="pair-title">${comp?.title || ''}</div>
        <div class="pair-meta"><span class="card-views">${comp?.views || ''} views</span> &middot; ${p.concept}</div>
      </div>
      <div class="pair-side">
        <div class="pair-label">Generated #${i + 1}</div>
        <img src="output/${p.gen}" alt="Generated ${i+1}" loading="lazy"
             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 9%22><rect fill=%22%23222%22 width=%2216%22 height=%229%22/><text x=%228%22 y=%225%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%221.5%22>Generating...</text></svg>'" />
        <div class="pair-title">Variation ${i + 1}</div>
        <div class="pair-meta">${p.concept}</div>
      </div>
    </div>`;
});

// Render all generated
const genGrid = document.getElementById('generated');
pairs.forEach((p, i) => {
  genGrid.innerHTML += `
    <div class="card">
      <img src="output/${p.gen}" alt="Generated ${i+1}" loading="lazy"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 9%22><rect fill=%22%23222%22 width=%2216%22 height=%229%22/><text x=%228%22 y=%225%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%221.5%22>Generating...</text></svg>'" />
      <div class="card-info">
        <div class="card-title">Variation ${i + 1} &mdash; ${p.concept}</div>
        <div class="card-meta">Inspired by ${competitors.find(c => c.id === p.ref)?.channel || ''}</div>
      </div>
    </div>`;
});
</script>
</body>
</html>
