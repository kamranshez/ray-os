  - "@austin.marchese"  # auto-added 2026-06-29: 65.6k subs, 3 outliers (Claude Code/Skills/loop-engineering; "Stop Prompting Claude" Karpathy method 532k = 24.6x median / 8.1x views-sub)

# Keywords for niche discovery (yt-dlp ytsearch)
# Each keyword gets 20 results, filtered to last 24 hours
keywords:
  - "Claude Code"
  - "AI agents"
  - "agentic coding"
  - "vibe coding"
  - "RAG agents"
  - "cursor"
  - "codex"

# Outlier threshold (multiplier of channel median views)
min_multiplier: 3

# Auto-add: during keyword discovery, when a NEW channel (not already in
# channels: above) clears ALL of the bars below, the scout appends it to
# channels: automatically with an "# auto-added YYYY-MM-DD" comment, and
# announces it in the report + the Slack/Telegram summary. No approval gate --
# remove unwanted adds with `/youtube-outlier-scout remove @handle`.
auto_add:
  enabled: true
  min_subscribers: 5000      # channel size floor (yt-dlp channel_follower_count)
  min_outliers: 2            # recent videos that must be outliers (>= min_multiplier x channel median)
  # On-niche: at least one of these terms (case-insensitive) must appear across
  # the channel's recent video titles. Keeps off-topic viral channels out.
  niche_terms:
    - AI
    - agent
    - claude
    - cursor
    - codex
    - coding
    - LLM
    - automation
    - RAG
    - vibe
    - MCP
    - n8n
    - prompt
    - workflow

