# YouTube Outlier Scout -- Watchlist
# Channels to monitor for outlier videos + keywords for discovery
# Used by /youtube-outlier-scout skill

channels:
  - "@Chase-H-AI"
  - "@RobShocks"
  - "@mattpocockuk"
  - "@MattPocockAI"
  - "@intheworldofai"
  - "@ColeMedin"
  - "@nicksaraev"
  - "@aarondfrancis"
  - "@AgenticNolan"
  - "@aiDotEngineer"
  - "@BenAI92"
  - "@briancasel"
  - "@DavidOndrej"
  - "@DevelopersDigest"
  - "@Itssssss_Jack"
  - "@jacobdietle"
  - "@leonvanzyl"
  - "@MarcinTeodoru"
  - "@MetalSole"
  - "@nateherk"
  - "@rileybrownai"
  - "@dylandavisAI"
  - "@danny_why"  # auto-added 2026-06-15: 173k subs, 2 outliers (Claude Code/AI + faceless-YouTube niche)

# Keywords for niche discovery (yt-dlp ytsearch)
# Each keyword gets 20 results, filtered to last 24 hours
keywords:
  - "Claude Code"
  - "AI agents"
  - "agentic coding"
  - "vibe coding"
  - "RAG agents"
  - "cursor"
  - "codex"

# Outlier threshold (multiplier of channel median views)
min_multiplier: 3

# Auto-add: during keyword discovery, when a NEW channel (not already in
# channels: above) clears ALL of the bars below, the scout appends it to
# channels: automatically with an "# auto-added YYYY-MM-DD" comment, and
# announces it in the report + the Slack/Telegram summary. No approval gate --
# remove unwanted adds with `/youtube-outlier-scout remove @handle`.
auto_add:
  enabled: true
  min_subscribers: 5000      # channel size floor (yt-dlp channel_follower_count)
  min_outliers: 2            # recent videos that must be outliers (>= min_multiplier x channel median)
  # On-niche: at least one of these terms (case-insensitive) must appear across
  # the channel's recent video titles. Keeps off-topic viral channels out.
  niche_terms:
    - AI
    - agent
    - claude
    - cursor
    - codex
    - coding
    - LLM
    - automation
    - RAG
    - vibe
    - MCP
    - n8n
    - prompt
    - workflow

# Channels the scout evaluated for auto-add but rejected, with the date + reason.
# Prevents re-evaluating the same near-miss every run. Managed by the scout.
auto_add_rejected:
  - handle: "@OpenAI"
    date: "2026-06-15"
    reason: "official corporate channel (1.97M subs); clears bars mechanically but view variance makes outlier detection meaningless -- not a niche creator"
  - handle: "@JulianGoldieSEO"
    date: "2026-06-15"
    reason: "400k subs, only 1 outlier in last 10 (needs 2)"
  - handle: "@TechwithLucy"
    date: "2026-06-15"
    reason: "272k subs, 0 outliers in last 10 (needs 2)"
  - handle: "@aivtuber2866"
    date: "2026-06-15"
    reason: "90k subs, 0 outliers in last 10 (needs 2); Japanese-language AI channel"
  - handle: "@bridgemindai"
