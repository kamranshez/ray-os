# LinkedIn skill todos — drafts to finalize, posts to check engagement on, follow-ups.
# Read this file at the start of every linkedin skill invocation and surface
# anything overdue or pending before taking the user's request.
#
# Schema per entry:
#   task: short title
#   description: longer context, include file paths if relevant
#   due: YYYY-MM-DD or TBD
#   status: pending | in_progress | blocked | done
#   related_post: (optional) path to draft in references/post-history/
#
# Keep this list lean: remove entries once they're done rather than letting
# completed items accumulate.
