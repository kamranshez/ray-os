  .card .label { padding: 8px 12px; font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

// Populate full file lists from directory
async function init() {
  for (const [folder, files] of Object.entries(data)) {
    const grid = document.getElementById(folder);
    if (!grid) continue;
    files.forEach(file => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${folder}/${file}" loading="lazy" onclick="openLightbox(this.src)"><div class="label">${file.replace('.png','')}</div>`;
      grid.appendChild(card);
    });
  }
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('active');
  event.stopPropagation();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('active');
});

init();
